<title>Bảng Duyệt Khóa Học Philippines</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F4F6F8; --surface:#FFFFFF; --surface-2:#EDF0F3;
  --ink:#15181D; --ink-2:#59626F; --ink-3:#8A94A2;
  --line:#DCE1E7; --line-2:#C3CBD4;
  --keep:#12775A; --keep-bg:#E4F2EC; --keep-line:#8FCDB8;
  --edit:#9A6206; --edit-bg:#FBF0DA; --edit-line:#E5B860;
  --del:#AE2418;  --del-bg:#FBE7E4;  --del-line:#E89A90;
  --add:#6127C4;  --add-bg:#EFE8FC;  --add-line:#B79AEC;
  --focus:#2B6CB0;
  --sp:1rem;
  --radius:7px;
  --shadow:0 1px 2px rgba(16,20,26,.05),0 4px 14px -8px rgba(16,20,26,.16);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#101317; --surface:#181C22; --surface-2:#202630;
    --ink:#E7EAEE; --ink-2:#9BA5B2; --ink-3:#6F7986;
    --line:#2A313A; --line-2:#3A424D;
    --keep:#5CCF9F; --keep-bg:#123026; --keep-line:#2A6B52;
    --edit:#EAB040; --edit-bg:#332510; --edit-line:#7A5A1C;
    --del:#FF8D7E;  --del-bg:#361814;  --del-line:#7E3A31;
    --add:#B999F5;  --add-bg:#261A3D;  --add-line:#5B3F95;
    --focus:#7FB2E8;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px -8px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --ground:#101317; --surface:#181C22; --surface-2:#202630;
  --ink:#E7EAEE; --ink-2:#9BA5B2; --ink-3:#6F7986;
  --line:#2A313A; --line-2:#3A424D;
  --keep:#5CCF9F; --keep-bg:#123026; --keep-line:#2A6B52;
  --edit:#EAB040; --edit-bg:#332510; --edit-line:#7A5A1C;
  --del:#FF8D7E;  --del-bg:#361814;  --del-line:#7E3A31;
  --add:#B999F5;  --add-bg:#261A3D;  --add-line:#5B3F95;
  --focus:#7FB2E8;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px -8px rgba(0,0,0,.6);
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:Archivo,"IBM Plex Sans",system-ui,sans-serif;
  margin:0;text-wrap:balance;letter-spacing:-.01em;line-height:1.25}
a{color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}

/* ---------- chrome ---------- */
.topbar{
  position:sticky;top:0;z-index:20;background:var(--surface);
  border-bottom:1px solid var(--line);
}
.topbar-in{max-width:1180px;margin:0 auto;padding:.7rem 1.25rem;
  display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.brand{font-family:Archivo;font-weight:700;font-size:.95rem;letter-spacing:-.01em}
.brand span{display:block;font-family:"IBM Plex Sans";font-weight:400;
  font-size:.72rem;color:var(--ink-3);letter-spacing:.04em;text-transform:uppercase}
.crumb{display:flex;align-items:center;gap:.45rem;font-size:.82rem;color:var(--ink-2);
  flex:1;min-width:0;flex-wrap:wrap}
.crumb a{text-decoration:none;color:var(--ink-2);border-bottom:1px solid transparent}
.crumb a:hover{color:var(--ink);border-bottom-color:var(--line-2)}
.crumb i{font-style:normal;color:var(--ink-3)}
.stamp{font-size:.72rem;color:var(--ink-3);white-space:nowrap}

main{max-width:1180px;margin:0 auto;padding:1.5rem 1.25rem 5rem}

/* ---------- legend ---------- */
.legend{display:flex;gap:.4rem;flex-wrap:wrap;margin:0 0 1.4rem}
.lg{display:inline-flex;align-items:center;gap:.4rem;font-size:.78rem;
  padding:.28rem .6rem;border-radius:100px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.dot.keep{background:var(--keep)} .dot.edit{background:var(--edit)}
.dot.delete{background:var(--del)} .dot.add{background:var(--add)}

/* ---------- page 1 ---------- */
.lede{max-width:62ch;margin:0 0 1.6rem;color:var(--ink-2);font-size:.95rem}
.lede strong{color:var(--ink);font-weight:600}
.grouphead{display:flex;align-items:baseline;gap:.7rem;margin:2rem 0 .9rem}
.grouphead:first-of-type{margin-top:0}
.grouphead h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.09em;color:var(--ink-3);font-weight:600}
.grouphead hr{flex:1;border:0;border-top:1px solid var(--line);margin:0}
.cards{display:grid;gap:.85rem;grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.card{
  display:block;text-decoration:none;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);padding:1.05rem 1.1rem;
  transition:border-color .13s,box-shadow .13s,transform .13s;
}
.card:hover{border-color:var(--line-2);box-shadow:var(--shadow);transform:translateY(-1px)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:.8rem}
.grade{font-family:Archivo;font-weight:700;font-size:1.22rem;letter-spacing:-.02em}
.pill{font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;font-weight:600;
  padding:.2rem .5rem;border-radius:4px;white-space:nowrap;
  background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.pill.new{background:var(--add-bg);color:var(--add);border-color:var(--add-line)}
.pill.wait{background:var(--surface-2);color:var(--ink-3)}
.flag{display:inline-flex;align-items:center;gap:.3rem;font-size:.75rem;
  padding:.16rem .45rem;border-radius:4px;font-weight:600;
  background:var(--del-bg);color:var(--del);border:1px solid var(--del-line)}
.flag.none{background:var(--keep-bg);color:var(--keep);border-color:var(--keep-line);font-weight:500}
.cflags{display:flex;gap:.4rem;margin-top:.6rem;flex-wrap:wrap}
/* điểm tổng trên thẻ khóa */
.score{display:flex;align-items:baseline;gap:.25rem;font-family:"IBM Plex Mono";
  font-weight:500;line-height:1}
.score b{font-size:1.5rem;font-variant-numeric:tabular-nums}
.score i{font-style:normal;font-size:.78rem;color:var(--ink-3)}
.score.s-hi b{color:var(--keep)} .score.s-mid b{color:var(--edit)} .score.s-lo b{color:var(--del)}
.sparks{display:flex;gap:2px;margin-top:.55rem;align-items:flex-end;height:26px}
.sparks div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.sparks i{display:block;border-radius:1px 1px 0 0;background:var(--line-2)}
.sparks i.s-hi{background:var(--keep)} .sparks i.s-mid{background:var(--edit)} .sparks i.s-lo{background:var(--del)}
.sparklab{display:flex;gap:2px;margin-top:.25rem;font-size:.58rem;color:var(--ink-3);
  letter-spacing:.02em;text-transform:uppercase}
.sparklab span{flex:1;text-align:center;overflow:hidden;white-space:nowrap}
/* bảng điểm chi tiết trang 2 */
.scorecard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:1.1rem 1.25rem;margin:0 0 1.5rem}
.scorecard h3{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-bottom:.2rem}
.sc-top{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;
  padding-bottom:.85rem;margin-bottom:.85rem;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sc-big{font-family:"IBM Plex Mono";font-size:2.3rem;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.sc-big span{font-size:1rem;color:var(--ink-3)}
.sc-row{display:grid;grid-template-columns:9.5rem 1fr;gap:.7rem 1rem;align-items:center;
  padding:.45rem 0}
.sc-row + .sc-row{border-top:1px dashed var(--line)}
.sc-name{font-size:.88rem;font-weight:600}
.sc-bar{display:flex;align-items:center;gap:.7rem}
.sc-track{flex:1;height:8px;border-radius:100px;background:var(--surface-2);overflow:hidden;min-width:60px}
.sc-track i{display:block;height:100%;border-radius:100px}
.sc-track i.s-hi{background:var(--keep)} .sc-track i.s-mid{background:var(--edit)} .sc-track i.s-lo{background:var(--del)}
.sc-num{font-family:"IBM Plex Mono";font-size:.92rem;font-weight:500;width:2.6rem;
  text-align:right;font-variant-numeric:tabular-nums}
.sc-note{grid-column:2;font-size:.83rem;color:var(--ink-2);margin-top:-.2rem}
/* bảng so sánh điểm toàn bộ khóa */
.cmp{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:1.1rem 1.25rem;margin:0 0 1.8rem;overflow-x:auto}
.cmp h3{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-bottom:.2rem}
.cmp .sub{font-size:.83rem;color:var(--ink-3);margin-bottom:.9rem}
.cmp table{border-collapse:collapse;width:100%;min-width:620px;font-size:.84rem}
.cmp th,.cmp td{padding:.4rem .5rem;text-align:center;border-bottom:1px solid var(--line)}
.cmp th{font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-3);
  font-weight:600;vertical-align:bottom;padding-bottom:.55rem}
.cmp th:first-child,.cmp td:first-child{text-align:left;white-space:nowrap}
.cmp td:first-child a{text-decoration:none;font-weight:600}
.cmp td:first-child a:hover{text-decoration:underline;text-underline-offset:3px}
.cmp tbody tr:hover{background:var(--surface-2)}
.cmp .grp td{background:var(--surface-2);font-size:.68rem;text-transform:uppercase;
  letter-spacing:.07em;color:var(--ink-3);font-weight:600;text-align:left;padding:.5rem}
.cmp .n{font-family:"IBM Plex Mono";font-variant-numeric:tabular-nums;
  display:inline-block;min-width:2.1rem;padding:.1rem .3rem;border-radius:3px;font-weight:500}
.cmp .n.s-hi{background:var(--keep-bg);color:var(--keep)}
.cmp .n.s-mid{background:var(--edit-bg);color:var(--edit)}
.cmp .n.s-lo{background:var(--del-bg);color:var(--del)}
.cmp .n.s-na{color:var(--ink-3)}
.cmp .avg{font-weight:600}
.cmp .note{font-size:.8rem;color:var(--ink-2);margin-top:.8rem;max-width:70ch}
.candfor{font-size:.72rem;color:var(--add);background:var(--add-bg);
  border:1px solid var(--add-line);border-radius:4px;padding:.16rem .45rem;
  display:inline-block;margin-top:.5rem}
@media(max-width:620px){.sc-row{grid-template-columns:1fr}.sc-note{grid-column:1}}
.src{font-size:.78rem;color:var(--ink-3);margin:.35rem 0 .1rem}
.src b{font-weight:500;color:var(--ink-2)}
.cnum{display:flex;gap:1.3rem;margin:.85rem 0 .7rem}
.cnum div{display:flex;flex-direction:column}
.cnum b{font-family:"IBM Plex Mono";font-size:1.12rem;font-weight:500;font-variant-numeric:tabular-nums}
.cnum span{font-size:.7rem;color:var(--ink-3);letter-spacing:.03em}
.bar{display:flex;height:7px;border-radius:100px;overflow:hidden;background:var(--surface-2);gap:1px}
.bar i{display:block}
.bar i.keep{background:var(--keep)} .bar i.edit{background:var(--edit)}
.bar i.delete{background:var(--del)} .bar i.add{background:var(--add)}
.barkey{display:flex;gap:.75rem;margin-top:.55rem;font-size:.74rem;color:var(--ink-2);flex-wrap:wrap}
.barkey span{display:inline-flex;align-items:center;gap:.32rem}

/* ---------- page 2 ---------- */
.pagehead{margin-bottom:1.3rem}
.pagehead h1{font-size:1.55rem;margin-bottom:.3rem}
.pagehead p{margin:0;color:var(--ink-2);font-size:.9rem}
.verdict{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--ink-3);
  border-radius:var(--radius);padding:.9rem 1.1rem;margin:1.1rem 0 1.5rem;font-size:.92rem}
.verdict h3{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-bottom:.4rem}
.summ{display:grid;gap:.85rem;margin:0 0 1.6rem}
@media(min-width:820px){.summ{grid-template-columns:1fr 1fr}}
.summ section{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1rem 1.1rem}
.summ h3{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-bottom:.5rem}
.summ .md{font-size:.88rem;color:var(--ink-2);max-height:19rem;overflow:auto}

.chapter{background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);margin-bottom:.7rem;overflow:hidden}
.chapter.a-edit{border-left:3px solid var(--edit)}
.chapter.a-delete{border-left:3px solid var(--del)}
.chapter.a-add{border-left:3px solid var(--add)}
.chapter.a-keep{border-left:3px solid var(--keep-line)}
.chead{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;
  padding:.85rem 1rem;background:none;border:0;cursor:pointer;color:inherit;font:inherit}
.chead:hover{background:var(--surface-2)}
.chev{color:var(--ink-3);flex:none;transition:transform .15s;font-size:.8rem}
.chapter.open .chev{transform:rotate(90deg)}
.ctitle{flex:1;min-width:0;font-family:Archivo;font-weight:600;font-size:1rem}
.cmeta{font-size:.75rem;color:var(--ink-3);white-space:nowrap;font-family:"IBM Plex Mono"}
.tag{font-size:.68rem;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  padding:.16rem .45rem;border-radius:4px;white-space:nowrap;border:1px solid}
.tag.keep{color:var(--keep);background:var(--keep-bg);border-color:var(--keep-line)}
.tag.edit{color:var(--edit);background:var(--edit-bg);border-color:var(--edit-line)}
.tag.delete{color:var(--del);background:var(--del-bg);border-color:var(--del-line)}
.tag.add{color:var(--add);background:var(--add-bg);border-color:var(--add-line)}
.cnote{padding:0 1rem .8rem 2.4rem;font-size:.86rem;color:var(--ink-2);margin-top:-.3rem}
.cbody{display:none;border-top:1px solid var(--line);padding:.3rem 0 .5rem}
.plansteps{margin:.2rem 0 .8rem 2.4rem;padding:.6rem .8rem;border-radius:5px;
  background:var(--surface-2);border:1px solid var(--line);font-size:.84rem}
.plansteps h4{font-size:.68rem;text-transform:uppercase;letter-spacing:.07em;
  color:var(--ink-3);margin:0 0 .35rem;font-family:"IBM Plex Sans";font-weight:600}
.plansteps ol{margin:0;padding-left:1.15rem;color:var(--ink-2)}
.plansteps li{margin-bottom:.22rem}
.section .plansteps{margin-left:0}
.chapter.open .cbody{display:block}
.section{padding:.55rem 1rem .55rem 2.4rem}
.section + .section{border-top:1px dashed var(--line)}
.shead{display:flex;align-items:center;gap:.6rem}
.stitle{flex:1;min-width:0;font-weight:600;font-size:.9rem}
.snote{font-size:.83rem;color:var(--ink-2);margin:.3rem 0 .1rem}
.acts{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.5rem}
.act{display:inline-flex;align-items:center;gap:.35rem;text-decoration:none;
  font-size:.78rem;padding:.22rem .5rem;border-radius:4px;
  border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);
  max-width:100%;transition:border-color .12s}
.act:hover{border-color:var(--line-2);color:var(--ink)}
.act.a-edit{border-color:var(--edit-line);background:var(--edit-bg);color:var(--edit)}
.act.a-delete{border-color:var(--del-line);background:var(--del-bg);color:var(--del)}
.act.a-add{border-color:var(--add-line);background:var(--add-bg);color:var(--add)}
.act .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:30ch}
.act .k{font-size:.66rem;opacity:.72;font-family:"IBM Plex Mono"}

/* ---------- page 3 ---------- */
.detail{display:grid;gap:1.1rem}
@media(min-width:900px){.detail{grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);align-items:start}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:1.15rem 1.25rem}
.panel h3{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-bottom:.7rem}
.facts{display:flex;flex-wrap:wrap;gap:1.4rem;margin-bottom:1.1rem}
.facts div{display:flex;flex-direction:column}
.facts b{font-family:"IBM Plex Mono";font-size:1.05rem;font-weight:500;font-variant-numeric:tabular-nums}
.facts span{font-size:.7rem;color:var(--ink-3);letter-spacing:.03em}
.issue{display:flex;gap:.6rem;padding:.6rem .75rem;border-radius:5px;margin-bottom:.45rem;
  font-size:.87rem;background:var(--surface-2);border:1px solid var(--line)}
.issue.high{background:var(--del-bg);border-color:var(--del-line)}
.issue.med{background:var(--edit-bg);border-color:var(--edit-line)}
.sev{font-size:.64rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:.1rem .35rem;border-radius:3px;height:fit-content;white-space:nowrap;
  background:var(--surface);border:1px solid var(--line-2);color:var(--ink-2)}
.issue.high .sev{color:var(--del);border-color:var(--del-line)}
.issue.med .sev{color:var(--edit);border-color:var(--edit-line)}
.content{background:var(--surface-2);border:1px solid var(--line);border-radius:5px;
  padding:.9rem 1rem;font-size:.88rem;color:var(--ink-2);max-height:26rem;overflow:auto;
  white-space:pre-wrap;word-break:break-word}
.content.empty{color:var(--ink-3);font-style:italic;white-space:normal}

/* track train */
.track{position:sticky;top:4.2rem}
.prog{display:flex;align-items:baseline;gap:.5rem;margin-bottom:.5rem}
.prog b{font-family:"IBM Plex Mono";font-size:1.6rem;font-weight:500}
.prog span{font-size:.78rem;color:var(--ink-3)}
.progbar{height:6px;border-radius:100px;background:var(--surface-2);overflow:hidden;margin-bottom:1rem}
.progbar i{display:block;height:100%;background:var(--keep);transition:width .25s}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.1rem}
.steps li{position:relative}
.steps label{display:flex;gap:.6rem;align-items:flex-start;padding:.55rem .6rem;
  border-radius:5px;cursor:pointer;font-size:.87rem;transition:background .12s}
.steps label:hover{background:var(--surface-2)}
.steps input{margin:.32rem 0 0;accent-color:var(--keep);flex:none;width:15px;height:15px;cursor:pointer}
.steps input:checked + .stxt{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px}
.stxt{flex:1;min-width:0}
.stepnum{font-family:"IBM Plex Mono";font-size:.7rem;color:var(--ink-3);
  border:1px solid var(--line);border-radius:3px;padding:0 .28rem;margin-right:.4rem}
.trail{margin-top:1rem;padding-top:.9rem;border-top:1px solid var(--line);font-size:.78rem;color:var(--ink-3)}
.trail div{display:flex;justify-content:space-between;gap:1rem;padding:.18rem 0}
.reset{margin-top:.8rem;font-size:.76rem;color:var(--ink-3);background:none;border:0;
  padding:.3rem 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-family:inherit}
.reset:hover{color:var(--ink-2)}
.nostep{font-size:.86rem;color:var(--ink-3);font-style:italic}

.navrow{display:flex;justify-content:space-between;gap:1rem;margin-top:1.4rem;font-size:.85rem}
.navrow a{color:var(--ink-2);text-decoration:none;padding:.4rem .7rem;border:1px solid var(--line);
  border-radius:5px;background:var(--surface);max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.navrow a:hover{border-color:var(--line-2);color:var(--ink)}

.md p{margin:0 0 .6rem} .md p:last-child{margin-bottom:0}
.md ul,.md ol{margin:.3rem 0 .7rem;padding-left:1.2rem}
.md li{margin-bottom:.2rem}
.md code{font-family:"IBM Plex Mono";font-size:.86em;background:var(--surface-2);
  padding:.1em .32em;border-radius:3px;border:1px solid var(--line)}
.md strong{color:var(--ink);font-weight:600}
.md h4{font-size:.92rem;margin:.8rem 0 .35rem}
.md table{border-collapse:collapse;font-size:.85rem;margin:.5rem 0;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:.32rem .55rem;text-align:left}
.md th{background:var(--surface-2);font-weight:600}

.empty-state{text-align:center;padding:3.5rem 1rem;color:var(--ink-3)}
.empty-state h2{font-size:1.1rem;color:var(--ink-2);margin-bottom:.4rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="topbar"><div class="topbar-in">
  <div class="brand">Duyệt khóa học<span>Philippines · bản tiếng Việt</span></div>
  <nav class="crumb" id="crumb"></nav>
  <div class="stamp mono" id="stamp"></div>
</div></div>

<script>
window.REVIEW_DATA = {"generatedAt":"2026-08-31 14:53","courses":[{"key":"grade-1-2","label":"Lớp 1 – 2","group":"Khóa chính","source":"scratchjr-grade-1-2","isNew":true,"reviewed":true,"title":"Lớp 1 – 2","summary":{"structure":"**Khóa soạn mới hoàn toàn — không có khóa nguồn.** Kho 41 khóa hiện có không có gì dùng được cho trẻ 6–7 tuổi: khóa Scratch dễ nhất (`instant-game-with-scratch`) vẫn đòi đọc bài lý thuyết 300–600 chữ và dùng máy tính có bàn phím chuột.\n\n### Cấu trúc đề xuất: 5 chương, 30 bài\n\n| Chương | Nội dung | Bài | Nhóm khối ScratchJr |\n|---|---|---:|---|\n| 1. Làm quen với ScratchJr | Mở app, chọn nhân vật, kéo khối, lá cờ xanh | 5 | Kích hoạt (vàng) |\n| 2. Cho nhân vật chuyển động | Bốn hướng, quay, nhảy, con số trong khối | 7 | Chuyển động (xanh lam) |\n| 3. Nhân vật biết nói và biết hát | Nói, to/nhỏ, ẩn/hiện, thu âm | 6 | Hiển thị (tím) + Âm thanh (xanh lá) |\n| 4. Điều khiển và lặp lại | Chờ, **lặp lại**, lặp mãi, chuyển trang, tin nhắn | 7 | Điều khiển (cam) + Kết thúc (đỏ) |\n| 5. Sản phẩm cuối khóa | Câu chuyện 2–3 trang của riêng em | 5 | Dùng lại tất cả |\n\n**Vì sao chia thế này:** ScratchJr chỉ có đúng 6 nhóm khối lệnh, và mỗi chương gánh 1–2 nhóm. Ranh giới chương là ranh giới nhóm khối — trẻ học xong một chương là làm chủ trọn một nhóm màu, nhìn khay khối lệnh biết ngay mình đã học đến đâu.\n\n**Nhịp bài:** mỗi bài 3–6 phút, không bài nào quá 6 phút. Tổng thời lượng khoảng 2,5 giờ nội dung, trải một học kỳ.\n\n**Không có bài trắc nghiệm nào trong cả khóa.** Ở lứa 6–7 tuổi, đọc câu hỏi trắc nghiệm là rào cản chứ không phải công cụ đánh giá. Thay bằng **nhiệm vụ làm trên app** — mỗi chương kết thúc bằng một bài ôn tập dạng nhiệm vụ.","content":"**Nguyên tắc số một: trẻ lớp 1 chưa đọc thạo.** Toàn khóa chỉ có **3 bài đọc**, mỗi bài tối đa 70 chữ, phần còn lại là hình có chú thích. 17/30 bài là video ngắn có lồng tiếng chậm và phụ đề chữ to. 10 bài là nhiệm vụ trình bày bằng **hình khối lệnh**, không phải bằng chữ.\n\n**ScratchJr khác Scratch ở chỗ nào và vì sao chọn nó**\n- Chạy trên **máy tính bảng**, thao tác bằng ngón tay — không cần chuột, không cần bàn phím (trừ bài dạy khối Nói).\n- Khối lệnh là **hình vẽ không có chữ** — trẻ chưa biết đọc vẫn lập trình được.\n- Chỉ có 6 nhóm khối, không có biến số, không có phép toán, không có cảm biến. Đúng mức trẻ 6–7 tuổi kham được.\n\n**Ba quyết định sư phạm chính**\n\n1. **Cố tình để trẻ làm cách dài trước.** Ở chương 2, nhiệm vụ \"đi một vòng hình vuông\" bắt trẻ xếp 8 khối liên tiếp — dài và mỏi. Không nói trước là có cách ngắn hơn. Đến chương 4, bài dạy khối Lặp lại mở đầu bằng chính chuỗi 8 khối đó và cho thấy 3 khối làm được cùng việc. Trẻ tự thấy giá trị của việc lặp thay vì được bảo là nó hữu ích.\n\n2. **Mỗi tiết học kết thúc bằng một thứ chạy được.** Sản phẩm cuối khóa chia thành 5 bài nhỏ, mỗi bài xong là bấm cờ xanh chạy được ngay. Trẻ 6 tuổi không giữ được động lực qua nhiều tiết nếu chưa thấy kết quả.\n\n3. **Bối cảnh Philippines dùng thứ trẻ đã biết, không phải thứ phải giải thích.** Con kalabaw (trâu nước) ở nhiệm vụ chương 2, điệu múa **tinikling** ở nhiệm vụ chương 4, lời chào \"Kumusta!\" ở bài dạy khối Nói. Điệu tinikling đặc biệt đắt: nhịp gõ tre lặp đi lặp lại **chính là** khối Lặp lại — bối cảnh văn hóa và khái niệm lập trình trùng khít nhau.\n\n**Nối sang khóa lớp 3–5 như thế nào**\n\nSáu nhóm khối của ScratchJr ánh xạ gần như một–một sang các nhóm mở đầu của Scratch:\n\n| ScratchJr (lớp 1–2) | Scratch (lớp 3–5) |\n|---|---|\n| Kích hoạt (vàng) | Sự kiện |\n| Chuyển động (xanh lam) | Chuyển động |\n| Hiển thị (tím) | Hiển thị |\n| Âm thanh (xanh lá) | Âm thanh |\n| Điều khiển (cam) — chờ, lặp lại | Điều khiển |\n| Tin nhắn | Phát tin (nhóm Sự kiện) |\n\nHọc sinh lên lớp 3–5 đã nắm sẵn **5 trong 9 nhóm khối** của khóa Scratch về mặt khái niệm — chỉ phải làm quen giao diện mới có chữ. Bốn nhóm còn lại (Cảm biến, Phép toán, Biến số, Bút vẽ) là phần mới thật, và cả bốn đều đòi tư duy vượt tầm lớp 1–2, nên đặt ở lớp 3–5 là đúng chỗ.","verdict":"Khóa duy nhất phải soạn mới toàn bộ — 30 bài, 5 chương, không tái sử dụng được gì từ kho hiện có. Bù lại, thiết kế nối liền mạch sang khóa Scratch lớp 3–5: học sinh học xong sẽ nắm sẵn 5/9 nhóm khối lệnh của khóa tiếp theo. Khối lượng công việc lớn nhất là sản xuất 17 video ngắn có lồng tiếng.","fit":"**Kết luận: được thiết kế riêng cho Philippines ngay từ đầu, nên không có việc bản địa hóa về sau.**\n\n**Thuận lợi có sẵn**\n- ScratchJr **miễn phí hoàn toàn** trên cả iPad và Android, không có mua trong ứng dụng. Trường không tốn phí bản quyền.\n- **Chạy được ngoại tuyến** sau khi cài — quan trọng với trường ở vùng đường truyền yếu hoặc chập chờn.\n- Khối lệnh **không có chữ**, nên bản tiếng Anh và tiếng Filipino dùng chung được giao diện; chỉ phần video và phiếu bài tập cần dịch.\n- Bối cảnh Philippines đã cài sẵn trong thiết kế (kalabaw, tinikling, \"Kumusta!\") chứ không phải thay vào sau.\n\n**Rào cản thật cần lường trước**\n1. **Phải có máy tính bảng.** Đây là ràng buộc cứng — ScratchJr không có bản chạy trên trình duyệt máy tính đúng nghĩa. Trường nào không có bộ máy tính bảng thì không dạy được khóa này. Cần khảo sát thiết bị trước khi triển khai, và tính phương án 1 máy cho 2–3 em dùng chung theo nhóm.\n2. **Ngôn ngữ giảng dạy ở lớp 1–2.** Chương trình Philippines dùng tiếng mẹ đẻ ở những năm đầu tiểu học chứ chưa hoàn toàn tiếng Anh. Video nên có **ít nhất hai bản lồng tiếng**: tiếng Anh và tiếng Filipino; các vùng khác có thể cần thêm.\n3. **Sĩ số lớp đông.** Lớp tiểu học công lập Philippines thường 40–50 em. Bài thu âm giọng (chương 3) sẽ rất ồn — đã ghi lưu ý cho giáo viên trong phần steps của bài đó.\n4. **Giáo viên tiểu học phần lớn không có nền công nghệ thông tin.** Khóa cần kèm **tài liệu hướng dẫn cho giáo viên**, không chỉ tài liệu cho học sinh — đây là hạng mục nằm ngoài 30 bài đã liệt kê và cần tính thêm."},"scores":{"engagement":{"score":9,"note":"Mục tiêu thiết kế: mỗi chương kết thúc bằng nhiệm vụ làm được trên app, có bài thu âm nh, bấm, xem nhân vật đi.","Chèn trò chơi nhỏ giữa video: 'em đoán xem nhân vật sẽ đi đâu?' rồi mới cho chạy.","Nhắc lại trái–phải bằng động tác tay — trẻ 6 tuổi còn hay lẫn."],"kind":"activity"},{"id":null,"title":"Quay trái, quay phải","type":null,"typeName":"Video","metrics":{"words":0,"chars":0,"images":0,"duration":0},"preview":"","issues":[],"action":"add","severity":"","note":"Hai khối quay. Đây là khái niệm khó hơn đi thẳng vì nhân vật đổi hướng nhưng không đổi chỗ.","steps":["Video 5 phút.","Cho quay 1 lần, 2 lần, 4 lần để trẻ thấy quay 4 lần thì về chỗ cũ.","Dùng nhân vật có mặt rõ (mèo, gà) để nhìn ra hướng."],"kind":"activity"},{"id":null,"title":"Nhảy và về nhà","type":null,"typeName":"Video","metrics":{"words":0,"chars":0,"images":0,"duration":0},"preview":"","issues":[],"action":"add","severity":"","note":"Hai khối còn lại: nhảy (hop) và về vị trí ban đầu (go home). Khối 'về nhà' rất hữu ích khi trẻ làm rối chương trình.","steps":["Video 4 phút.","Dạy khối 'về nhà' như cách sửa sai: làm rối rồi bấm về nhà là gọn lại.","Trẻ sẽ dùng khối này rất nhiều — nhấn mạnh."],"kind":"activity"},{"id":null,"title":"Con số trong khối lệnh","type":null,"typeName":"Video","metrics":{"words":0,"chars":0,"images":0,"duration":0},"preview":"","issues":[],"action":"add","severity":"","note":"Bài đầu tiên có yếu tố toán: con số dưới khối lệnh quyết định đi bao nhiêu bước. Nối với môn Toán lớp 1–2.","steps":["Video 5 phút.","Đổi số từ 1 lên 5 lên 10, xem nhân vật đi xa hơn.","Đặt câu hỏi: muốn đi gấp đôi thì điền số nào?","Đây là nền cho khái niệm biến số học sinh gặp ở lớp 3–5."],"kind":"activity"},{"id":null,"title":"Ba khối lệnh nối nhau","type":null,"typeName":"Lý thuyết","metrics":{"words":0,"chars":0,"images":0,"duration":0},"preview":"","issues":[],"action":"add","severity":"","note":"Bài đọc ngắn (tối đa 70 chữ) chốt lại: khối lệnh chạy lần lượt từ trái sang phải. Đây là khái niệm **trình tự** — khái niệm lập trình thật đầu tiên của cả khóa.","steps":["Tối đa 70 chữ, còn lại là hình.","Một dải khối lệnh có đánh số 1-2-3 bên dưới.","Một ảnh so sánh: cùng 3 khối nhưng xếp khác thứ tự thì nhân vật đi đường khác."],"kind":"activity"}]},{"title":"2.2 Việc của em","action":"add","note":"Hai nhiệm vụ và một bài ôn tập, dùng bối cảnh Philippines.","steps":[],"activities":[{"id":null,"title":"Việc của em: đưa con trâu về chuồng","type":null,"typeName":"Bài tập Scratch","metrics":{"words":0,"chars":0,"images":0,"duration":0},"preview":"","issues":[],"action":"add","severity":"","note":"Nhiệm vụ dùng hình ảnh quen thuộc với trẻ Philippines: con kalabaw (trâu nước) — con vật biểu tượng của nông thôn Philippines.","steps":["Cho sẵn phông nền ruộng lúa và nhân vật kalabaw ở góc trái, chuồng ở góc phải.","Yêu cầu: dùng khối chuyển động đưa kalabaw về chuồng.","Đề bài bằng hình: ảnh vị trí đầu → mũi tên → ảnh vị trí đích.","Có nhiều đường đi đúng — chấp nhận mọi lời giải đưa được về đích."],"kind":"activity"},{"id":null,"title":"Việc của em: đi một vòng hình vuông","type":null,"typeName":"Bài tập Scratch","metrics":{"words":0,"chars":0,"images":0,"duration":0},"preview":"","issues":[],"action":"add","severity":"","note":"Nhiệm vụ khó hơn, kết hợp đi và quay. Nối thẳng với hình vuông trẻ đang học ở môn Toán lớp 2.","steps":["Yêu cầu: cho nhân vật đi thành hình vuông rồi về đúng chỗ cũ.","Gợi ý bằng hình: 4 lần (đi thẳng + quay phải).","Đây là bài chuẩn bị cho khối Lặp lại ở chương 4 — cố tình để trẻ phải xếp 8 khối, thấy dài và mỏi.","Không nói trước là có cách ngắn hơn; để chương 4 tự lộ ra."],"kind":"activity"},{"id":null,"title":"Ôn tập chương 2","type":null,"typeName":"Bài tập Scratch","metrics":{"words":0,"chars":0,"images":0,"duration":0},"preview":"","issues":[],"action":"add","severity":"","note":"Thay bài trắc nghiệm bằng nhiệm vụ tổng hợp — trẻ 6–7 tuổi làm trên app hiệu quả hơn đọc câu hỏi.","steps":["3 nhiệm vụ nhỏ trên một trang, mỗi nhiệm vụ 1 khối lệnh cần điền.","Trình bày dạng hình: cho sẵn chuỗi khối bị thiếu một ô, trẻ chọn khối đúng để điền.","Không có chữ nào ngoài tiêu đề."],"kind":"activity"}]}],"count":0},{"title":"Nhân vật biết nói và biết hát","action":"add","note":"Chương 3, 6 bài. Dạy nhóm **Hiển thị (tím)** và **Âm thanh (xanh lá)** — tương ứng hai nhóm 'Hiển thị' và 'Âm thanh' của khóa Scratch lớp 3–5.","steps":["Tổng 6 bài, mỗi bài 3–5 phút.","Chương này trẻ thích nhất vì được thu âm giọng mình — tận dụng để giữ hứng thú.","Ghép hai nhóm khối vào một chương vì cả hai đều ít khối và đều trực quan."],"sections":[{"title":"3.1 Nhân vật biết nói và biến hình","action":"add","note":"Ba bài về nhóm khối Hiển thị màu tím.","steps":[],"activities":[{"id":null,"title":"Cho nhân vật nói","type":null,"typeName":"Video","metrics":{"words":0,"chars":0,"images":0,"duration":0},"preview":"","issues":[],"action":"add","severity":"","note":"Khối 'nói' hiện bong bóng thoại. Đây là bài đầu tiên trẻ phải **gõ chữ** — cần hướng dẫn chậm.","steps":["Video 4 phút.","Gõ một từ ngắn vào khối nói: 'Kumusta!' (xin chào tiếng Filipino).","Cho trẻ dùng từ tiếng Filipino hoặc tiếng Anh tùy em.","Lưu ý: trẻ lớp 1 gõ rất chậm — dặn giáo viên cho thêm thời gian."],"kind":"activity"},{"id":null,"title":"To ra, nhỏ lại, về cỡ cũ","type":null,"typeName":"Video","metrics":{"words":0,"chars":0,"images":0,"duration":0},"preview":"","issues":[],"action":"add","severity":"","note":"Ba khối đổi kích thước. Trực quan tuyệt đối, trẻ hiểu ngay không cần giải thích.","steps":["Video 4 phút.","Bấm to ra nhiều lần, nhỏ lại nhiều lần, rồi về cỡ cũ.","Trò chơi: làm nhân vật to bằng cả màn hình rồi thu về."],"kind":"activity"},{"id":null,"title":"Ẩn đi và hiện ra","type":null,"typeName":"Video","metrics":{"words":0,"chars":0,"images":0,"duration":0},"preview":"","issues":[],"action":"add","severity":"","note":"Hai khối ẩn/hiện. Dùng làm hiệu ứng biến mất — trẻ rất thích.","steps":["Video 3 phút.","Kết hợp: nhân vật nói 'tạm biệt' rồi ẩn đi.","Đây là chuỗi 2 khối, ôn lại khái niệm trình tự đã học ở chương 2."],"kind":"activity"}]},{"title":"3.2 Nhân vật biết phát ra tiếng","action":"add","note":"Ba bài về nhóm khối Âm thanh màu xanh lá và một nhiệm vụ.","steps":[],"activities":[{"id":null,"title":"Tiếng 'pop' có sẵn","type":null,"typeName":"Video","metrics":{"words":0,"chars":0,"images":0,"duration":0},"preview":"","issues":[],"action":"add","severity":"","note":"Khối âm thanh mặc định. Bài ngắn nhất khóa, chỉ để giới thiệu nhóm khối màu xanh lá.","steps":["Video 3 phút.","Gắn khối pop vào cuối chuỗi lệnh."],"kind":"activity"},{"id":null,"title":"Thu âm giọng của em","type":null,"typeName":"Video","metrics":{"words":0,"chars":0,"images":0,"duration":0},"preview":"","issues":[],"action":"add","severity":"","note":"**Bài trẻ thích nhất khóa.** Được nghe giọng mình phát ra từ nhân vật là khoảnh khắc gây hứng thú mạnh nhất ở lứa tuổi này.","steps":["Video 5 phút.","Bấm nút thu, nói một câu, dừng, gắn vào chương trình, chạy thử.","Khuyến khích trẻ thu bằng tiếng mẹ đẻ của mình.","Dặn giáo viên: lớp sẽ ồn ở bài này, nên cho thu lần lượt hoặc dùng tai nghe."],"kind":"activity"},{"id":null,"title":"Việc của em: hai bạn chào nhau","type":null,"typeName":"Bài tập Scratch","metrics":{"words":0,"chars":0,"images":0,"duration":0},"preview":"","issues":[],"action":"add","severity":"","note":"Nhiệm vụ tổng hợp chương 3: hai nhân vật, mỗi nhân vật một chương trình riêng. Đây là lần đầu trẻ lập trình **hai nhân vật cùng lúc**.","steps":["Yêu cầu: thêm 2 nhân vật; nhân vật A nói 'Kumusta!', nhân vật B nói 'Kumusta rin!'.","Mỗi nhân vật có chuỗi khối riêng — chỉ rõ phải bấm chọn nhân vật trước khi lập trình.","Khuyến khích thêm âm thanh thu sẵn.","Chưa cần hai bạn nói đúng lượt — việc đó để chương 4 (gửi tin nhắn)."],"kind":"activity"}]}],"count":0},{"title":"Điều khiển và lặp lại","action":"add","note":"Chương 4, 7 bài. Dạy nhóm **Điều khiển (cam)** và **Kết thúc (đỏ)** — tương ứng nhóm 'Điều khiển' của khóa Scratch lớp 3–5. Đây là chương có khái niệm lập trình thật sự: **lặp lại**.","steps":["Tổng 7 bài, mỗi bài 4–6 phút.","Khối Lặp lại là khái niệm khó nhất khóa — dành 2 bài cho riêng nó.","Mở đầu bằng cách nhắc lại bài hình vuông ở chương 2 (8 khối, dài và mỏi) rồi cho thấy lặp lại làm được cùng việc với 3 khối."],"sections":[{"title":"4.1 Chờ, dừng, và lặp lại","action":"add","note":"Bốn bài về nhóm khối Điều khiển và Kết thúc.","steps":[],"activities":[{"id":null,"title":"Chờ một chút","type":null,"typeName":"Video","metrics":{"words":0,"chars":0,"images":0,"duration":0},"preview":"","issues":[],"action":"add","severity":"","note":"Khối 'chờ'. Cần thiết để trẻ điều khiển được nhịp của chương trình — không có nó thì mọi thứ xảy ra cùng lúc.","steps":["Video 4 phút.","Cho xem chương trình không có khối chờ (chạy vụt qua) và có khối chờ (nhìn kịp).","Đổi số trong khối chờ để thấy chờ lâu hơn."],"kind":"activity"},{"id":null,"title":"Khối Lặp lại: làm đi làm lại","type":null,"typeName":"Video","metrics":{"words":0,"chars":0,"images":0,"duration":0},"preview":"","issues":[],"action":"add","severity":"","note":"**Khái niệm quan trọng nhất cả khóa.** Vào bài bằng chính bài hình vuông trẻ đã vất vả xếp 8 khối ở chương 2.","steps":["Video 6 phút — dài nhất khóa, xứng đáng.","Mở bài: chiếu lại chuỗi 8 khối hình vuông của chương 2, nói 'dài quá nhỉ'.","Cho xem khối Lặp lại bao quanh 2 khối, đặt số 4 — chạy ra đúng hình vuông đó.","So sánh cạnh nhau: 8 khối và 3 khối, cùng kết quả.","Đây là lúc trẻ hiểu vì sao lập trình đáng học."],"kind":"activity"},{"id":null,"title":"Lặp mãi mãi","type":null,"typeName":"Video","metrics":{"words":0,"chars":0,"images":0,"duration":0},"preview":"","issues":[],"action":"add","severity":"","note":"Khối 'lặp mãi mãi' (đỏ). Trẻ rất thích vì tạo được chuyển động không dừng.","steps":["Video 4 phút.","Làm nhân vật đi qua đi lại mãi.","Dạy luôn cách dừng: bấm nút dừng màu đỏ ở trên — trẻ sẽ cần."],"kind":"activity"},{"id":null,"title":"Nhiều trang: chuyển cảnh","type":null,"typeName":"Video","metrics":{"words":0,"chars":0,"images":0,"duration":0},"preview":"","issues":[],"action":"add","severity":"","note":"Khối 'sang trang'. Đây là thứ biến bài tập thành **câu chuyện** — chuẩn bị trực tiếp cho sản phẩm cuối khóa.","steps":["Video 5 phút.","Tạo trang 2, đổi phông nền khác, gắn khối sang trang ở cuối trang 1.","Nhấn mạnh: mỗi trang là một cảnh của câu chuyện."],"kind":"activity"}]},{"title":"4.2 Việc của em","action":"add","note":"Hai nhiệm vụ và một bài ôn tập.","steps":[],"activities":[{"id":null,"title":"Gửi tin nhắn cho bạn khác","type":null,"typeName":"Video","metrics":{"words":0,"chars":0,"images":0,"duration":0},"preview":"","issues":[],"action":"add","severity":"","note":"Khối tin nhắn (màu vàng, nhóm Kích hoạt). Cho phép nhân vật này bảo nhân vật kia bắt đầu — giải quyết đúng vấn đề còn dở ở nhiệm vụ 'hai bạn chào nhau' chương 3.","steps":["Video 5 phút.","Nhắc lại nhiệm vụ chương 3: hai bạn nói cùng lúc, nghe rối.","Nhân vật A nói xong thì gửi tin nhắn; nhân vật B nhận tin nhắn mới nói.","Đây là nền cho khối 'phát tin' học sinh gặp lại ở Scratch lớp 3–5."],"kind":"activity"},{"id":null,"title":"Việc của em: điệu múa tinikling","type":null,"typeName":"Bài tập Scratch","metrics":{"words":0,"chars":0,"images":0,"duration":0},"preview":"","issues":[],"action":"add","severity":"","note":"Nhiệm vụ dùng **tinikling** — điệu múa dân gian Philippines với hai cây tre gõ nhịp. Nhịp lặp đi lặp lại của điệu múa là minh họa hoàn hảo cho khối Lặp lại.","steps":["Cho sẵn 2 nhân vật cây tre và 1 nhân vật người múa.","Yêu cầu: dùng khối Lặp lại cho hai cây tre gõ nhịp liên tục, người múa nhảy theo.","Trẻ Philippines đều biết điệu múa này — không phải giải thích bối cảnh.","Nối lại: nhịp múa lặp đi lặp lại chính là khối Lặp lại."],"kind":"activity"},{"id":null,"title":"Ôn tập chương 4","type":null,"typeName":"Bài tập Scratch","metrics":{"words":0,"chars":0,"images":0,"duration":0},"preview":"","issues":[],"action":"add","severity":"","note":"Ôn tập bằng nhiệm vụ, không bằng trắc nghiệm.","steps":["3 nhiệm vụ nhỏ: một dùng khối chờ, một dùng khối lặp lại, một dùng chuyển trang.","Trình bày dạng hình, không có đoạn văn."],"kind":"activity"}]}],"count":0},{"title":"Sản phẩm cuối khóa: Câu chuyện của em","action":"add","note":"Chương 5, 5 bài. Sản phẩm cuối khóa: mỗi em làm **một câu chuyện 2–3 trang** của riêng mình. Đây là phần đáp ứng yêu cầu *performance task* của chương trình K-12 Philippines.","steps":["Tổng 5 bài, khoảng 2–3 tiết học.","Không dạy khối lệnh mới — chỉ dùng lại tất cả những gì đã học.","Chia nhỏ theo từng bước để trẻ 6–7 tuổi không bị ngợp."],"sections":[{"title":"5.1 Làm câu chuyện của em","action":"add","note":"Năm bài dẫn từ ý tưởng đến sản phẩm hoàn chỉnh.","steps":[],"activities":[{"id":null,"title":"Nghĩ ra câu chuyện","type":null,"typeName":"Video","metrics":{"words":0,"chars":0,"images":0,"duration":0},"preview":"","issues":[],"action":"add","severity":"","note":"Bài dẫn dắt, không có thao tác máy. Trẻ vẽ ra giấy trước khi làm trên app — cách này giảm hẳn tình trạng ngồi im không biết bắt đầu từ đâu.","steps":["Video 4 phút.","Phát phiếu giấy có 3 ô trống cho 3 cảnh, trẻ vẽ nháp bằng bút chì.","Gợi ý chủ đề gần gũi: một ngày ở trường, đi chợ với mẹ, chuyến đi biển, con vật em nuôi.","Cho xem 2 câu chuyện mẫu do học sinh khác làm."],"kind":"activity"},{"id":null,"title":"Vẽ nhân vật của riêng em","type":null,"typeName":"Video","metrics":{"words":0,"chars":0,"images":0,"duration":0},"preview":"","issues":[],"action":"add","severity":"","note":"Dạy công cụ vẽ có sẵn trong ScratchJr. Đến giờ trẻ mới chỉ dùng nhân vật có sẵn — được tự vẽ là bước tạo cảm giác sở hữu sản phẩm.","steps":["Video 5 phút.","Mở công cụ vẽ, dùng bút, hình, màu.","Cũng dạy sửa nhân vật có sẵn (đổi màu áo) cho em nào chưa tự tin vẽ."],"kind":"activity"},{"id":null,"title":"Làm cảnh thứ nhất","type":null,"typeName":"Bài tập Scratch","metrics":{"words":0,"chars":0,"images":0,"duration":0},"preview":"","issues":[],"action":"add","severity":"","note":"Bắt tay làm sản phẩm. Chỉ làm 1 cảnh trong 1 tiết — chia nhỏ để trẻ luôn kết thúc tiết học với một thứ chạy được.","steps":["Yêu cầu: chọn phông nền, đặt nhân vật, cho nhân vật cử động và nói.","Bắt buộc dùng: 1 khối Kích hoạt, ít nhất 2 khối Chuyển động, 1 khối Nói.","Cuối tiết mỗi em bấm cờ xanh chạy thử cảnh của mình."],"kind":"activity"},{"id":null,"title":"Làm cảnh thứ hai và kết thúc","type":null,"typeName":"Bài tập Scratch","metrics":{"words":0,"chars":0,"images":0,"duration":0},"preview":"","issues":[],"action":"add","severity":"","note":"Hoàn thiện sản phẩm bằng khối chuyển trang đã học ở chương 4.","steps":["Yêu cầu: thêm trang 2, gắn khối sang trang ở cuối trang 1.","Bắt buộc dùng thêm: 1 khối Lặp lại và 1 âm thanh (thu sẵn hoặc pop).","Kết thúc bằng khối Kết thúc màu đỏ."],"kind":"activity"},{"id":null,"title":"Khoe sản phẩm với cả lớp","type":null,"typeName":"Bài tập nộp","metrics":{"words":0,"chars":0,"images":0,"duration":0},"preview":"","issues":[],"action":"add","severity":"","note":"Bài nộp cuối khóa. Ở lứa tuổi này, việc được đứng lên khoe sản phẩm quan trọng ngang với việc làm ra nó.","steps":["Mỗi em chiếu câu chuyện của mình cho cả lớp xem, nói một câu về nó.","Giáo viên quay màn hình hoặc chụp ảnh làm hồ sơ đánh giá.","Tiêu chí chấm bằng hình: có 2 trang, có nhân vật cử động, có tiếng, có dùng khối lặp lại.","Không chấm điểm số — dùng bảng 3 mức bằng biểu tượng mặt cười."],"kind":"activity"}]}],"count":0}]},{"key":"grade-3-5","label":"Lớp 3 – 5","group":"Khóa chính","source":"instant-game-with-scratch","isNew":false,"reviewed":true,"title":"Instant Game with Scratch","summary":{"structure":"Khóa có **70 bài / 3 chương / 13 mục**, phân bố **9 – 55 – 6 bài**: chương 2 chiếm **79%** toàn khóa — mất cân đối nghiêm trọng, cần tách đôi (xem `additions`). Điểm mạnh: 9 mục của chương 2 theo một khuôn rất nhất quán *(Video game mẫu → Tài liệu khối lệnh → Lý thuyết nhóm lệnh → Video nhóm lệnh → Trắc nghiệm 10 câu → Bài tập Scratch)*, mỗi nhóm khối lệnh gắn với một trò chơi cụ thể — khung này nên giữ nguyên. Thứ tự 9 nhóm lệnh (Chuyển động → Hiển thị → Âm thanh → Sự kiện → Điều khiển → Cảm biến → Phép toán → Biến số → Bút vẽ) bám đúng thứ tự bảng lệnh trong giao diện Scratch, chấp nhận được về sư phạm — **không đề xuất đảo**. Lỗi thứ tự duy nhất: trong mục \"Trò chơi mèo bắt cá\", bài \"Hệ toạ độ trong Scratch\" (id 8405) đứng **sau** bài \"Nhóm khối lệnh Chuyển động\" (id 8553) dù toạ độ là kiến thức nền của chuyển động. Quiz: 11 bài trắc nghiệm (105 câu) phủ đều chương 1–2, nhưng **chương 3 có 0 bài tập, 0 kiểm tra, 0 bài nộp** — chương \"Sản phẩm cuối khóa\" mà học sinh chỉ xem 4 video, không phải nộp sản phẩm nào. Thiếu nhóm lệnh: bài giao diện (8411) liệt kê 9 nhóm gồm \"Khối lệnh riêng (My Blocks)\" và bài Điều khiển (8433) nhắc khối \"gọi [hàm tự tạo] (trong My Blocks)\", nhưng **cả khóa không có bài nào dạy My Blocks**.","content":"Chất lượng bài lý thuyết nhìn chung **tốt**: giọng văn thân thiện đúng lứa 8–11 tuổi, có mục tiêu – ví dụ ứng dụng game – bảng khối lệnh; các Bài tập Scratch có cấu trúc Mục tiêu / Yêu cầu / Gợi ý từng khối / Thử thách thêm / Bài nộp, đủ rõ để học sinh tự làm (đặc biệt 8466, 8467, 8468, 8469 gợi ý đến từng tên khối). Lỗi nội dung phải sửa: (1) **2 cặp bài trùng nguyên văn 100%**: \"Cài đặt môi trường lập trình\" (8555) = \"Giới thiệu về giao diện của Scratch\" (8411) — cùng 328 chữ, 4 ảnh; \"Nhóm khối lệnh Chuyển động\" (8553) = \"Hệ toạ độ trong Scratch\" (8405) — cùng 475 chữ, 19 ảnh; mỗi bài trùng thực chất gộp nội dung của cả 2 bài, cần tách. (2) Bài \"Nhóm khối lệnh Âm thanh\" (8421) chỉ **27 chữ, đứt giữa câu** (kết thúc ở «…bên cạnh \"Mã lệnh\" và \"Trang phục\"»), trong khi bài lý thuyết khác dài 372–589 chữ. (3) Bài \"Nhóm khối lệnh Hiển thị\" (8414) dừng ngay sau tiêu đề \"3.2 Các khối lệnh Hiển thị\" — **mất toàn bộ bảng khối lệnh** của chính nhóm được dạy. (4) 3 bài lý thuyết dài 509–551 chữ nhưng **0 ảnh** (Điều khiển 8433, Cảm biến 8438, Biến số 8448): bảng \"Khối lệnh | Chức năng\" chỉ có tên khối dạng chữ, không có ảnh khối — quá trừu tượng với học sinh tiểu học (đối chiếu: bài Chuyển động có 19 ảnh, Sự kiện 10 ảnh). (5) Độ khó nhìn chung đúng lứa tuổi; ngoại lệ là mục \"Lập trình thuật toán tìm số nguyên tố\" — khái niệm số nguyên tố và phép chia lấy dư chưa chắc học sinh lớp 3–4 đã học ở môn Toán, cần bài đệm giải thích. (6) Bản địa hóa Philippines: điểm chạm văn hóa Việt Nam duy nhất là cụm \"lá cờ Việt Nam\" (mục Vẽ lá cờ, video 8455, tài liệu 8565) — phải thay; game \"Gà qua đường\", \"Mèo bắt cá\"… đều trung tính, giữ nguyên. Việc dịch toàn bộ sang tiếng Anh là việc mặc định mức dự án, ghi một lần tại đây, không lặp ở từng bài.","verdict":"Khóa dùng được làm nguồn chính cho lớp 3–5 Philippines: khung mục theo trò chơi rất tốt, bài tập rõ ràng, chỉ 1 điểm chạm văn hóa phải bản địa hóa. Mức sửa trung bình: gỡ 2 cặp bài trùng, viết lại 1 bài cụt, khôi phục 1 bảng khối lệnh, bổ sung ảnh cho 3–4 bài, tách chương 2, và thêm bài nộp + kiểm tra cho chương Sản phẩm cuối khóa.","fit":"**Kết luận: khóa dễ đưa sang Philippines nhất trong cả 7 khóa.**\n\n**Vì sao dễ**\n- **Scratch có sẵn giao diện đa ngôn ngữ**, khối lệnh là hình khối màu có nhãn ngắn. Học sinh thao tác bằng kéo thả chứ không gõ chữ, nên rào cản tiếng Anh thấp hơn hẳn hai khóa Python.\n- Nội dung gần như trung tính về văn hóa: mèo, cá, gấu, thiên thạch, gà — đều là hình ảnh Scratch dựng sẵn, không gắn với nước nào.\n- **Chỉ một mục thực sự cần bản địa hóa**: \"Vẽ lá cờ Việt Nam bằng Bút vẽ\" (gồm 1 video, 1 file .sb3, 1 bài lý thuyết, 1 trắc nghiệm, 1 bài tập).\n- Scratch chạy được trên trình duyệt, không cần cài đặt — quan trọng với trường dùng phòng máy chung.\n\n**Rào cản thật**\n1. **Cờ Philippines khó vẽ hơn cờ Việt Nam.** Cờ Việt Nam là nền đỏ + một ngôi sao vàng năm cánh. Cờ Philippines có hình thang xanh–đỏ, tam giác trắng, mặt trời tám tia và ba ngôi sao — vẽ bằng Bút vẽ ở mức lớp 3–5 là quá sức. Không thể đổi ảnh là xong, phải thiết kế lại bài. Điểm sáng: **mặt trời tám tia là bài luyện vòng lặp rất tốt** (lặp 8 lần, mỗi lần quay 45 độ) — nên tách riêng phần đó làm bài chính, phần còn lại của cờ để làm thử thách nâng cao.\n2. **Toàn bộ 25 video phải lồng tiếng hoặc làm phụ đề lại.** Đây là khối lượng công việc lớn nhất của khóa, và chi phí nằm ở khâu sản xuất chứ không phải biên tập.\n3. **Bài tập Scratch cần bản mẫu .sb3 có nhãn tiếng Anh.** 11 file tham khảo hiện có tên nhân vật và biến bằng tiếng Việt bên trong file.\n\n**Phải sửa gì mới dùng được:** thiết kế lại bài vẽ cờ, lồng tiếng 25 video, đổi nhãn trong 11 file .sb3, cộng với các lỗi nội dung đã nêu (2 cặp bài trùng, bài Âm thanh cụt, chương cuối khóa thiếu bài tập)."},"scores":{"engagement":{"score":9,"note":"Khóa hấp dẫn nhất trong cả 7. Mỗi nhóm khối lệnh gắn với một game chơi được (Mèo bắt cá, Hái sao, Thảm họa thiên thạch), mở đầu bằng video demo game để học sinh thấy đích trước khi học, kết bằng game 'Gà qua đường'."},"coverage":{"score":7,"note":"Phủ 9 nhóm khối lệnh Scratch, đủ cho lớp 3–5. Trừ điểm vì nhóm My Blocks được giao diện và bài Điều khiển nhắc tới nhưng cả khóa không dạy."},"clarity":{"score":6,"note":"63 ảnh nhưng dồn vào vài bài: ba bài lý thuyết 509–551 chữ (Điều khiển, Cảm biến, Biến số) không có ảnh nào, trong khi đối tượng là học sinh 8–11 tuổi."},"practice":{"score":8,"note":"Mỗi nhóm khối lệnh có đủ 1 trắc nghiệm + 1 bài tập Scratch + 1 file .sb3 mẫu — 9 bài tập, 11 trắc nghiệm, 11 file tham khảo. Trừ điểm vì chương cuối khóa không có bài tập nào."},"structure":{"score":4,"note":"Chương 2 chứa 55/70 bài (79%) trong khi chương 1 có 9 bài và chương 3 có 6 bài. Bù lại mẫu lặp 6 bài mỗi nhóm khối lệnh rất đều, tách chương chỉ là gom nhóm."},"fit":{"score":7,"note":"Scratch dùng khối lệnh có sẵn nhiều ngôn ngữ, ít chữ nên rào cản tiếng Anh thấp. Chỉ một mục cần bản địa hóa thật (vẽ lá cờ Việt Nam), nhưng cờ Philippines phức tạp hơn nên phải thiết kế lại bài."},"accuracy":{"score":4,"note":"Hai cặp bài trùng nguyên văn 100% (8555=8411, 8553=8405), một bài lý thuyết cụt w":"","truncated":false,"redacted":true,"severity":""},{"id":null,"title":"Bài kiểm tra tổng kết khóa học","type":null,"typeName":"Kiểm tra","metrics":{"words":0,"chars":0,"images":0,"duration":0},"preview":"","issues":[],"action":"add","severity":"","note":"Khóa có 11 quiz theo từng nhóm lệnh (105 câu) nhưng không có bài kiểm tra tổng hợp cuối khóa; chương 3 hiện 0 kiểm tra. Đặt sau bài tập nộp sản phẩm (bài mới ở trên).","steps":["Soạn 15 câu trắc nghiệm tổng hợp phủ 9 nhóm khối lệnh đã học, ưu tiên dạng \"đọc đoạn khối lệnh — đoán kết quả\" lấy ngữ liệu từ game Gà qua đường.","Cấu hình đồng bộ các quiz hiện có: 15–20 phút, đạt 80%, 2 lượt thi."],"kind":"quiz"},{"id":null,"title":"Hoàn thiện và nộp game Gà qua đường của em","type":null,"typeName":"Bài tập nộp","metrics":{"words":0,"chars":0,"images":0,"duration":0},"preview":"","issues":[],"action":"add","severity":"","note":"Chương \"Sản phẩm cuối khóa\" hiện không có hoạt động nộp bài nào — học sinh chỉ xem 4 video làm game (8419, 8460, 8461, 8462) mà không phải tự làm. Khóa học game cần sản phẩm do chính học sinh nộp.","steps":["Đề bài: làm lại game Gà qua đường theo 4 video hướng dẫn, nộp file .sb3.","Yêu cầu bắt buộc: gà di chuyển bằng phím mũi tên, xe di chuyển liên tục, đếm xu bằng biến, màn thắng/thua.","Yêu cầu sáng tạo: thêm ít nhất 1 cải tiến tự chọn lấy từ chính gợi ý trong bài 8410 (xe nhanh dần, thêm màn, thêm nhạc nền, đổi số xu theo độ khó).","Viết rubric chấm đơn giản 4 tiêu chí tương ứng 4 yêu cầu bắt buộc."],"kind":"activity"}]}],"count":6}]},{"key":"grade-6-9","label":"Lớp 6 – 9","group":"Khóa chính","source":"python-for-beginners","isNew":false,"reviewed":true,"title":"Python For Beginners","summary":{"structure":"6 chương, 132 bài (16 / 29 / 23 / 24 / 21 / 19) — phân bố cân, không chương nào phình. Mẫu lặp rất đều và đáng giữ: mỗi mục là `Lý thuyết → Video → 1–3 Bài code`, cuối chương là `Kiểm tra + Bài tập nộp + Tài liệu đánh giá`.\n\n**Ba vấn đề ở cấp cấu trúc:**\n\n1. **Thiếu hẳn danh sách (list).** Chương 4 kết thúc ở vòng lặp rồi sang thẳng chuỗi. Nhưng list *đã được dùng* ở chương sau mà chưa từng được dạy: bài 5021 giải thích `split()` \"chia một chuỗi thành **một danh sách** các chuỗi con\" và `join()` \"nối các phần tử của **một danh sách**\", bài 5017 nói giá trị trả về \"có thể là số nguyên, chuỗi, **danh sách**\". Học sinh gặp khái niệm trước khi được học. Đã duyệt bổ sung mục **4.6 Danh sách** ngay sau 4.5.\n\n2. **Không có sản phẩm cuối khóa.** Khóa kết thúc bằng bài 7015 — một **phiếu khảo sát** của Codelearn, lại còn bị gắn nhầm loại \"Lý thuyết\". So sánh: khóa Scratch lớp 3–5 có hẳn chương \"Sản phẩm cuối khóa\". Học sinh 11–15 tuổi học 132 bài mà không làm ra thứ gì của riêng mình.\n\n3. **7 bài là phiếu khảo sát, không phải nội dung học** (7015–7021): mỗi chương một phiếu \"Đánh giá nội dung phần N\" cộng một phiếu cuối khóa. Chúng chiếm chỗ trong cây bài học và trỏ về Codelearn Việt Nam.","content":"**Viết cho người lớn, không phải cho học sinh 11–15 tuổi.** Đây là vấn đề xuyên suốt. Bài mở đầu 5616 (1034 chữ, 0 ảnh) liệt kê machine learning, OpenCV, Scipy/Numpy, phát triển web. Ví dụ mở chương 4 (bài 4937) dùng *\"độ tuổi hợp pháp để mua đồ uống có cồn ở Hoa Kỳ là 21… thì bạn có thể mua bia\"* — không được phép xuất hiện trong khóa cho lứa tuổi này.\n\n**Sai kiến thức — phải sửa:**\n- 4979: viết `boolean()` là hàm ép kiểu. Python không có hàm này (là `bool()`).\n- 4941: \"giá trị lớn nhất của số thực khoảng 2e400\" — sai; `float` Python tối đa ≈ 1.8e308.\n- 5055: viết lũy thừa là `a + b^c` — trong Python `^` là XOR, lũy thừa là `**`.\n- 4985: viết `If a # 0` — trong Python `#` là dấu chú thích; ý là `a != 0`.\n\n**Lỗi định dạng làm mất toán tử trong đề bài** — học sinh đọc đề không hiểu:\n- 5071: đề hiện `a b >= a + b + c` (mất `**`).\n- 4968: đề hiện \"trả về a b\" (mất `**`); phải xem lời giải mới đoán ra.\n\n**Đề bài mâu thuẫn hoặc thiếu:**\n- 5329 (high): yêu cầu in mỗi chữ một dòng nhưng kết quả mẫu và lời giải lại in một dòng.\n- 5040 (high): đề tiếng Anh nhưng chuỗi kết quả bắt buộc lại là tiếng Việt.\n- 5052: \"S = 1 + 3 + 5 + … + (2n + 1)\" không nói n lấy ở đâu.\n- 5019: hàm tên `chu_vi_hinh_vuong` (chu vi hình vuông) nhưng trả về `2*n` — chu vi hình vuông là `4*n`. Tên hàm trái với việc hàm làm.\n- 4947: bắt học sinh đặt tên hàm là `sum` — trùng hàm dựng sẵn của Python. Dạy sai thói quen ngay bài thứ hai về hàm.\n\n**Thiếu hình minh họa nghiêm trọng ở nửa sau.** Chương 6 có 19 bài, tổng cộng **4 ảnh**, tất cả nằm ở một bài. Ba bài lý thuyết 4945 (463 chữ), 4967 (320 chữ), 5017 (215 chữ) đều 0 ảnh. Nặng nhất là 4996 \"Phạm vi của biến\": bài 22 phút mà chỉ 146 chữ, phần \"Ví dụ:\" và \"Kết quả:\" **bỏ trống** vì nội dung nằm hết trong ảnh — ai không xem được ảnh thì bài này rỗng.\n\n**Lỗi biên tập chữ dính:** bài 4952 có ba chỗ chữ bị dính ký tự \"m\": \"chúng**m**cho Python biết\", \"một loại**m**dấu ngoặc kép\", \"sử dụng**m**bên trong chuỗi\".\n\n**Bản địa hóa Philippines:** tên riêng Việt trong ví dụ (\"Nguyễn Hoàng\" ở bài 4970), câu đố tiếng Việt đáp án \"Con đường\" (5049), chuỗi bắt buộc tiếng Việt (5040), \"Học lập trình cùng Codelearn!\" (5043), tên biến tiếng Việt trong lời giải (5065, và hầu hết bài chương 6: `tinh_luy_thua`, `kiem_tra_chan_le`, `chu_vi_hinh_vuong`, `tinh_tong`).\n\n**Điểm mạnh cần giữ:** mật độ bài code rất tốt (49 bài code / 132 bài), gần như bài lý thuyết nào cũng có video đi kèm và bài thực hành ngay sau. Đây là lý do khóa này xứng đáng làm nguồn thay vì soạn mới.","verdict":"Khung khóa tốt và đáng giữ — nhịp lý thuyết → video → thực hành rất đều, mật độ bài code cao. Nhưng nội dung viết cho người lớn và có lỗi kiến thức thật, nên mức sửa là **trung bình–nặng**: 4 lỗi sai kiến thức, 2 đề bài mất toán tử, 1 ví dụ về đồ uống có cồn phải bỏ, thiếu hẳn phần danh sách và thiếu sản phẩm cuối khóa. Giữ nguyên 100 bài, sửa 32 bài, thêm 1 mục và 1 chương.","fit":"**Kết luận: dùng được về mặt chương trình, nhưng phải sửa nội dung khá nhiều — và có một ví dụ bắt buộc phải bỏ.**\n\n**Thuận lợi**\n- Python là ngôn ngữ được đưa vào chương trình K-12 Philippines ở bậc Junior và Senior High School. Chọn Python cho lớp 6–9 là đúng hướng.\n- Mật độ thực hành cao (49 bài code) hợp với cách đánh giá bằng *performance task* của chương trình Philippines.\n- Thuật ngữ lập trình trong bài đã dùng tiếng Anh sẵn.\n\n**Rào cản thật**\n1. **Một ví dụ phải bỏ, không phải sửa.** Bài 4937 mở chương \"Cấu trúc điều khiển\" bằng: *\"Độ tuổi hợp pháp để mua đồ uống có cồn ở Hoa Kỳ là 21… thì bạn có thể mua bia\"*. Đây là khóa cho học sinh 11–15 tuổi. Thay bằng điều kiện trung tính (đủ điểm qua môn, đủ tuổi vào lớp).\n2. **Khóa viết cho người lớn đi học nghề, không cho trẻ em.** Bài mở đầu liệt kê machine learning, OpenCV, Scipy/Numpy, phát triển web. Học sinh lớp 6 không hiểu và cũng không cần. Đây là việc sửa xuyên suốt, không phải sửa vài chỗ.\n3. **Yêu cầu máy tính.** Chương 1 dành 4 bài cho việc cài đặt môi trường trên Windows và MacOS. Nhiều trường công Philippines dùng phòng máy chung theo ca, học sinh không cài được phần mềm. Cần bổ sung hướng dẫn chạy trên trình duyệt (Google Colab, Replit).\n4. **Tên biến tiếng Việt trong lời giải mẫu.** Hầu hết bài chương 6 dùng `tinh_luy_thua`, `kiem_tra_chan_le`, `chu_vi_hinh_vuong`, `dien_tich`. Học sinh Philippines đọc lời giải sẽ không hiểu tên biến nghĩa là gì — phải đổi hết sang tiếng Anh.\n\n**Phải sửa gì mới dùng được:** bỏ ví dụ đồ uống có cồn, sửa 4 lỗi kiến thức, đổi tên biến sang tiếng Anh, viết lại các ví dụ hướng người lớn, thêm mục Danh sách và chương dự án cuối khóa, bổ sung hướng dẫn chạy trên trình duyệt."},"scores":{"engagement":{"score":4,"note":"Không có dự án, không có sản phẩm cuối khóa — bài cuối cùng là phiếu khảo sát. Ví dụ viết cho người lớn (machine learning, OpenCV, độ tuổi mua rượu ở Mỹ) chứ không cho học sinh 11–15 tuổi."},"coverage":{"score":6,"note":"Phủ đủ nền tảng từ biến đến hàm, nhưng **thiếu hẳn danh sách (list)** — mà chương 5 và 6 lại dùng khái niệm này. Cũng thiếu dự án tổng hợp cuối khóa."},"clarity":{"score":5,"note":"Chương 5 làm tốt (bài 4970 có 16 ảnh), nhưng cả chương 6 chỉ có 4 ảnh dồn vào một bài. Nặng nhất là bài 4996 'Phạm vi của biến': 22 phút mà chỉ 146 chữ, phần Ví dụ và Kết quả bỏ trống."},"practice":{"score":8,"note":"Điểm mạnh nhất: 49 bài code trên 132 bài, rải đều cả 6 chương, hầu hết có 4 test case. Mỗi bài lý thuyết đều có video và bài thực hành ngay sau."},"structure":{"score":7,"note":"6 chương phân bố cân (16/29/23/24/21/19), mẫu lặp rất đều. Trừ điểm vì thiếu mục danh sách và không có chương dự án cuối khóa."},"fit":{"score":4,"note":"Ví dụ mở chương 4 dùng độ tuổi hợp pháp mua đồ uống có cồn — không được phép dùng cho lứa tuổi này. Cộng câu đố tiếng Việt, chuỗi kết quả bắt buộc tiếng Việt, thương hiệu Codelearn, và tên biến tiếng Việt ở hầu hết bài chương 6."},"accuracy":{"score":3,"note":"Bốn lỗi sai kiến thức (`boolean()` không tồn tại, giới hạn float ghi 2e400, `^` dùng làm lũy thừa, `#` dùng làm khác), hai đề bài mất toán tử `**` do lỗi định dạng, một đề tự mâu thuẫn, một hàm tên trái với việc nó làm."}},"isDesign":false,"candidateFor":"","stats":{"chapters":7,"sections":34,"activities":137,"keep":94,"edit":31,"delete":7,"add":5,"high":7,"med":17},"chapters":[{"title":"Giới thiệu chung về Python","action":"keep","note":"Cấu trúc chương ổn (5 mục, 16 bài); chỉ sửa ở mức bài.","steps":[],"sections":[{"title":"1.1 Giới thiệu chung","action":"keep","note":"","steps":[],"activities":[{"id":5291,"title":"Giới thiệu về khóa học","type":3,"typeName":"Video","metrics":{"words":0,"chars":0,"images":0,"duration":5},"issues":[],"action":"keep","note":"","steps":[],"preview":"","truncated":false,"redacted":false,"severity":""},{"id":5616,"title":"Giới thiệu về Python","type":1,"typeName":"Lý thuyết","metrics":{"words":1034,"chars":4791,"images":0,"duration":15},"issues":[{"level":"med","text":"Bài lý thuyết dài nhưng **không có hình minh họa nào**."}],"action":"edit","note":"Bài lý thuyết dài nhất khóa (1 everity":"med"}]},{"title":"6.4 Phạm vi của biến","action":"edit","note":"Mục yếu nhất khóa: bài lý thuyết 4996 bỏ trống phần ví dụ và kết quả, chỉ 146 chữ cho 22 phút.","steps":["Viết lại bài 4996 với mã ví dụ dạng văn bản.","Bổ sung trường hợp biến cục bộ che biến toàn cục."],"activities":[{"id":4996,"title":"Phạm vi của biến trong Python","type":1,"typeName":"Lý thuyết","metrics":{"words":146,"chars":643,"images":4,"duration":22},"issues":[{"level":"med","text":"Bài quá sơ sài: chỉ 146 chữ (các bài cùng loại 300–600 chữ)."}],"action":"edit","note":"Bài 22 phút nhưng chỉ **146 chữ**, và hai phần quan trọng nhất bị bỏ trống: sau “Ví dụ:” và “Kết quả:” không có gì — toàn bộ mã ví dụ nằm trong ảnh. Đây là bài lý thuyết yếu nhất khóa xét theo tỉ lệ chữ trên thời lượng.","steps":["Viết lại mã ví dụ thành **văn bản** cho cả phạm vi cục bộ và toàn cục, kèm kết quả in ra.","Giữ ảnh làm minh họa, nhưng nội dung phải đọc được không cần ảnh.","Bổ sung phần biến toàn cục bị che bởi biến cục bộ cùng tên — đây là lỗi học sinh hay mắc nhất."],"preview":"","truncated":false,"redacted":true,"severity":"high"},{"id":5086,"title":"Làm quen với phạm vi của biến","type":3,"typeName":"Video","metrics":{"words":0,"chars":0,"images":0,"duration":7},"issues":[],"action":"keep","note":"","steps":[],"preview":"","truncated":false,"redacted":false,"severity":""},{"id":4994,"title":"Sử dụng biến theo phạm vi","type":12,"typeName":"Bài code","metrics":{"words":152,"chars":637,"images":0,"duration":20},"issues":[],"action":"edit","note":"Đề dùng chữ “nhập giá trị hai số a = 12 và b = 15” nhưng thực ra là **gán**, không phải nhập từ bàn phím. Dùng sai từ ở đúng bài dạy phạm vi biến thì dễ gây nhầm.","steps":["Đổi “nhập giá trị” thành “gán giá trị” ở cả hai chỗ trong đề.","Đổi tên hàm `tinh_tong` sang tiếng Anh cho khớp bản Philippines."],"preview":"","truncated":false,"redacted":true,"severity":"low"}]},{"title":"6.5 Tổng kết","action":"edit","note":"Mục kết thúc cả khóa nhưng gồm: 1 quiz không mô tả, 1 bài tập nộp gắn thương hiệu Codelearn, 2 phiếu khảo sát tiếng Việt.","steps":["Bỏ 2 phiếu khảo sát.","Bổ sung mô tả cho quiz.","Nối tiếp sang chương dự án cuối khóa."],"activities":[{"id":5044,"title":"Bài kiểm tra trắc nghiệm số 6","type":8,"typeName":"Kiểm tra","metrics":{"words":3,"chars":11,"images":0,"duration":30},"issues":[{"level":"med","text":"Bài quá sơ sài: chỉ 3 chữ (các bài cùng loại 300–600 chữ)."}],"action":"keep","note":"","steps":[],"preview":"","truncated":false,"redacted":true,"severity":""},{"id":5043,"title":"Bài tập tổng kết phần 6","type":7,"typeName":"Bài tập nộp","metrics":{"words":157,"chars":632,"images":0,"duration":30},"issues":[],"action":"edit","note":"Bài tập 2 yêu cầu hàm trả về dòng chữ “Học lập trình cùng Codelearn!” — tiếng Việt và gắn thương hiệu Codelearn.","steps":["Đổi chuỗi sang câu trung tính tiếng Anh cho bản Philippines.","Sáu bài tập đều là bài toán số học thuần (BCNN, ƯCLN, số nguyên tố) — thêm ít nhất 1 bài dùng chuỗi hoặc danh sách cho đa dạng."],"preview":"","truncated":false,"redacted":true,"severity":"low"},{"id":7016,"title":"Đánh giá nội dung phần 6","type":5,"typeName":"Tài liệu","metrics":{"words":154,"chars":721,"images":0,"duration":5},"issues":[],"action":"delete","note":"Phiếu khảo sát nội dung của Codelearn Việt Nam, chèn vào cuối mỗi chương như một bài học. Không phải nội dung dạy, và trỏ về đơn vị vận hành ở Việt Nam.","steps":["Bỏ khỏi bản Philippines, hoặc thay bằng đường dẫn khảo sát của đơn vị vận hành tại Philippines."],"preview":"","truncated":false,"redacted":true,"severity":"low"},{"id":7015,"title":"Đánh giá khóa học","type":1,"typeName":"Lý thuyết","metrics":{"words":137,"chars":637,"images":0,"duration":15},"issues":[{"level":"med","text":"Bài quá sơ sài: chỉ 137 chữ (các bài cùng loại 300–600 chữ)."}],"action":"delete","note":"Đây là **phiếu khảo sát** của Codelearn Việt Nam nhưng bị gắn loại “Lý thuyết” và đặt làm **bài cuối cùng của cả khóa**. Học sinh Philippines học 132 bài rồi kết thúc bằng một form khảo sát tiếng Việt.","steps":["Bỏ khỏi bản Philippines, hoặc thay bằng phiếu khảo sát riêng và đặt lại đúng loại hoạt động.","Vị trí bài cuối khóa nhường cho dự án cuối khóa (xem chương thêm mới)."],"preview":"","truncated":false,"redacted":true,"severity":"med"}]}],"count":19},{"title":"Dự án cuối khóa","action":"add","note":"Khóa hiện kết thúc bằng một phiếu khảo sát tiếng Việt (bài 7015). Học sinh 11–15 tuổi học 132 bài mà không làm ra sản phẩm nào của riêng mình. Khóa Scratch lớp 3–5 trong cùng bộ có hẳn chương “Sản phẩm cuối khóa” — khóa Python cần tương đương. Chương này dùng lại toàn bộ kiến thức đã học: biến, kiểu dữ liệu, rẽ nhánh, vòng lặp, chuỗi, danh sách, hàm.","steps":["Quy mô 6–8 bài, khoảng 3–4 giờ học, đặt sau chương Hàm.","Chọn một dự án chạy được trên console, không cần thư viện ngoài: gợi ý “Sổ điểm của lớp” (nhập tên và điểm, thống kê, xếp loại, tìm kiếm) hoặc “Trò chơi đoán số”.","Chia thành các bài nhỏ tăng dần, mỗi bài thêm một tính năng — theo cách khóa Scratch chia game “Gà qua đường” thành 4 video.","Kết thúc bằng 1 bài tập nộp: học sinh nộp file chương trình hoàn chỉnh.","Bối cảnh dự án đặt ở Philippines (tên học sinh, môn học, thang điểm theo hệ Philippines)."],"sections":[],"count":0}]},{"key":"grade-10-12","label":"Lớp 10 – 12","group":"Khóa chính","source":"python-advanced","isNew":false,"reviewed":true,"title":"Python Advanced","summary":{"structure":"6 chương, 104 bài. Phân bố **rất lệch**: 6 / 44 / 15 / 10 / 12 / 17.\n\n**Chương 2 chiếm 44/104 bài = 42% cả khóa** — bằng bốn chương cuối cộng lại. Nguyên nhân là gộp cả bốn kiểu dữ liệu (list, tuple, set, dict) vào một chương. Bốn kiểu này là bốn chủ đề độc lập, mỗi kiểu đã có đủ video + lý thuyết + bài code riêng.\n\n**Bài thực hành phân bố còn lệch hơn cấu trúc.** Đếm bài code theo chương:\n\n| Chương | Bài | Bài code |\n|---|---:|---:|\n| 1. Ôn tập kiến thức cơ bản | 6 | **0** |\n| 2. Cấu trúc dữ liệu | 44 | 17 |\n| 3. Lập trình hướng đối tượng | 15 | 3 |\n| 4. Xử lý lỗi và ngoại lệ | 10 | 2 |\n| 5. Xử lý File | 12 | **0** |\n| 6. Modules và Packages | 17 | 1 |\n\nHọc sinh làm 17 bài code ở chương 2 rồi gần như **không code gì nữa** trong 60 bài còn lại. Chương \"Xử lý File\" có 8 bài lý thuyết, 3 video, 1 quiz và **không một bài thực hành nào** — dạy đọc/ghi file mà không cho học sinh đọc/ghi file lần nào.\n\n**Chương 1 rỗng ruột.** Mang tên \"Ôn tập các kiến thức cơ bản\" nhưng gồm: 1 video giới thiệu, 1 bài cài Visual Studio Code, 2 video cài đặt, 1 quiz 45 phút, 1 phiếu khảo sát. Không có một bài ôn tập nội dung nào — chỉ có bài kiểm tra.\n\n**Không có dự án cuối khóa.** Bài cuối cùng của khóa là phiếu khảo sát (7034).\n\n**Chồng lấn với lớp 6–9.** Sau khi lớp 6–9 được thêm mục \"4.6 Danh sách\" (tạo list, chỉ mục, len, append, remove, duyệt bằng for), hai bài đầu chương 2 ở đây — \"Danh sách (List) trong Python\" (5157) và \"Truy cập phần tử của danh sách\" (5158) — sẽ trùng phần lớn.","content":"**Một bài lý thuyết rỗng hoàn toàn.** Bài \"Kế thừa trong Python\" (5176), thời lượng 20 phút, toàn bộ nội dung HTML là `<p>Kế thừa<\/p>` — đúng hai chữ. Kế thừa là một trong ba trụ cột của lập trình hướng đối tượng, và bài dạy nó **trống rỗng**. Ngay sau đó là bài code 5177 yêu cầu học sinh làm bài tập về kế thừa. Đây là lỗi nặng nhất của khóa.\n\n**Gần như không có hình minh họa.** Cả 104 bài chỉ có khoảng 21 ảnh, trong đó 10 ảnh nằm ở một bài (5155 hướng dẫn cài đặt). **Chương 4 và chương 5 không có một ảnh nào.** Trong khi đó khóa đầy những bài lý thuyết dài đặc chữ:\n\n| Bài | Chữ | Ảnh |\n|---|---:|---:|\n| 5163 Những lỗi phổ biến khi bắt đầu lập trình Python | 2813 | 0 |\n| 5174 Kiểu dữ liệu tập hợp Set | 2613 | 0 |\n| 5159 Lớp và đối tượng trong Python | 2593 | 1 |\n| 5170 Cài đặt package với Pip | 2562 | 4 |\n| 5467 Unpacking Tuple trong Python | 2307 | 0 |\n| 5873 Sử dụng module trong Python | 2254 | 0 |\n| 5181 Một số thao tác trên từ điển (Phần 1) | 1483 | 0 |\n\nBài 2000–2800 chữ trong 20–25 phút là **quá tải** kể cả với học sinh lớp 12. Không có sơ đồ nào cho các khái niệm vốn cần hình: cấu trúc set/dict trong bộ nhớ, cây kế thừa, luồng try/except, con trỏ file.\n\n**Cách đóng gói dự án sai chỗ.** Ba bài hay nhất khóa lại bị gắn nhãn \"Đọc thêm\" và để ở dạng bài đọc:\n- 5570/5571 \"Chương trình quản lý lớp học hướng đối tượng\"\n- 5590 \"Xây dựng chương trình phần mềm quản lý\"\n- 5595 \"Xây dựng chương trình sinh mật khẩu\"\n\nĐây là các dự án nhỏ hoàn chỉnh, nhưng học sinh chỉ **đọc** chứ không làm. Chuyển chúng thành bài thực hành là cách vá lỗ hổng thực hành mà **không phải soạn nội dung mới**.\n\n**7 phiếu khảo sát Codelearn** (7032–7038) chèn vào cuối mỗi chương và cuối khóa, đều gắn nhãn loại \"Lý thuyết\", mỗi bài 104 chữ. Giống hệt tình trạng ở khóa lớp 6–9.\n\n**Bản địa hóa**: tên riêng Việt (\"Phạm\" trong 5873), đơn vị tiền \"đồng\" trong 5 bài (5155, 5416, 5166, 5167, 5163, 5170), thương hiệu Codelearn trong 9 bài.\n\n**Điểm mạnh cần giữ:** chương 2 tuy phình nhưng chất lượng tốt — mỗi kiểu dữ liệu đều có video, lý thuyết, và nhiều bài code có test case. Nội dung kiến thức chính xác (không tìm thấy lỗi sai kiến thức như ở khóa lớp 6–9). Chủ đề của khóa (cấu trúc dữ liệu, OOP, ngoại lệ, file, module) đúng chuẩn cho lớp 10–12.","verdict":"Nội dung kiến thức đúng và chủ đề chuẩn cho lớp 10–12, nhưng khóa **mất cân đối nặng** và có một bài lý thuyết rỗng hoàn toàn. Mức sửa: **nặng ở cấu trúc, nhẹ ở nội dung** — phải viết mới bài Kế thừa, tách chương 2, và bổ sung bài thực hành cho bốn chương cuối. Bù lại, phần lớn vật liệu để vá đã có sẵn ngay trong khóa (ba bài 'Đọc thêm' là dự án hoàn chỉnh).","fit":"**Kết luận: dùng được, nhưng phải sửa cấu trúc trước — không phải sửa vì lý do Philippines.**\n\n**Thuận lợi**\n- Rào cản văn hóa **thấp nhất trong cả 7 khóa**. Nội dung là kỹ thuật thuần: cấu trúc dữ liệu, OOP, ngoại lệ, file, module. Chỉ 20/104 bài có dấu vết Việt Nam, và hầu hết chỉ là đơn vị \"đồng\" trong ví dụ tính tiền — đổi sang peso là xong.\n- Python là ngôn ngữ được dạy phổ biến ở bậc Senior High School Philippines (nhánh STEM và ICT của chương trình K-12). Chủ đề khớp đúng.\n- Thuật ngữ trong bài đã dùng tiếng Anh sẵn (list, tuple, set, dictionary, class, inheritance, polymorphism, exception, module, package) — bản tiếng Anh sẽ dịch rất nhẹ.\n\n**Rào cản thật**\n1. **Thiết bị.** Khóa bắt buộc cài Visual Studio Code trên máy tính (chương 1 dành 3/6 bài cho việc này), và chương 5 cần thao tác file trên ổ đĩa. Ở nhiều trường công Philippines học sinh chủ yếu có điện thoại, phòng máy dùng chung theo ca. Cần bổ sung phương án chạy trên trình duyệt (Google Colab hoặc trình soạn thảo online) song song với VS Code.\n2. **Bài dài đặc chữ.** Với học sinh học bằng tiếng Anh như ngôn ngữ thứ hai, bài 2500–2800 chữ không hình là quá nặng. Đây là rào cản lớn hơn cả rào cản văn hóa.\n3. **Không có sản phẩm cuối khóa.** Chương trình K-12 Philippines đánh giá theo *performance task* — học sinh phải nộp sản phẩm. Khóa hiện không có gì để nộp.\n\n**Phải sửa gì mới dùng được:** viết bài Kế thừa (bắt buộc), thêm bài thực hành cho chương 4–5–6, thêm dự án cuối khóa, đổi \"đồng\" sang peso, bổ sung hướng dẫn chạy trên trình duyệt."},"scores":{"engagement":{"score":4,"note":"Không có dự án, không có sản phẩm, kết thúc bằng phiếu khảo sát. Ba dự án nhỏ hay nhất lại bị đóng gói thành bài 'Đọc thêm' chỉ để đọc."},"coverage":{"score":9,"note":"Phủ đủ và đúng chuẩn lớp 10–12: bốn kiểu dữ liệu tích hợp, OOP, ngoại lệ, file, module/package. Chỉ thiếu phần dự án tổng hợp."},"clarity":{"score":4,"note":"Bảy bài từ 1400 đến 2813 chữ mà 0–4 ảnh; chương 4 và 5 không có ảnh nào. Bài 5176 'Kế thừa' rỗng hoàn toàn."},"practice":{"score":3,"note":"23 bài code nhưng dồn 17 bài vào chương 2. Chương 1 và chương 5 không có bài thực hành nào — dạy xử lý file mà không cho làm file lần nào."},"structure":{"score":3,"note":"Chương 2 chiếm 42% cả khóa (44/104 bài) trong khi chương 1 chỉ có 6 bài và không chứa nội dung ôn tập nào."},"fit":{"score":7,"note":"Rào cản văn hóa thấp nhất trong 7 khóa — chỉ 20/104 bài cần bản địa hóa, chủ yếu đổi đơn vị 'đồng'. Rào cản thật là yêu cầu máy tính cài VS Code."},"accuracy":{"score":7,"note":"Không tìm thấy lỗi sai kiến thức (khác hẳn khóa lớp 6–9 có 4 lỗi). Trừ điểm vì bài 5176 rỗng và 7 phiếu khảo sát bị gắn nhầm loại 'Lý thuyết'."}},"isDesign":false,"candidateFor":"","stats":{"chapters":8,"sections":19,"activities":104,"keep":76,"edit":21,"delete":7,"add":0,"high":1,"med":7},"chapters":[{"title":"Ôn tập các kiến thức cơ bản","action":"edit","note":"Mang tên 'Ôn tập các kiến thức cơ bản' nhưng **không có bài ôn tập nào**: 1 video giới thiệu + 1 bài cài VS Code + 2 video cài đặt + 1 quiz 45 phút + 1 phiếu khảo sát. Học sinh bị kiểm tra 45 phút mà không được ôn.","steps":["Thêm 2–3 bài ôn nhanh kiến thức lớp 6–9: biến và kiểu dữ liệu, rẽ nhánh và vòng lặp, hàm.","Thêm 2 bài code khởi động — chương này hiện không có bài thực hành nào.","Bổ sung hướng dẫn chạy Python trên trình duyệt (Google Colab) song song VS Code, cho học sinh không có máy riêng."],"sections":[{"title":"Giới thiệu khóa học","action":"keep","note":"","steps":[],"activities":[{"id":7039,"title":"Giới thiệu về khóa học","type":3,"typeName":"Video","metrics":{"words":0,"chars":0,"images":0,"duration":2},"issues":[],"action":"keep","note":"","steps":[],"preview":"","truncated":false,"redacted":false,"severity":""}]},{"title":"Cài đặt môi trường lập trình Visual Studio Code","action":"keep","note":"","steps":[],"activities":[{"id":5155,"title":"Cài đặt Visual Studio Code và Python","type":1,"typeName":"Lý thuyết","metrics":{"words":842,"chars":3995,"images":10,"duration":15},"issues":[],"action":"edit","note":"Bài cài đặt Visual Studio Code, 842 chữ, 10 ảnh — bài nhiều ảnh nhất khóa, chất lượng tốt. Vấn đề là **giả định học sinh có máy tính riêng**, không đúng với nhiều trường ở Philippines.","steps":["Bổ sung một mục hướng dẫn chạy Python trên trình duyệt bằng Google Colab, cho học sinh chỉ có điện thoại hoặc dùng phòng ct) vào một chương. Đề xuất tách đôi theo ranh giới tự nhiên giữa tuple và set.","steps":["Tách thành 2 chương: 'Danh sách và Tuple' (22 bài) và 'Tập hợp và Từ điển' (22 bài).","Sau khi tách, phân bố khóa thành 6 / 22 / 22 / 15 / 10 / 12 / 17 — cân hơn nhiều.","Rút gọn hai bài đầu (5411, 5415) thành một bài ôn nhanh vì lớp 6–9 đã dạy list cơ bản."],"sections":[{"title":"Danh sách","action":"keep","note":"","steps":[],"activities":[{"id":5840,"title":"List trong Python","type":3,"typeName":"Video","metrics":{"words":0,"chars":0,"images":0,"duration":10},"issues":[],"action":"keep","note":"","steps":[],"preview":"","truncated":false,"redacted":false,"severity":""},{"id":5157,"title":"Danh sách (List) trong Python","type":1,"typeName":"Lý thuyết","metrics":{"words":1094,"chars":5050,"images":1,"duration":20},"issues":[],"action":"edit","note":"Trùng nội dung với mục '4.6 Danh sách' vừa được duyệt thêm vào khóa lớp 6–9 (tạo list, chỉ mục, len). Học sinh lên lớp 10–12 sẽ học lại y hệt.","steps":["Rút gọn thành bài ôn nhanh 300–400 chữ, ghi rõ 'em đã học ở lớp 6–9'.","Dồn thời lượng tiết kiệm được sang phần cắt lát danh sách (5416) vốn khó hơn."],"preview":"","truncated":false,"redacted":true,"severity":"med"},{"id":5567,"title":"Bài tập: Tạo danh sách số thực trong Python","type":12,"typeName":"Bài code","metrics":{"words":198,"chars":1044,"images":0,"duration":15},"issues":[],"action":"edit","note":"Bài code có nhắc thương hiệu Codelearn trong đề.","steps":["Bỏ nhắc thương hiệu khỏi đề bài."],"preview":"","truncated":false,"redacted":true,"severity":"low"},{"id":5841,"title":"Thao tác với List (1)","type":3,"typeName":"Video","metrics":{"words":0,"chars":0,"images":0,"duration":8},"issues":[],"action":"keep","note":"","steps":[],"preview":"","truncated":false,"redacted":false,"severity":""},{"id":5158,"title":"Truy cập phần tử của danh sách","type":1,"typeName":"Lý thuyết","metrics":{"words":880,"chars":3989,"images":1,"duration":15},"issues":[],"action":"edit","note":"
