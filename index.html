 động."],"preview":"","truncated":false,"redacted":true,"severity":"low"},{"id":7034,"title":"Đánh giá khóa học","type":1,"typeName":"Lý thuyết","metrics":{"words":137,"chars":637,"images":0,"duration":5},"issues":[{"level":"med","text":"Bài quá sơ sài: chỉ 137 chữ (các bài cùng loại 300–600 chữ)."}],"action":"delete","note":"Phiếu khảo sát Codelearn nhưng là **bài cuối cùng của cả khóa**, gắn nhãn loại 'Lý thuyết'. Học sinh học 104 bài rồi kết thúc bằng một form khảo sát tiếng Việt.","steps":["Bỏ khỏi bản Philippines.","Vị trí bài cuối khóa nhường cho dự án cuối khóa."],"preview":"","truncated":false,"redacted":true,"severity":"med"}]}],"count":17},{"title":"Dự án cuối khóa","action":"add","note":"Khóa hiện kết thúc bằng phiếu khảo sát (7034). Chương trình K-12 Philippines đánh giá học sinh bằng *performance task* — phải có sản phẩm để nộp. Khóa Scratch lớp 3–5 trong cùng bộ đã có chương 'Sản phẩm cuối khóa'; khóa lớp 6–9 cũng được đề xuất thêm. Khóa lớp 10–12 càng cần vì đây là khóa cuối lộ trình.","steps":["Quy mô 6–8 bài, khoảng 4–6 giờ. Đặt sau chương Modules và Packages.","Dự án phải dùng lại **cả bốn chương cuối**: OOP (định nghĩa lớp), ngoại lệ (bắt lỗi nhập liệu), file (lưu dữ liệu), module (chia thành nhiều file .py).","Gợi ý: 'Hệ thống quản lý thư viện trường' — lớp Sach và ThanhVien, lưu ra file, bắt lỗi khi mượn sách đã hết, chia thành các module.","Chia thành các bài nhỏ tăng dần, mỗi bài thêm một tính năng.","Kết thúc bằng 1 bài nộp sản phẩm — thay cho phiếu khảo sát hiện đang là bài cuối.","Bối cảnh đặt ở Philippines: tên học sinh, tên sách, đơn vị tiền peso."],"sections":[],"count":0}]},{"key":"free-hw","label":"Phần cứng","group":"Khóa phụ (free)","source":"phan-cung-may-tinh","isNew":false,"reviewed":true,"title":"Phần cứng máy tính","summary":{"structure":"**Cả 82 bài nằm trong đúng một chương.** Đây là lỗi cấu trúc nặng nhất của khóa: học sinh mở khóa ra thấy một danh sách 82 bài chạy dài, không có mốc nào để biết mình đang ở đâu, học xong phần nào, còn bao nhiêu.\n\nMay mắn là **11 mục bên trong đã chia rất hợp lý** và chính là ranh giới chương có sẵn — chỉ cần nâng cấp nhóm mục thành chương, không phải sắp xếp lại bài nào.\n\n### Đề xuất tách thành 5 chương\n\n| Chương mới | Gom từ các mục | Bài |\n|---|---|---:|\n| 1. Máy tính là gì | Giới thiệu về máy tính | 9 |\n| 2. Bộ xử lý và bo mạch | Đơn vị xử lý trung tâm + Nguồn điện + Bo mạch chính | 15 |\n| 3. Bộ nhớ và lưu trữ | Bộ nhớ RAM/ROM + Thiết bị lưu trữ dữ liệu | 19 |\n| 4. Cổng kết nối và thiết bị ngoại vi | Các cổng kết nối + Thiết bị nhập + Thiết bị xuất | 24 |\n| 5. Chọn máy, dùng máy và xử lý sự cố | Bảo quản và sử dụng thiết bị + Câu hỏi cuối khóa | 15 |\n\nCách gom này theo đúng **luồng vật lý của một chiếc máy**: máy là gì → bộ phận xử lý bên trong → nơi chứa dữ liệu → đường ra vào và thiết bị ngoài → dùng và sửa. Không phải cắt cho đủ số.\n\n**Vấn đề khác về cấu trúc:**\n- Mục \"Bo mạch chính \" chỉ có 3 bài và **không có câu hỏi ôn tập nào**, trong khi mục nào cũng có 2–5 câu. Mục \"Các cổng kết nối\" có 11 bài cũng không có câu ôn tập nào.\n- Chương 5 dồn 10 \"Câu hỏi cuối khóa\" liên tiếp ở cuối. Rải về đúng chương tương ứng sẽ tốt hơn.\n- Hai tên mục có **khoảng trắng thừa ở cuối**: \"Đơn vị xử lý trung tâm \" và \"Bo mạch chính \".","content":"**Chất lượng hình ảnh tốt — điểm mạnh lớn nhất của khóa.** 193 ảnh trên 82 bài, trung bình hơn 2 ảnh mỗi bài. Đây là khóa nhiều hình nhất trong cả 7 khóa, và đúng với một môn học về vật thể có hình dáng cụ thể.\n\n**Ba bài có tiêu đề là mã nội bộ chưa đặt tên:** \"Hardware_SSD\", \"Hardware_SDCard\", và một bài dùng dấu hai chấm sai khoảng trắng \"Thiết bị lưu trữ dữ liệu : Ổ đĩa quang\". Học sinh nhìn thấy \"Hardware_SSD\" trong danh sách bài học.\n\n**Nội dung lỗi thời — phải xử lý:**\n- **Đĩa mềm** (floppy disk): thiết bị đã ngừng sản xuất từ 2011. Học sinh sinh sau năm 2010 chưa từng nhìn thấy. Nếu giữ thì chỉ nên gộp một đoạn ngắn vào bài lịch sử lưu trữ, không để thành bài riêng.\n- **Cổng PS/2**: máy tính bán ra hiện nay gần như không còn cổng này.\n- **Ổ đĩa quang**: laptop bán ra từ khoảng 2016 đã bỏ ổ đĩa quang.\n- Trong khi đó khóa **không có bài nào về lưu trữ đám mây** (Google Drive, OneDrive) — thứ học sinh dùng hằng ngày.\n\n**Lỗ hổng lớn nhất: không có một bài nào về điện thoại và máy tính bảng.** Khóa dạy phần cứng nhưng chỉ nói về máy tính để bàn và laptop. Với học sinh Philippines — nơi điện thoại là thiết bị số chính của phần lớn học sinh — đây là khoảng trống nghiêm trọng hơn cả nội dung lỗi thời.\n\n**Bài dài nhất khóa** là mục \"Bảo quản và sử dụng thiết bị\" (trung bình 910 chữ/bài, cao nhất 1805 chữ) — cũng là mục **thực dụng nhất** (chọn laptop, xây cấu hình, xử lý lỗi màn hình xanh, khắc phục lỗi ổ cứng). Đây là phần đáng giữ và đáng đầu tư nhất.\n\n**Bản địa hóa:** 3 bài có giá tiền bằng \"triệu đồng\" và bối cảnh Việt Nam (707 hướng dẫn chọn laptop, 708 xây cấu hình, 703 máy chiếu).","verdict":"Nội dung vững, hình ảnh nhiều và đúng trọng tâm — nền tốt. Nhưng **cấu trúc phải sửa trước khi dùng được**: 82 bài trong một chương duy nhất. Ngoài ra phải bỏ hoặc gộp nội dung lỗi thời (đĩa mềm, PS/2, ổ đĩa quang), đặt lại 3 tiêu đề còn là mã nội bộ, và bổ sung phần điện thoại — thiết bị số chính của học sinh Philippines.","fit":"**Kết luận: rất phù hợp về chủ đề, nhưng phải thêm phần thiết bị di động và đổi bối cảnh giá cả.**\n\n**Thuận lợi**\n- Chủ đề trung tính hoàn toàn: CPU, RAM, ổ cứng, cổng kết nối là như nhau ở mọi nước. Chỉ **3/82 bài** có dấu vết Việt Nam.\n- Không đòi kiến thức lập trình, không đòi máy tính để thực hành — đúng yêu cầu \"không phân biệt lớp\" và học được ở trường thiếu thiết bị.\n- Mục \"Bảo quản và sử dụng thiết bị\" (chọn laptop, xử lý sự cố) là kiến thức dùng được ngay trong đời sống, giá trị với gia đình học sinh.\n\n**Rào cản thật**\n1. **Khóa nói về máy tính, học sinh Philippines dùng điện thoại.** Tỉ lệ hộ gia đình có máy tính ở Philippines thấp hơn nhiều so với tỉ lệ có điện thoại thông minh. Một khóa phần cứng không có bài nào về điện thoại sẽ khiến phần lớn học sinh không soi được kiến thức vào thiết bị mình đang cầm.\n2. **Giá tiền theo đồng Việt Nam.** Hai bài quan trọng nhất về mặt thực dụng (chọn laptop, xây cấu hình) đều báo giá bằng \"triệu đồng\" và theo mặt bằng giá Việt Nam. Phải đổi sang peso và theo giá thị trường Philippines, nếu không thì hai bài này vô dụng.\n3. **Đọc bằng tiếng Anh.** Khóa nhiều thuật ngữ kỹ thuật; bản tiếng Anh cần giữ thuật ngữ gốc kèm giải thích ngắn.\n\n**Phải sửa gì mới dùng được:** tách chương, thêm 3–4 bài về phần cứng điện thoại/máy tính bảng, đổi giá sang peso theo thị trường Philippines, bỏ hoặc gộp nội dung lỗi thời."},"scores":{"engagement":{"score":6,"note":"Chủ đề dễ gây tò mò và có 193 ảnh minh họa thiết bị thật. Trừ điểm vì toàn bộ là bài đọc — không có thực hành, không có sản phẩm, và 82 bài chạy liền một mạch không có mốc."},"coverage":{"score":6,"note":"Phủ đầy đủ máy tính để bàn và laptop. Trừ nặng vì không có bài nào về điện thoại/máy tính bảng và không có bài nào về lưu trữ đám mây."},"clarity":{"score":8,"note":"Điểm mạnh nhất: trung bình hơn 2 ảnh mỗi bài, độ dài bài hợp lý (trung bình 197–910 chữ tùy mục). Trừ điểm vì 3 tiêu đề còn là mã nội bộ ('Hardware_SSD', 'Hardware_SDCard')."},"practice":{"score":4,"note":"Có 26 câu hỏi ôn tập rải theo mục — tốt hơn không có. Nhưng hoàn toàn không có bài thực hành, và 2 mục lớn (Bo mạch chính, Các cổng kết nối 11 bài) không có câu hỏi nào."},"structure":{"score":2,"note":"Cả 82 bài trong đúng 1 chương. Bù lại 11 mục bên trong đã chia hợp lý nên việc tách chương là gom nhóm chứ không phải sắp xếp lại."},"fit":{"score":7,"note":"Chỉ 3/82 bài có dấu vết Việt Nam. Rào cản thật không phải văn hóa mà là thiết bị: khóa nói về máy tính trong khi học sinh Philippines chủ yếu dùng điện thoại."},"accuracy":{"score":6,"note":"Không phát hiện lỗi kiến thức. Trừ điểm vì nội dung lỗi thời (đĩa mềm, cổng PS/2, ổ đĩa quang) và 3 tiêu đề chưa đặt tên."}},"isDesign":false,"candidateFor g một chiếc điện thoại — chip xử lý, RAM, bộ nhớ trong; đối chiếu với CPU/RAM/ổ cứng đã học.","Bài 2: Màn hình cảm ứng, camera, cảm biến — nối lại với chương thiết bị nhập/xuất.","Bài 3: Pin và sạc — vì sao pin chai, cổng USB-C và Lightning.","Bài 4: Đọc thông số điện thoại khi mua — song song với bài chọn laptop, giá theo peso.","Tận dụng lại được ảnh và cách trình bày của các chương trước, không phải dựng phong cách mới."],"sections":[],"count":0},{"title":"Cổng kết nối và thiết bị ngoại vi","action":"add","note":"Chương 4 sau khi tách, 24 bài — chương lớn nhất. Gom ba mục về đường dữ liệu ra vào máy.","steps":["Chuyển sang chương này 3 mục: 'Các cổng kết nối', 'Thiết bị nhập dữ liệu', 'Thiết bị xuất dữ liệu'.","Thêm 3–4 câu hỏi ôn tập cho mục Các cổng kết nối — mục 11 bài này đang không có câu nào."],"sections":[],"count":0},{"title":"Bộ nhớ và lưu trữ dữ liệu","action":"add","note":"Chương 3 sau khi tách, 19 bài. Gom hai mục cùng nói về nơi chứa dữ liệu.","steps":["Chuyển sang chương này 2 mục: 'Bộ nhớ RAM/ROM' và 'Thiết bị lưu trữ dữ liệu'.","Gộp bài Đĩa mềm và Ổ đĩa quang thành một bài về thiết bị lưu trữ đời cũ.","Thêm bài mới về lưu trữ đám mây."],"sections":[],"count":0},{"title":"Bộ xử lý và bo mạch","action":"add","note":"Chương 2 sau khi tách, 15 bài. Gom ba mục cùng nói về phần 'não và xương sống' của máy.","steps":["Chuyển sang chương này 3 mục: 'Đơn vị xử lý trung tâm', 'Nguồn điện', 'Bo mạch chính'.","Thêm 2–3 câu hỏi ôn tập cho mục Bo mạch chính — mục này đang không có câu nào."],"sections":[],"count":0},{"title":"Máy tính là gì","action":"add","note":"Chương 1 sau khi tách. Giữ nguyên mục 'Giới thiệu về máy tính' (9 bài).","steps":["Chuyển nguyên mục 'Giới thiệu về máy tính' sang chương này. Không sửa nội dung bài nào."],"sections":[],"count":0}]},{"key":"free-sw","label":"Phần mềm","group":"Khóa phụ (free)","source":"phan-mem-may-tinh","isNew":false,"reviewed":true,"title":"Phần mềm máy tính","summary":{"structure":"**Cả 45 bài nằm trong đúng một chương** — cùng lỗi với khóa Phần cứng, và cùng cách chữa: 8 mục bên trong đã là ranh giới chương sẵn có.\n\n### Đề xuất tách thành 5 chương\n\n| Chương mới | Gom từ các mục | Bài |\n|---|---|---:|\n| 1. Phần mềm là gì | Giới thiệu về phần mềm | 9 |\n| 2. Hệ điều hành | Phần mềm hệ thống + Giới thiệu về hệ điều hành | 9 |\n| 3. Phần mềm dùng hằng ngày | Trình duyệt web + Phần mềm văn phòng | 11 |\n| 4. Phần mềm chuyên ngành | Trình soạn thảo và lập trình + Phần mềm tiện ích 1 | 10 |\n| 5. Tiện ích và an toàn máy tính | Phần mềm tiện ích 2 | 6 |\n\n**Tên mục đang đặt sai nội dung.** Mục \"Phần mềm tiện ích 1\" thực chất chứa AutoCAD, 3DS MAX, Photoshop, Lightroom — đây là **phần mềm đồ họa và thiết kế**, không phải phần mềm tiện ích. Chỉ mục \"tiện ích 2\" (hỗ trợ từ xa, nén file, bộ gõ, liên lạc, diệt virus) mới đúng là tiện ích. Việc đánh số \"1\" và \"2\" cho hai nhóm khác hẳn nhau khiến học sinh tưởng là hai phần của một chủ đề.\n\n**Bảy bài kiểm tra rải đều cuối mỗi mục** — đây là điểm tốt, giữ nguyên khi tách chương.","content":"**Đây là khóa có nội dung lỗi thời nặng nhất trong cả 7 khóa.** Bốn bài nói về sản phẩm đã chết hoặc sắp hết vòng đời:\n\n| Bài | Vấn đề |\n|---|---|\n| 738 Trình duyệt Internet Explorer | Microsoft đã **ngừng hỗ trợ Internet Explorer từ 15/6/2022** và vô hiệu hóa hẳn sau đó. Bài dài 491 chữ dạy một sản phẩm không còn tồn tại. |\n| 735 Phân loại các phiên bản của Windows 10 | 1049 chữ liệt kê 6 phiên bản Windows 10, mở đầu bằng \"Trên thị trường hiện nay…\". Windows 11 ra mắt 2021; Windows 10 đã hết hạn hỗ trợ từ tháng 10/2025. |\n| 748 Netbeans và Eclipse | Hai IDE Java đã rất ít dùng với người mới học. Bài còn có lỗi gõ: \"notepad **vằ** bắt đầu\", \"**tiêp** tục\". |\n| 756 Các bộ gõ ngôn ngữ | **Toàn bộ bài nói về bộ gõ tiếng Việt** — bảng mã, kiểu gõ Telex/VNI, dấu thanh. Xem phần đánh giá Philippines. |\n\n**Thiếu hẳn ba mảng phần mềm mà học sinh dùng nhiều nhất:**\n1. **Ứng dụng di động** — không có một bài nào về app điện thoại, kho ứng dụng, quyền truy cập của app.\n2. **Phần mềm chạy trên trình duyệt** — không có bài nào về Google Docs, Sheets, Drive. Khóa dạy Microsoft Office như thể phần mềm văn phòng chỉ có một lựa chọn, trong khi nhiều trường dùng Google Workspace miễn phí.\n3. **Công cụ AI** — năm 2026 mà một khóa \"Phần mềm máy tính\" không nhắc gì đến trợ lý AI là khoảng trống khó biện minh.\n\n**Điểm mạnh:** phần đầu khóa (khái niệm phần mềm, phân loại, mã nguồn mở và đóng, quy trình phát triển) là kiến thức nền **không lỗi thời** và viết tốt — 9 bài, 21 ảnh. Mục hệ điều hành cũng vững, trung bình 619 chữ/bài với 17 ảnh.\n\n**Độ dài bài chênh lệch lớn**: từ 9 chữ (các bài kiểm tra) đến 1521 chữ. Trong nhóm bài lý thuyết, mục \"Trình soạn thảo và lập trình\" trung bình 721 chữ nhưng chỉ có **6 ảnh cho 5 bài** — thấp nhất khóa.","verdict":"Nền kiến thức về khái niệm phần mềm rất tốt và không lỗi thời, nhưng **nửa sau khóa nói về sản phẩm cụ thể nên xuống cấp nhanh nhất**: 4 bài phải xóa hoặc viết lại, trong đó bài về bộ gõ tiếng Việt hoàn toàn vô nghĩa với Philippines. Cộng với việc cả 45 bài nằm trong một chương, mức sửa là **nặng** — nhưng phần lớn là thay nội dung sản phẩm, không phải dựng lại khóa.","fit":"**Kết luận: dùng được, nhưng đây là khóa cần sửa nhiều nhất trong ba khóa phụ.**\n\n**Rào cản nghiêm trọng nhất — một bài hoàn toàn vô nghĩa với Philippines**\n\nBài 756 \"Các bộ gõ ngôn ngữ\" (723 chữ) dạy về **bộ gõ tiếng Việt**: bảng mã, kiểu gõ, cách bỏ dấu thanh. Tiếng Filipino và tiếng Anh đều dùng bảng chữ Latin không dấu thanh, gõ thẳng bằng bàn phím tiêu chuẩn. Học sinh Philippines **không có nhu cầu nào** với kiến thức này. Bài này phải xóa, không phải dịch.\n\n**Rào cản thứ hai — dạy phần mềm trả tiền cho học sinh không mua được**\n\nKhóa giới thiệu Microsoft Office (4 bài), AutoCAD, 3DS MAX, Photoshop, Lightroom. Đây đều là phần mềm bản quyền đắt tiền. Với mặt bằng thu nhập của phần lớn gia đình Philippines, giới thiệu chúng như lựa chọn mặc định là không thực tế. **Phải bổ sung lựa chọn miễn phí song song**: Google Docs/Sheets/Slides thay Office, GIMP thay Photoshop, Blender thay 3DS MAX, FreeCAD thay AutoCAD. Đây cũng nối được với hai bài về **phần mềm mã nguồn mở** đã có sẵn ở đầu khóa — hiện đang dạy khái niệm mà không dùng lại ở đâu.\n\n**Rào cản thứ ba — không có phần mềm điện thoại**\n\nCùng vấn đề với khóa Phần cứng: học sinh Philippines dùng điện thoại là chính, mà khóa không có bài nào về ứng dụng di động.\n\n**Thuận lợi**\n- Chủ đề phần mềm trung tính về văn hóa; ngoài bài bộ gõ thì không có nội dung nào chỉ đúng ở Việt Nam.\n- Không đòi thiết bị để thực hành.\n- Phần khái niệm nền (phân loại phần mềm, mã nguồn mở/đóng, quy trình phát triển) dùng được nguyên vẹn.\n\n**Phải sửa gì mới dùng được:** xóa bài bộ gõ tiếng Việt, xóa hoặc viết lại 3 bài lỗi thời, bổ sung lựa chọn phần mềm miễn phí, thêm chương về ứng dụng di động và phần mềm trên trình duyệt, tách chương."},"scores":{"engagement":{"score":5,"note":"Chủ đề gần gũi (trình duyệt, Office, Photoshop) nhưng trình bày hoàn toàn là bài đọc, không thực hành, không sản phẩm. 45 bài chạy liền một chương."},"coverage":{"score":4,"note":"Phủ tốt phần mềm máy tính để bàn, nhưng thiếu hẳn ba mảng lớn: ứng dụng di động, phần mềm chạy trên trình duyệt (Google Workspace), và công cụ AI."},"clarity":{"score":7,"note":"Trung bình 264–721 chữ mỗi bài, 100 ảnh trên 45 bài. Trừ điểm vì mục 'Trình soạn thảo và lập trình' chỉ có 6 ảnh cho 5 bài và có lỗi gõ ('vằ', 'tiêp')."},"practice":{"score":4,"note":"Có 7 bài kiểm tra rải đều cuối mỗi mục — bố trí hợp lý. Nhưng không có bài thực hành nào; học về phần mềm mà không mở phần mềm nào."},"structure":{"score":3,"note":"Cả 45 bài trong 1 chương. Ngoài ra tên mục đặt sai: 'Phần mềm tiện ích 1' thực chất là phần mềm đồ họa (AutoCAD, Photoshop), không phải tiện ích."},"fit":{"score":4,"note":"Có một bài hoàn toàn vô nghĩa với Philippines (bộ gõ tiếng Việt) và giới thiệu toàn phần mềm bản quyền đắt tiền mà không nêu lựa chọn miễn phí."}, e":1,"typeName":"Lý thuyết","metrics":{"words":1521,"chars":7088,"images":1,"duration":30},"issues":[{"level":"low","text":"Bài quá dài: 1521 chữ. Cân nhắc tách đôi."}],"action":"keep","note":"","steps":[],"preview":"","truncated":false,"redacted":true,"severity":""},{"id":747,"title":"MS Visual Studio","type":1,"typeName":"Lý thuyết","metrics":{"words":732,"chars":3474,"images":2,"duration":30},"issues":[],"action":"keep","note":"","steps":[],"preview":"","truncated":false,"redacted":true,"severity":""},{"id":748,"title":"Netbeans và Eclipse","type":1,"typeName":"Lý thuyết","metrics":{"words":830,"chars":3982,"images":2,"duration":30},"issues":[],"action":"edit","note":"Bài 830 chữ giới thiệu **Netbeans và Eclipse** — hai IDE Java giờ rất ít dùng với người mới học, trong khi khóa không nhắc gì đến Visual Studio Code, công cụ mà chính hai khóa Python trong cùng bộ này đang dùng. Bài còn có hai lỗi gõ: 'notepad **vằ** bắt đầu' và '**tiêp** tục'.","steps":["Viết lại thành bài về Visual Studio Code, nối với hai khóa Python lớp 6–9 và 10–12.","Giữ một đoạn ngắn về Netbeans/Eclipse trong bài 'Giới thiệu về các phần mềm lập trình'.","Sửa hai lỗi gõ."],"preview":"","truncated":false,"redacted":true,"severity":"med"},{"id":749,"title":"Các trình soạn thảo mã nguồn","type":1,"typeName":"Lý thuyết","metrics":{"words":512,"chars":2348,"images":1,"duration":30},"issues":[],"action":"keep","note":"","steps":[],"preview":"","truncated":false,"redacted":true,"severity":""},{"id":5413,"title":"Bài kiểm tra kiến thức","type":8,"typeName":"Kiểm tra","metrics":{"words":12,"chars":65,"images":0,"duration":10},"issues":[{"level":"med","text":"Bài quá sơ sài: chỉ 12 chữ (các bài cùng loại 300–600 chữ)."}],"action":"keep","note":"","steps":[],"preview":"","truncated":false,"redacted":true,"severity":""}]},{"title":"Phần mềm ứng dụng: Phần mềm tiện ích 1","action":"edit","note":"Tên mục sai nội dung: mang tên 'Phần mềm tiện ích 1' nhưng chứa AutoCAD, 3DS MAX, Photoshop, Lightroom — đều bảo vệ (mật khẩu, lừa đảo qua tin nhắn, quyền của app).","Đổi tên mục thành 'Phần mềm tiện ích và an toàn'."],"activities":[{"id":754,"title":"Phần mềm tiện ích - Phần mềm hỗ trợ từ xa","type":1,"typeName":"Lý thuyết","metrics":{"words":897,"chars":4150,"images":1,"duration":25},"issues":[],"action":"keep","note":"","steps":[],"preview":"","truncated":false,"redacted":true,"severity":""},{"id":755,"title":"Phần mềm nén và giải nén dữ liệu","type":1,"typeName":"Lý thuyết","metrics":{"words":524,"chars":2355,"images":3,"duration":30},"issues":[],"action":"keep","note":"","steps":[],"preview":"","truncated":false,"redacted":true,"severity":""},{"id":756,"title":"Các bộ gõ ngôn ngữ","type":1,"typeName":"Lý thuyết","metrics":{"words":723,"chars":3307,"images":3,"duration":25},"issues":[],"action":"delete","note":"**Toàn bộ bài (723 chữ) nói về bộ gõ tiếng Việt** — bảng mã, kiểu gõ, cách bỏ dấu thanh, các phần mềm Unikey/VNI. Tiếng Filipino và tiếng Anh dùng bảng chữ Latin không dấu thanh, gõ thẳng bằng bàn phím tiêu chuẩn. Học sinh Philippines không có nhu cầu nào với kiến thức này. Đây là bài duy nhất trong cả 7 khóa **hoàn toàn vô nghĩa** với thị trường đích — không phải dịch mà phải bỏ.","steps":["Xóa khỏi bản Philippines.","Vị trí trống thay bằng bài về ứng dụng di động hoặc mở rộng phần an toàn thông tin."],"preview":"","truncated":false,"redacted":true,"severity":"high"},{"id":757,"title":"Phần mềm liên lạc","type":1,"typeName":"Lý thuyết","metrics":{"words":1385,"chars":6474,"images":9,"duration":30},"issues":[{"level":"low","text":"Bài quá dài: 1385 chữ. Cân nhắc tách đôi."}],"action":"keep","note":"","steps":[],"preview":"","truncated":false,"redacted":true,"severity":""},{"id":758,"title":"Phần mềm diệt virus","type":1,"typeName":"Lý thuyết","metrics":{"words":375,"chars":1767,"images":2,"duration":30},"issues":[],"action":"keep","note":"","steps":[],"preview":"","truncated":false,"redacted":true,"severity":""},{"id":5415,"title":"Bài kiểm tra kiến thức","type":8,"typeName":"Kiểm tra","metrics":{"words":11,"chars":54,"images":0,"duration":10},"issues":[{"level":"med","text":"Bài quá sơ sài: chỉ 11 chữ (các bài cùng loại 300–600 chữ)."}],"action":"keep","note":"","steps":[],"preview":"","truncated":false,"redacted":true,"severity":""}]}],"count":45},{"title":"Tiện ích và an toàn máy tính","action":"add","note":"Chương 5 sau khi tách, 6 bài (sau khi bỏ bài bộ gõ tiếng Việt còn 5). Đặt cuối vì an toàn thông tin là phần đáng đọng lại nhất.","steps":["Chuyển sang chương này mục đang mang tên 'Phần mềm tiện ích 2'.","Xóa bài 'Các bộ gõ ngôn ngữ'.","Mở rộng bài diệt virus thành 2 bài: phần mềm độc hại là gì; cách tự bảo vệ (mật khẩu mạnh, lừa đảo qua tin nhắn, quyền của app)."],"sections":[],"count":0},{"title":"Ứng dụng trên điện thoại","action":"add","note":"**Chương soạn mới.** Khóa hiện không có một bài nào về ứng dụng di động, trong khi với phần lớn học sinh Philippines điện thoại là thiết bị số chính. Cùng lý do với chương điện thoại được đề xuất thêm cho khóa Phần cứng — hai chương này nên làm song song để nối nhau.","steps":["Quy mô 4–5 bài.","Bài 1: Ứng dụng di động khác gì phần mềm máy tính.","Bài 2: Kho ứng dụng (Google Play, App Store) — cài, gỡ, cập nhật; nhận biết ứng dụng giả mạo.","Bài 3: Quyền truy cập của ứng dụng — vì sao một app đèn pin không cần đọc danh bạ.","Bài 4: Ứng dụng chạy trên trình duyệt và ứng dụng cài đặt — khi nào dùng cái nào.","Bài 5: Ứng dụng học tập miễn phí phổ biến ở Philippines."],"sections":[],"count":0},{"title":"Phần mềm chuyên ngành","action":"add","note":"Chương 4 sau khi tách, 10 bài. Gom công cụ lập trình và công cụ đồ họa — đều là phần mềm chuyên môn, học sinh chỉ cần biết chúng tồn tại và dùng để làm gì.","steps":["Chuyển sang chương này 2 mục: 'Trình soạn thảo và lập trình' và mục đồ họa (đang mang tên sai là 'Phần mềm tiện ích 1').","Với mỗi phần mềm trả phí, bổ sung lựa chọn miễn phí tương đương."],"sections":[],"count":0},{"title":"Phần mềm dùng hằng ngày","action":"add","note":"Chương 3 sau khi tách, 11 bài. Gom trình duyệt và phần mềm văn phòng — hai nhóm học sinh chạm vào hằng ngày.","steps":["Chuyển sang chương này 2 mục: 'Trình duyệt web' và 'Phần mềm văn phòng'.","Xóa bài Internet Explorer, thêm bài Microsoft Edge.","Thêm bài về Google Docs/Sheets/Slides — lựa chọn miễn phí cho trường không mua được Office."],"sections":[],"count":0},{"title":"Hệ điều hành","action":"add","note":"Chương 2 sau khi tách, 9 bài.","steps":["Chuyển sang chương này 2 mục: 'Phần mềm hệ thống' và 'Giới thiệu về hệ điều hành'.","Viết lại bài Windows 10 theo Windows 11.","Thêm bài về Android và iOS."],"sections":[],"count":0},{"title":"Phần mềm là gì","action":"add","note":"Chương 1 sau khi tách, 9 bài. Đây là phần kiến thức nền **không lỗi thời** và viết tốt nhất khóa — giữ nguyên.","steps":["Chuyển nguyên mục 'Giới thiệu về phần mềm' sang chương này. Không sửa nội dung bài nào."],"sections":[],"count":0}]},{"key":"free-net","label":"Mạng máy tính","group":"Khóa phụ (free)","source":"computer-communication-network","isNew":false,"reviewed":true,"title":"Computer Communication & Network","summary":{"structure":"**Cả 55 bài nằm trong một chương** — cùng lỗi với hai khóa phụ còn lại. 11 mục bên trong cho ranh giới chương sẵn.\n\n### Đề xuất tách thành 6 chương\n\n| Chương mới | Gom từ các mục | Bài |\n|---|---|---:|\n| 1. Mạng máy tính là gì | Truyền thông dữ liệu và mạng máy tính + Các loại hình mạng và phân loại | 5 |\n| 2. Đường truyền và thiết bị mạng | Cáp mạng và phân loại + Thiết bị chuyển mạch, định tuyến và mô hình đấu nối | 10 |\n| 3. Công nghệ và tốc độ đường truyền | Các công nghệ phổ biến + Các thông số trong truyền tải mạng | 6 |\n| 4. Khái niệm cần biết và ứng dụng | Các khái niệm và một số điều cần biết về mạng + Một số ứng dụng của network | 9 |\n| 5. Dùng mạng ở nhà và xử lý sự cố | Các vấn đề thường gặp | 7 |\n| 6. Ôn tập cuối khóa | Câu hỏi cuối khóa 1 + 2 | 18 |\n\n**Vấn đề: 18/55 bài của khóa là câu hỏi ôn tập dồn hết vào cuối** — chiếm gần một phần ba khóa. Tệ hơn, tên các bài này chỉ là \"Quiz 1.1\", \"Quiz 1.2\"… \"Quiz 9.2\", không cho biết kiểm tra nội dung gì. Nên **rải về cuối từng chương tương ứng** thay vì dồn một chỗ; khi đó chương 6 không cần tồn tại và khóa còn 5 chương cân đối.\n\n**Mục mở đầu quá mỏng**: \"Truyền thông dữ liệu và mạng máy tính\" chỉ có 3 bài, trung bình **77 chữ mỗi bài** — mỏng nhất khóa, mà lại là phần đặt nền khái niệm.\n\n**Tên bài lẫn lộn hai ngôn ngữ.** Trong cùng một danh sách có \"Cáp mạng là gì?\", \"Cáp đồng trục\", \"Cáp quang\" đứng cạnh \"Telephone Cables\", \"Router\", \"Switch\", \"Hub\", \"Firewall\", \"Wireless\", \"Web browser\", \"IP camera\". Không theo quy tắc nào.","content":"**Lỗi dữ liệu nặng: cả 55/55 bài đều ghi thời lượng `999999999` phút.** Đây là giá trị rác chưa bao giờ được thay. Học viên mở khóa ra thấy mỗi bài \"999999999 phút\", và mọi thống kê thời lượng của khóa đều vô nghĩa. Đây là lỗi duy nhất thuộc loại này trong cả 7 khóa và phải sửa trước khi phát hành.\n\n**Nội dung phụ thuộc nhà mạng Việt Nam.** Bốn bài trực tiếp dùng bối cảnh Việt Nam:\n- 782 \"Các loại mạng\" — nêu Viettel, VNPT, FPT làm ví dụ nhà cung cấp.\n- 789 \"Cách xem gói cước của nhà mạng\" — hướng dẫn dựa trên bảng giá FPT tại Hà Nội.\n- 800 \"Khuyến cáo mua thiết bị\" — giá thiết bị tính bằng \"nghìn đồng\".\n- 802 \"Xử lý sự cố lỗi mạng, mạng chậm\" — bối cảnh Việt Nam.\n\nBài 789 là bài **phải viết lại hoàn toàn**, không phải dịch: cách đọc gói cước gắn chặt vào cấu trúc bảng giá của một nhà mạng cụ thể ở một thành phố cụ thể.\n\n**Nội dung lỗi thời:**\n- 785 \"ADSL\" — công nghệ đang bị loại bỏ dần, nhiều nước đã ngừng hẳn. Vẫn nên nhắc nhưng không nên dạy ngang hàng với cáp quang.\n- 803 \"Cách Map Network Drive trên window 10\" — Windows 10 hết hạn hỗ trợ từ 10/2025; tiêu đề còn viết sai \"window 10\" (thiếu \"s\", không viết hoa).\n\n**Lỗi chính tả trong tiêu đề bài:** 791 \"Subneting\" — phải là \"Subnetting\" (hai chữ t). Đây là tiêu đề bài học, học sinh nhìn thấy đầu tiên. 798 \"IOT (smart home)\" — chuẩn viết là \"IoT\".\n\n**Điểm mạnh rõ rệt: mục \"Các vấn đề thường gặp\"** (7 bài, 30 ảnh — nhiều ảnh nhất khóa) dạy chọn gói internet, cài wifi, xử lý mạng chậm, cải thiện sóng wifi. Đây là phần **thực dụng nhất trong cả ba khóa phụ** — kiến thức học sinh mang về nhà dùng được ngay. Đáng giữ và đáng đầu tư, chỉ cần đổi bối cảnh sang Philippines.\n\n**Nội dung nghề nghiệp:** bài 'Các ngành nghề về network' là bài duy nhất trong cả 7 khóa nói về định hướng nghề — đáng giữ và nên mở rộng.","verdict":"Chủ đề và cách chia mục hợp lý, và mục 'Các vấn đề thường gặp' là phần thực dụng nhất trong ba khóa phụ. Nhưng khóa có **một lỗi dữ liệu phải sửa ngay** (cả 55 bài ghi 999999999 phút) và **bốn bài gắn chặt vào nhà mạng Việt Nam**, trong đó một bài phải viết lại hoàn toàn. Cộng với việc cả 55 bài nằm trong một chương, mức sửa là **trung bình–nặng**.","fit":"**Kết luận: khóa có tiềm năng phù hợp nhất trong ba khóa phụ, nhưng phần thực dụng nhất lại chính là phần phụ thuộc Việt Nam nhiều nhất.**\n\n**Vì sao đặc biệt phù hợp với Philippines**\n- Philippines là một trong những nước có tỉ lệ dùng mạng xã hội và internet di động cao nhất thế giới, nhưng chất lượng đường truyền và giá cước là vấn đề thường trực. Một khóa dạy **cách chọn gói cước, cài wifi, xử lý mạng chậm** là kiến thức có giá trị thật với gia đình học sinh.\n- Địa hình quần đảo khiến hạ tầng mạng ở Philippines đa dạng: cáp quang ở đô thị, không dây và di động ở vùng xa. Nội dung khóa (cáp quang, wireless, các loại hình mạng theo phạm vi) khớp đúng bối cảnh này.\n- Không đòi thiết bị để thực hành, không đòi kiến thức lập trình.\n\n**Rào cản thật**\n1. **Bốn bài gắn nhà mạng Việt Nam** — và trớ trêu là chúng nằm đúng trong hai mục thực dụng nhất khóa. Bài 789 hướng dẫn đọc gói cước theo bảng giá FPT tại Hà Nội: phải **viết lại từ đầu** theo PLDT, Globe, Converge hoặc Sky, không thể dịch.\n2. **Thiếu hẳn phần mạng di động.** Khóa dạy ADSL, FTTH, wireless nhưng không có bài nào về mạng 4G/5G và gói dữ liệu di động — trong khi ở Philippines phần lớn người dùng lên mạng bằng điện thoại và mua gói data trả trước. Đây là khoảng trống lớn nhất về nội dung.\n3. **Không có phần an toàn khi dùng mạng.** Có bài về Firewall và \"Kiểm soát mạng\" nhưng không có bài nào về wifi công cộng, lừa đảo trực tuyến, bảo vệ tài khoản — những rủi ro học sinh gặp hằng ngày.\n\n**Phải sửa gì mới dùng được:** sửa lỗi thời lượng 999999999, viết lại bài gói cước theo nhà mạng Philippines, đổi tên nhà mạng và đơn vị tiền, thêm chương mạng di động, tách chương."},"scores":{"engagement":{"score":6,"note":"Mục 'Các vấn đề thường gặp' (cài wifi, xử lý mạng chậm) là nội dung dùng được ngay ở nhà — hấp dẫn thật. Nhưng 18/55 bài là câu hỏi ôn tập tên vô nghĩa ('Quiz 1.1'…'Quiz 9.2') dồn hết ở cuối."},"coverage":{"score":5,"note":"Phủ tốt mạng có dây và hạ tầng cố định. Thiếu hẳn hai mảng: mạng di động 4G/5G và gói data — thứ phần lớn người Philippines dùng — và an toàn khi dùng mạng."},"clarity":{"score":6,"note":"77 ảnh trên 55 bài, riêng mục xử lý sự cố có 30 ảnh. Trừ điểm vì mục mở đầu chỉ 77 chữ/bài, tên bài lẫn lộn Việt–Anh, và hai lỗi chính tả ngay trên tiêu đề ('Subneting', 'window 10')."},"practice":{"score":4,"note":"18 câu hỏi ôn tập là nhiều, nhưng dồn hết vào cuối khóa thay vì rải theo chương, và không có bài thực hành nào."},"structure":{"score":3,"note":"Cả 55 bài trong 1 chương, và gần một phần ba khóa (18 bài) là câu hỏi ôn tập dồn vào hai mục cuối."},"fit":{"score":5,"note":"Chủ đề rất hợp bối cảnh Philippines, nhưng bốn bài gắn chặt nhà mạng Việt Nam lại nằm đúng trong phần thực dụng nhất — một bài phải viết lại hoàn toàn."},"accuracy":{"score":4,"note":"Kiến thức không sai, nhưng cả 55/55 bài ghi thời lượng 999999999 phút — lỗi dữ liệu duy nhất thuộc loại này trong 7 khóa. Cộng nội dung lỗi thời (ADSL, Windows 10) và lỗi chính tả tiêu đề."}},"isDesign":false,"candidateFor":"","stats":{"chapters":7,"sections":11,"activities":55,"keep":46,"edit":9,"delete":0,"add":0,"high":1,"med":5},"chapters":[{"title":"Truyền thông và Mạng máy tính","action":"edit","note":"Chương duy nhất chứa cả 55 bài, trong đó 18 bài là câu hỏi ôn tập dồn vào hai mục cuối. Ngoài ra **toàn bộ 55 bài ghi thời lượng 999999999 phút**.","steps":["Sửa thời lượng cho cả 55 bài — đây là việc gấp nhất, phải làm trước khi phát hành.","Tách thành 5–6 chương theo bảng trong phần review cấu trúc.","Rải 18 câu hỏi ôn tập về cuối từng chương tương ứng; khi đó bỏ được chương 'Ôn tập cuối khóa' và khóa còn 5 chương cân đối.","Đặt lại tên 18 bài quiz: thay 'Quiz 1.1'…'Quiz 9.2' bằng tên nêu rõ nội dung kiểm tra.","Thống nhất ngôn ngữ tên bài — hiện lẫn lộn 'Cáp quang' với 'Telephone Cables', 'Router', 'Web browser'."],"sections":[{"title":"Truyền thông dữ liệu và mạng máy tính","action":"edit","note":"Mục mở đầu, đặt nền khái niệm cho cả khóa, nhưng chỉ có 3 bài với **trung bình 77 chữ mỗi bài** — mỏng nhất khóa. Bài 769 'Khái niệm Truyền thông Dữ liệu' chỉ 59 chữ.","steps":["Viết dày thêm cả 3 bài lên 250–350 chữ.","Thêm sơ đồ: dữ liệu đi từ máy này sang máy kia qua những chặng nào.","Mở bài bằng ví dụ học sinh nhận ra ngay: gửi một tin nhắn thì dữ liệu đi qua đâu."],"activities":[{"id":769,"title":"Khái niệm Truyền thông Dữ liệu","type":8,"typeName":"Kiểm tra","metrics":{"words":73,"chars":327,"images":1,"duration":999999999},"issues":[{"level":"high","text":"Thời lượng lỗi: `999999999` phút. Học viên nhìn thấy con số vô nghĩa."},{"level":"med","text":"Bài quá sơ sài: chỉ 73 chữ (các bài cùng loại 300–600 chữ)."}],"action":"edit","note":"Bài mở đầu cả khóa nhưng chỉ **59 chữ**. Đây là bài đặt nền khái niệm truyền thông dữ liệu — mỏng nhất khóa và ở đúng vị trí quan trọng nhất.","steps":["Viết dày lên 250–350 chữ.","Mở bằng ví dụ cụ thể: gửi một tin nhắn thì dữ liệu đi qua những chặng nào.","Thêm sơ đồ minh họa đường đi của dữ liệu."],"preview":"","truncated":false,"redacted":true,"severity":"med"},{"id":770,"title":"Các phương thức truyền thông", g chương này 2 mục: 'Các khái niệm và một số điều cần biết về mạng' và 'Một số ứng dụng của network'.","Sửa chính tả tiêu đề 'Subneting' → 'Subnetting' và 'IOT' → 'IoT'.","Mở rộng bài 'Các ngành nghề về network' theo bối cảnh việc làm CNTT ở Philippines."],"sections":[],"count":0},{"title":"Mạng di động và Internet trên điện thoại","action":"add","note":"**Chương soạn mới.** Khóa dạy ADSL, FTTH, wireless nhưng không có bài nào về 4G/5G và gói data di động — trong khi ở Philippines phần lớn người dùng lên mạng bằng điện thoại và mua gói data trả trước. Đây là khoảng trống nội dung lớn nhất của khóa. Chương này cũng nối với chương điện thoại được đề xuất thêm cho hai khóa Phần cứng và Phần mềm.","steps":["Quy mô 4–5 bài.","Bài 1: Mạng di động hoạt động thế nào — trạm phát sóng, vùng phủ; vì sao vào vùng xa thì mất sóng.","Bài 2: 3G, 4G, 5G khác nhau ra sao; đọc biểu tượng sóng trên điện thoại.","Bài 3: Gói data trả trước — cách chọn, cách kiểm tra dung lượng còn lại, vì sao hết data nhanh.","Bài 4: Phát wifi từ điện thoại và khi nào nên dùng.","Bài 5: Wifi hay data — chọn thế nào cho tiết kiệm; an toàn khi dùng wifi công cộng."],"sections":[],"count":0},{"title":"Công nghệ và tốc độ đường truyền","action":"add","note":"Chương 3 sau khi tách, 6 bài.","steps":["Chuyển sang chương này 2 mục: 'Các công nghệ phổ biến trong truyền tải mạng' và 'Các thông số trong truyền tải mạng'.","Thêm bài về mạng di động 4G/5G.","Rút gọn bài ADSL."],"sections":[],"count":0},{"title":"Đường truyền và thiết bị mạng","action":"add","note":"Chương 2 sau khi tách, 10 bài. Gom cáp mạng và thiết bị — đều là phần cứng của mạng.","steps":["Chuyển sang chương này 2 mục: 'Cáp mạng và phân loại' và 'Thiết bị chuyển mạch, định tuyến và mô hình đấu nối'.","Thống nhất ngôn ngữ tên bài (hiện lẫn 'Cáp quang' với 'Telephone Cables', 'Router', 'Switch')."],"sections":[],"count":0},{"title":"Mạng máy tính là gì","action":"add","note":"Chương 1 sau khi tách, 5 bài. Gom hai mục cùng đặt nền khái niệm.","steps":["Chuyển sang chương này 2 mục: 'Truyền thông dữ liệu và mạng máy tính' và 'Các loại hình mạng và phân loại'.","Viết dày thêm 3 bài của mục đầu — hiện chỉ 77 chữ/bài."],"sections":[],"count":0}]},{"key":"alt-scratch2","label":"Scratch cho học sinh mới bắt đầu","group":"Ứng viên mở rộng","source":"scratch-cho-nguoi-moi-bat-dau","isNew":false,"reviewed":true,"title":"Scratch cho học sinh mới bắt đầu","summary":{"structure":"Khóa 63 bài / 3 chương / 11 mục, tổ chức **theo dự án**: chương 1 'Giới thiệu' (10 bài, 5 mục) là nhập môn; chương 2 'Dự án đầu tiên' (19 bài) là 1 dự án chong chóng gió; chương 3 (34 bài) gộp 3 dự án (thiệp sinh nhật, thiệp 20/11, truyện Ếch ngồi đáy giếng).\n\n- **Chương lệch mạnh 10 / 19 / 34** — chương 3 chiếm 54% khóa. Nên **tách chương 3 thành 2 chương**: 'Thiết kế thiệp' (mục Bài 6 + Bài 7, 17 bài) và 'Xây dựng câu chuyện' (mục Bài 8 + Bài kiểm tra số 3, 17 bài) — ranh giới nội dung tự nhiên, không phải soạn thêm bài nào.\n- Mục quá to: 'Bài 5: Dự án chong chóng gió' 18 bài trong 1 mục, 'Bài 8: Câu chuyện Ếch ngồi đáy giếng' 16 bài trong 1 mục — học sinh không thấy mốc tiến độ.\n- Trong từng dự án, trình tự 5 bước (kịch bản → thiết kế → lập trình → âm thanh → hoàn thiện) rất mạch lạc, mỗi bước có video + lý thuyết (+ bài tập ở chương 2) — **tốt hơn hẳn cấu trúc của `instant-game-with-scratch`** (chương 2 khóa đó phình 55/70 bài).\n- Kiểm tra chỉ 3 bài cho 63 bài học và đặt đúng cuối 3 chương; riêng chương 3 dài 34 bài (3 dự án) mà chỉ có 1 quiz cuối — thiếu mốc giữa chừng.\n- Phân bố bài tập lệch: chương 1 = 0 bài tập, chương 2 = 5 (rất tốt, mỗi bước 1 bài), chương 3 = 3 (mục Bài 8 dài 16 bài chỉ có 1 bài tập cuối).","content":"Chất lượng nội dung khá, hơn `instant-game-with-scratch` về độ chi tiết nhưng thua về độ phủ kiến thức.\n\n**Điểm mạnh**\n- **274 ảnh / 63 bài (gấp 4,3 lần khóa cũ) và ảnh THẬT SỰ hữu ích**: kiểm tra các bài 6614 (21 ảnh/670 chữ), 6616 (29/734), 6618 (22/1.328), 6639 (28/911), 6643 (27/929) — ảnh là chụp màn hình từng bước thao tác bám đúng từng dòng hướng dẫn, không phải ảnh lặp trang trí. Học sinh có thể làm theo văn bản mà không cần xem video (ở chương 2 và mục Bài 6).\n- Đề bài tập mở và phân bậc tốt: bài 6768 chia Level 1–3, bài 6794 yêu cầu kể lại truyện từ góc nhìn khác — đúng tinh thần sáng tạo của Scratch.\n- Bài 8.2 (6705) mô tả khối lệnh kèm tọa độ, kích thước, thời gian chờ cụ thể từng nhân vật.\n\n**Điểm yếu**\n- **Độ phủ nhóm khối lệnh thiếu**: dạy chắc 5/9 nhóm (Chuyển động, Hiển thị, Âm thanh, Sự kiện, Điều khiển). Biến số chỉ xuất hiện 1 lần (biến đếm ngược, bài 6622), Phép toán chỉ là phép so sánh/ngẫu nhiên cài trong dự án, Cảm biến đúng 1 khối 'chạm vào' (bài 6764) — cả 3 nhóm không có bài dạy riêng. **Bút vẽ bị bỏ hẳn** (khóa cũ có). 'Khối của tôi' được liệt kê ở bài 6453 nhưng không bao giờ dạy.\n- **Trùng nội dung nghiêm trọng ở mục Bài 8**: bài 8.2 (6705, 1.940 chữ) tiêu đề chỉ là 'lập trình 2 cha con đại bàng' nhưng chứa lập trình của toàn bộ 16+ nhân vật, khiến bài 8.3 (6706, 896 chữ) **trùng nguyên văn ~100%** (mục 3.9–3.16 y hệt), bài 8.4 (6763) và 8.5 (6764) cũng chỉ là trích đoạn dán lại từ 6705.\n- **Lỗi copy-nhầm**: khối lệnh của nhân vật chữ 'The end' (trong 6705 và 6764) dán nguyên script của con ngựa ('liên tục di chuyển 10 bước… phát tin Bị ngựa đấm') — sai hoàn toàn với vai trò dòng chữ kết thúc.\n- Đánh số nội bộ sai hàng loạt: mục Bài 6 ghi 'BÀI 11', mục Bài 7 ghi 'Bài 11.1', mục Bài 8 ghi 'Bài 12.4/12.5' (di sản đánh số của giáo trình khác); '3.16' dùng cho 3 nhân vật khác nhau; bài 6643 có hai 'Bước 5'; bài 6641 nhảy từ Bước 6 sang Bước 8; bài 6622 đánh Bước 11 rồi quay về 3./4./5.\n- Khối 'Tổng quan chương trình' ~200 chữ dán lặp nguyên văn ở cả 4 bài 5.2–5.5.\n- 6 bài lý thuyết mỏng (<350 chữ: 6682, 6683, 6684, 6685, 6763, 6764) trong khi video tương ứng dài 8–21 phút — mục Bài 7 và nửa cuối Bài 8 phụ thuộc video, ngược hẳn chuẩn chi tiết của chương 2.\n- Quiz số 3 cấu hình **đạt 100%** (20 câu đúng tuyệt đối) — phi lý với lớp 3–5.\n- Nhiều bước yêu cầu tải ảnh/nhạc từ Google + remove.bg — cần internet và tiềm ẩn vấn đề bản quyền khi dạy đại trà.","verdict":"KHÔNG thay `instant-game-with-scratch` — điểm 6,1/10 thấp hơn 6,4 của khóa cũ, chủ yếu vì độ phủ kiến thức hẹp hơn (bỏ Bút vẽ; Cảm biến/Phép toán/Biến số chỉ lướt qua), chỉ 3 quiz và chủ đề thiệp kém hút trẻ hơn game. NÊN BỔ SUNG: lấy trọn dự án chong chóng gió (chương 2, 19 bài — chuẩn mực nhất khóa, ảnh dày, 5 bài tập) và dự án thiệp sinh nhật (mục Bài 6, 8 bài) ghép vào khóa cũ làm chương dự án tổng hợp; cân nhắc lấy thêm chương 1 (10 bài nhập môn, 35 ảnh) nếu phần mở đầu khóa cũ yếu. Mức sửa khi lấy sang: nhẹ–vừa (bản địa hóa vài câu, cắt phần tổng quan lặp).","fit":"**Dùng cho học sinh Philippines được ở mức chọn lọc, không nguyên khóa.**\n\n- **Rào cản văn hóa tập trung, sửa gọn được**: 8/63 bài cần bản địa hóa nằm gần trọn trong mục 'Bài 7: Thiết kế thiệp chúc mừng thầy cô nhân ngày 20/11' (9 bài) — 20/11 là Ngày Nhà giáo **Việt Nam**. Cách sửa rẻ nhất: đổi thành thiệp mừng **World Teachers' Day / National Teachers' Day Philippines (5/10)**, thay dòng chữ 'Chúc mừng Ngày Nhà giáo Việt Nam 20/11' → 'Happy Teachers' Day', giữ nguyên toàn bộ kỹ thuật (màn che, pháo hoa, mũi tên) — logic lập trình không đổi.\n- 'Ếch ngồi đáy giếng' là ngụ ngôn Á Đông nhưng bài học 'the frog in the well' phổ quát, kể lại bằng tiếng Anh dùng được; phương án bản địa hơn: thay bằng ngụ ngôn Philippines 'The Monkey and the Turtle' (bản kể của José Rizal) — kịch bản hội thoại + chuyển cảnh giữ nguyên khung kỹ thuật.\n- Bài 6452 dạy chuyển giao diện Scratch sang **tiếng Việt**, và các bài 6639/6641/6643 lặp bước 'thiết lập ngôn ngữ tiếng Việt' — phải đổi thành English (Philippines dạy bằng tiếng Anh nên đây lại là lợi thế: giao diện Scratch mặc định English, đỡ một bước).\n- **Hạ tầng**: nhiều bước yêu cầu tải ảnh vector/nhạc từ Google và dùng remove.bg — cần internet ổn định; với trường thiếu thiết bị nên soạn sẵn gói tài nguyên (ảnh, âm thanh) phát kèm bài. Scratch chạy được bản offline (đã dạy cài ở bài 6450) là điểm cộng cho bối cảnh Philippines.\n- **Độ khó khớp lớp 3–5** (K-12 Philippines: Grade 3–5): thao tác kéo-thả, tọa độ có giải thích số âm bằng lời (bài 6453) — phù hợp; riêng dự án Ếch (16 bài, ~20 tin nhắn broadcast đan nhau) chạm trần lớp 5.\n- Ngôn ngữ đích tiếng Anh: ghi nhận một lần ở mức khóa — toàn bộ lời giảng kiểu gỡ băng ('thầy sẽ…') khi dịch nên biên tập lại thành hướng dẫn trung tính, ngắn gọn."},"scores":{"engagement":{"score":8,"note":"4 sản phẩm hoàn chỉnh (chong chóng gió có intro + đếm ngược, 2 thiệp động, truyện hoạt hình 5 cảnh có hội thoại) và bài tập mở phân bậc (6768 Level 1–3, 6794 kể lại truyện từ góc nhìn khác) — nhưng không có game tương tác nào nên kém sức hút hơn khóa cũ (9đ) với trẻ 8–10 tuổi."},"coverage":{"score":6,"note":"Dạy chắc 5/9 nhóm khối lệnh (Chuyển động, Hiển thị, Âm thanh, Sự kiện, Điều khiển); Biến số chỉ 1 lần (biến đếm ngược bài 6622), Phép toán và Cảm biến chỉ xuất hiện cài trong dự án không có bài riêng; Bút vẽ bị bỏ hẳn; 'Khối của tôi' nêu ở bài 6453 rồi không bao giờ dạy."},"clarity":{"score":7,"note":"274 ảnh chụp từng bước bám sát văn bản (6616: 29 ảnh, 6639: 28 ảnh) giúp tự học không cần video ở chương 1–2; trừ điểm vì văn gỡ băng dài dòng và 6 bài mỏng <350 chữ (6682–6685, 6763, 6764) phụ thuộc hoàn toàn video 8–21 phút."},"practice":{"score":6,"note":"8 bài tập đề tốt nhưng phân bố lệch: chương 1 không có bài tập nào, chương 2 có 5 (mỗi bước 1 bài — chuẩn), mục Bài 8 dài 16 bài chỉ có 1 bài tập cuối; quiz chỉ 3 bài (khóa cũ 11)."},"structure":{"score":5,"note":"Chương lệch 10/19/34 (chương 3 chiếm 54%), mục 'Bài 5' 18 bài và 'Bài 8' 16 bài không chia nhỏ; bù lại trình tự 5 bước trong từng dự án rất mạch lạc nên vẫn hơn khóa cũ (4đ, chương phình 55/70)."},"fit":{"score":6,"note":"8/63 bài phải bản địa hóa nhưng dồn gọn ở mục Bài 7 (thiệp 20/11 → đổi Teachers' Day 5/10) + truyện ngụ ngôn Á Đông và các bước 'thiết lập ngôn ngữ tiếng Việt'; nhiều bước cần tải tà mages":0,"duration":45},"issues":[],"action":"keep","note":"","steps":[],"preview":"","truncated":false,"redacted":true,"severity":""}]},{"title":"Bài kiểm tra số 3","action":"keep","note":"","steps":[],"activities":[{"id":6722,"title":"Bài kiểm tra số 3","type":8,"typeName":"Kiểm tra","metrics":{"words":5,"chars":17,"images":0,"duration":45},"issues":[{"level":"med","text":"Bài quá sơ sài: chỉ 5 chữ (các bài cùng loại 300–600 chữ)."}],"action":"edit","note":"Cấu hình quiz: 20 câu, đạt 100% — bắt học sinh lớp 3–5 đúng tuyệt đối 20/20 mới qua, trong khi quiz 1 và 2 chỉ yêu cầu 70%; gần như chắc chắn là lỗi cấu hình.","steps":["Hạ ngưỡng đạt về 70% cho thống nhất với 2 bài kiểm tra trước"],"preview":"","truncated":false,"redacted":true,"severity":"high"}]}],"count":34},{"title":"Xây dựng câu chuyện","action":"add","note":"Chương 3 hiện chiếm 54% khóa (34 bài). Tách theo ranh giới nội dung tự nhiên: chuyển nguyên mục 'Bài 8: Câu chuyện Ếch ngồi đáy giếng' (16 bài) và mục 'Bài kiểm tra số 3' (1 bài) sang chương mới này; chương cũ đổi tên còn 'Thiết kế thiệp'. Sau tách: 4 chương 10/19/18/17 — cân.","steps":["Chuyển mục 'Bài 8: Câu chuyện Ếch ngồi đáy giếng' và 'Bài kiểm tra số 3' sang chương mới, giữ nguyên thứ tự bài","Đổi tên chương cũ thành 'Thiết kế thiệp'"],"sections":[],"count":0}]},{"key":"alt-sql","label":"Làm quen với SQL","group":"Ứng viên mở rộng","source":"lam-quen-voi-sql","isNew":false,"reviewed":true,"title":"Làm quen với SQL","summary":{"structure":"Khóa có **91 bài (35 quiz + 56 bài code) dồn hết vào 1 chương duy nhất \"Làm quen với SQL\"** — vi phạm trực tiếp tiêu chí trong BRIEF (1–2 chương cho 45+ bài là không dùng được). Bù lại, bên trong đã có sẵn **10 mục rất mạch lạc** theo đúng trình tự sư phạm chuẩn của một khóa SQL nhập môn: Giới thiệu CSDL → Khởi tạo bảng → Ràng buộc → Sửa đổi dữ liệu → Chuẩn hóa → Truy vấn → Lọc → Gộp bảng → Phân nhóm → Truy vấn con. Ranh giới nội dung tự nhiên rõ đến mức việc tách chương gần như chỉ là thao tác gom mục:\n\n| Chương mới đề xuất | Gom các mục | Số bài |\n|---|---|---:|\n| 1. Cơ sở dữ liệu và kiểu dữ liệu | Giới thiệu về cơ sở dữ liệu (id 549–558) | 10 |\n| 2. Thiết kế bảng | Khởi tạo bảng (559–567) + Hiểu biết về những ràng buộc (568–574) | 16 |\n| 3. Sửa đổi và chuẩn hóa dữ liệu | Sửa đổi dữ liệu (575–584) + Chuẩn hóa cơ sở dữ liệu (585–591) | 17 |\n| 4. Truy vấn và lọc dữ liệu | Truy vấn dữ liệu (592–602) + Lọc dữ liệu (603–613) | 22 |\n| 5. Truy vấn nhiều bảng và nâng cao | Gộp nhiều bảng (614–623) + Phân nhóm dữ liệu (624–635) + Truy vấn con (636–639) | 26 |\n\nMất cân đối nhẹ ở hai điểm: mục **Truy vấn con chỉ có 4 bài** (thiếu IN/ANY/ALL, subquery trong FROM) trong khi Phân nhóm dữ liệu có 12 bài; và khóa **kết thúc cụt** ở \"Subquery Technique Review (1)\" — không có bài tổng kết, không có project cuối khóa. Điểm cộng cấu trúc: quiz xen kẽ bài code khá đều (35 quiz phân bố khắp 10 mục), mỗi mục đều có bài Review riêng.","content":"**Điểm bất ngờ lớn nhất: toàn bộ 91 bài đã viết bằng tiếng Anh 100%** — khác hẳn các ứng viên khác phải dịch toàn bộ. Phần Theory biên soạn khá bài bản (nhiều đoạn phỏng theo phong cách postgresqltutorial.com), mỗi bài đều có bảng dữ liệu ví dụ + output kỳ vọng; đề bài code có bối cảnh tình huống (cảnh sát truy tìm cướp ngân hàng qua LIKE ở id 606–607, động đất Indonesia/Papua New Guinea ở id 609, doanh thu cửa hàng ở id 635) nên không khô khan. 56 bài code đều có test case (2–6 test/bài) và giới hạn 2 giây trên PostgreSQL.\n\nBa điểm trừ lớn:\n1. **Gần như không có hình**: chỉ 8 ảnh/91 bài (Venn diagram ở id 614, 616; 1 ảnh ở 624, 635, 637). Các khái niệm rất cần hình (JOIN, khóa ngoại, chuẩn hóa 1NF/2NF/3NF) đang diễn giải thuần chữ, nhiều bài 500–800 chữ liền mạch.\n2. **Lỗi biên tập dày đặc trong chính tiếng Anh sẽ dùng làm bản cuối**: \"PosgreSQL\" lặp 9 lần, \"Philipinese\" (viết sai tên Philippines, id 609), \"Joing Multiple Tables\" ngay trên tiêu đề 2 bài (622, 623), \"sucessfully\", \"structrure\", \"Sugesstion\", \"answear\"… Vì nội dung đã là tiếng Anh (không qua khâu dịch lại), các lỗi này sẽ lộ nguyên trước học sinh Philippines nếu không rà soát.\n3. **Một số lệnh SQL trong đề/theory bị vỡ định dạng — cùng loại lỗi mất ký tự như vụ mất toán tử `**` ở khóa python-for-beginners**: id 564 mất dấu phẩy trong CREATE TABLE làm đề quiz hỏng tiền đề; id 574 in \"id I NTEGER\" (chữ bị tách đôi); id 571, 587, 609 mất dấu phẩy/ngoặc trong code mẫu. Kèm 1 lỗi kiến thức thật: id 555 mô tả \"REAL or FLOAT8 is a 4-byte floating-point number\" — sai, REAL (FLOAT4) mới là 4 byte, FLOAT8 là 8 byte (double precision).\n\nVề trả lời câu hỏi \"SQL có thực sự dễ tiếp cận hơn Python với học sinh chưa biết lập trình không\": **dựa trên nội dung thật thì có, ở nửa đầu khóa**. Khóa mở đầu từ số 0 tuyệt đối (\"What is a database?\", bảng, hàng, cột — id 549, 550), không giả định biết lập trình; các lệnh SELECT/WHERE/ORDER BY đọc gần như câu tiếng Anh tự nhiên và bài nào cũng cho sẵn bảng input + output kỳ vọng nên học sinh chỉ \"điền câu lệnh\". Không có biến, vòng lặp, hàm — rào cản tư duy thủ tục bằng 0. Nhưng nửa sau (chuẩn hóa 1NF/2NF/3NF ở 585–591, self join 618–620, subquery 636–639) là trừu tượng thật sự, và **bối cảnh đề bài toàn thế giới công sở người lớn** (lương nhân viên, lãi suất khoản vay, Fortune Global 500, hoa hồng) — hợp cấp 3, không hợp tiểu học.","verdict":"Dùng được ở mức sửa nhẹ–vừa: nội dung tiếng Anh có sẵn 100%, bài tập chấm tự động đầy đủ, chỉ phải (1) tách 1 chương thành 5 chương theo ranh giới mục có sẵn, (2) sửa ~15 bài có lỗi biên tập/lỗi kiến thức, (3) bản địa hóa 3 bài dùng tên riêng Việt Nam. **Có chen được vào top 3 khóa phụ: CÓ — điểm trung bình 6.1 chỉ đứng sau computer-essential (6.9), đề xuất thay `phan-mem-may-tinh` (4.3)**; công sửa rẻ hơn hẳn các khóa đang chọn vì bỏ hẳn khâu dịch. Điều kiện đi kèm: phải ghi rõ đây là khóa cho lớp 8 trở lên (hoặc học sau khóa Python lớp 6–9), vì tiêu chí \"không phân biệt cấp lớp\" chỉ thỏa một nửa — không cần biết lập trình trước, nhưng khóa bị cắt cụt từ một giáo trình dài hơn.","content":"Nội dung **100% tiếng Việt** — khác hẳn lam-quen-voi-sql (đã tiếng Anh sẵn), nên chi phí thật để dùng cho Philippines là **dịch toàn bộ 14.584 chữ**, không phải chỉ bản địa hóa 10 bài có tên riêng Việt (Trung, Tuan, Viet, Dung, Huong ở id 301, 302, 325...). Phần lý thuyết viết tận tình theo lối cầm tay chỉ việc (mỗi bài có mục Lý thuyết + Hướng dẫn kèm code mẫu giải sẵn toàn bộ bài), nhưng **cả khóa chỉ có đúng 1 ảnh** (công thức diện tích tam giác ở id 307) và đề bài toàn ngữ cảnh số học khô khan (a, b, x, y, z) — không có dự án, trò chơi hay sản phẩm nào.\n\n**Trả lời câu hỏi trùng lặp với khóa lớp 6–9 (`python-for-beginners`)**: trùng rất nặng. Khóa 6–9 dạy: biến, kiểu dữ liệu, nhập xuất, định dạng chuỗi, số và toán học, toán tử, if-elif-else, for/while, break/continue, chuỗi và phương thức chuỗi, hàm. Đối chiếu từng mục của python-fundamentals: 9/11 mục (Chương trình đầu tiên, Kiểu dữ liệu, Đầu vào, Toán tử, Câu lệnh lựa chọn, Vòng lặp, Chuỗi, Hàm, và phần lớn 2 mục Luyện tập) nằm gọn trong danh sách đó — **~44/59 bài ≈ 75% trùng chủ đề**. Phần duy nhất khóa 6–9 không liệt kê là mục \"Mảng và liệt kê\" (5 bài list) và vài bài luyện tập dùng list. Nói cách khác, python-fundamentals là **bản rút gọn 59 bài của chính khóa 132 bài đã chọn làm khóa lớp 6–9**, thêm chương list — đưa vào bộ khóa phụ là dạy lại cùng nội dung, tốn công dịch mà không thêm giá trị.\n\nLỗi nội dung tìm được trên bài thật: id 315 đề nói `temperature < 0` nhưng code mẫu/đáp án dùng `<= 0` (mâu thuẫn tại giá trị 0); id 316 ví dụ in \"y is greater than 20\" trong khi chuỗi yêu cầu là \"y is greater than or equal to 20\"; id 317 phần giải thích tính sai số học \"(10+20+20)/3 = 20\" (đúng là 16.67) và chuỗi if-elif bỏ sót trường hợp a=b=c (không in gì); id 312 dạy dùng toán tử `is` để so sánh giá trị 2 số nguyên — sai bản chất (với CPython, `is` trên số nguyên lớn trả False dù giá trị bằng nhau); id 334 in cú pháp khai báo hàm thiếu ngoặc \"def <tên_hàm>:\"; id 310 liệt kê thừa placeholder H không tồn tại; id 307 bảng toán tử in \"a**b = a b\" — phần mũ dạng superscript bị mất khi hiển thị (cùng loại lỗi định dạng với vụ mất `**` ở khóa lớp 6–9, may là ở đây ký hiệu `**` vẫn còn). Trùng bài trong nội bộ khóa: id 292 / 299 / 304 là ba biến thể \"tính tổng, hiệu, tích, thương\" (299 trùng cả tiêu đề với 292); id 293 / 300 cùng là diện tích + chu vi hình chữ nhật; id 308 / 340 cùng là \"tính a mũ b\".","verdict":"**KHÔNG chen được vào top 3 khóa phụ.** Điểm trung bình 5.0 — thấp hơn cả ai-for-primary-students (5.9) và phan-cung-may-tinh (5.6); quan trọng hơn, ~75% nội dung trùng chủ đề với chính khóa lớp 6–9 bắt buộc (python-for-beginners 132 bài), nên thêm nó vào bộ là trả tiền dịch 14.584 chữ để dạy lại thứ đã có. Giả thuyết \"rẻ vì toàn bài code\" sai với khóa này: chỉ 10/59 bài dính tên riêng Việt Nam thật, nhưng toàn khóa là tiếng Việt nên vẫn phải dịch 100% — không rẻ hơn các ứng viên đang chọn. Chỉ nên tận dụng như **kho bài tập bổ sung** cho khóa lớp 6–9 (đặc biệt 5 bài list id 325–329 và 9 bài luyện tập id 339–347).","fit":"**Không nên dùng làm khóa phụ độc lập cho học sinh Philippines.**\n\n- **Ngôn ngữ**: 100% tiếng Việt — phải dịch toàn bộ sang tiếng Anh (14.584 chữ, 59 bài kèm test case). Đây là khoản chi phí lớn nhất và khiến lợi thế \"chỉ 10/59 bài cần bản địa hóa\" trở nên vô nghĩa: 10 bài đó chỉ là chỗ có tên riêng Việt (Trung, Tuan, Viet, Dung, Huong, \"Viet Nam\"), còn khâu dịch thì đằng nào cũng phủ cả khóa.\n- **Yêu cầu gốc \"không phân biệt cấp lớp\"**: vi phạm — 59/59 bài là bài code, đòi gõ chương trình Python từ bài đầu tiên. Khóa khởi đầu từ Hello World nên không cần biết lập trình *trước*, nhưng tốc độ dồn dập (không quiz, không bài đọc xen kẽ) và đề dạng số học trừu tượng chỉ hợp từ lớp 6 trở lên — đúng tầm của khóa python-for-beginners đã có, và vì thế càng lộ rõ sự thừa.\n- **Trùng vai trò trong bộ khóa**: học sinh Philippines học bộ này sẽ gặp lại ~75% nội dung ở hai nơi (khóa lớp 6–9 và khóa phụ này). Khóa phụ nên bổ sung góc nhìn khác (phần cứng, mạng, kỹ năng số, SQL...) chứ không lặp Python cơ bản.\n- **Thiết bị**: bài code ngắn chạy trên IDE web — ổn với máy yếu, khó với điện thoại như mọi khóa code.\n- **Nếu vẫn muốn tận dụng**: dịch chọn lọc mục \"Mảng và liệt kê\" (325–329) + \"Bài luyện tập I, II\" (339–347) rồi nhập vào khóa lớp 6–9 làm bài luyện thêm — rẻ hơn nhiều so với dựng cả khóa."},"scores":{"engagement":{"score":4,"note":"40/59 tiêu đề lặp khuôn \"Bài tập Python cơ bản: ...\", ngữ cảnh toàn a, b, x, y, z số học, đúng 1 ảnh cho cả khóa (id 307) và không có dự án/trò chơi/sản phẩm nào — thua xa mức trung bình."},"coverage":{"score":5,"note":"Phủ được lõi print → biến → nhập xuất → toán tử → if → vòng lặp → list → chuỗi → hàm, nhưng chính lý thuyết hứa dict/tuple/set \"ở các chương tiếp theo\" (id 295) mà không chương nào tồn tại; thiếu định dạng chuỗi (f-string), thiếu bài while riêng, gợi ý đệ quy (id 340, 341) nhưng chưa từng dạy đệ quy."},"clarity":{"score":6,"note":"Lý thuyết cầm tay chỉ việc, bài nào cũng có ví dụ chạy được + code mẫu giải sẵn, câu chữ ngắn dễ hiểu; trừ điểm vì chỉ 1 ảnh/59 bài và một loạt ví dụ mâu thuẫn với chính đề (id 315, 316, 317)."},"practice":{"score":7,"note":"59/59 bài là bài code chấm tự động (2–6 test case), mật độ luyện tay cao nhất trong các ứng viên và có 2 mục luyện tập tổng hợp cuối khóa; trừ điểm vì 0 quiz kiểm tra kiến thức và mọi bài đều in sẵn lời giải ngay trong đề (mục Hướng dẫn) làm giảm giá trị luyện tập."},"structure":{"score":3,"note":"1 chương cho 59 bài — lỗi nặng theo BRIEF; 11 mục bên trong xếp đúng trình tự nên tách 4 chương là khả thi ngay, nhưng khóa còn để lộ vết cắt cụt (lý thuyết tham chiếu các chương không tồn tại ở id 295, 312)."},"fit":{"score":5,"note":"Phải dịch 100% từ tiếng Việt (14.584 chữ) — chi phí ngang các khóa đang chọn chứ không rẻ; và trùng ~75% chủ đề với khóa lớp 6–9 bắt buộc nên không đóng thêm vai trò gì trong bộ khóa Philippines."},"accuracy": on":20},"issues":[],"action":"edit","note":"Lỗi kiến thức: bài yêu cầu dùng toán tử `is` để kiểm tra 2 số nguyên \"có cùng giá trị hay không\" và lý thuyết viết \"với int, str, float... toán tử này tương đương ==\". Sai: `is` so sánh danh tính đối tượng; trong CPython, 2 int bằng nhau ngoài khoảng cache [-5, 256] có thể cho `a is b == False` (ví dụ a=1000, b=1000 nhập từ input). Bài đang dạy một thói quen sai mà chính cảnh báo nổi tiếng của Python khuyên tránh.","steps":["Viết lại đề: dùng `is` đúng ngữ cảnh danh tính (ví dụ 2 biến cùng trỏ 1 list, hoặc kiểm tra `x is None`).","Sửa lý thuyết: nói rõ `==` so sánh giá trị, `is` so sánh danh tính, kèm ví dụ 1000 is 1000 qua biến cho thấy False.","Cập nhật test case theo đề mới."],"preview":"","truncated":false,"redacted":true,"severity":"high"},{"id":313,"title":"Toán tử Logical trong Python","type":12,"typeName":"Bài code","metrics":{"words":314,"chars":1344,"images":0,"duration":20},"issues":[],"action":"keep","note":"","steps":[],"preview":"","truncated":false,"redacted":true,"severity":""}]},{"title":"Câu lệnh lựa chọn","action":"edit","note":"3/5 bài của mục có lỗi đề hoặc ví dụ (id 315, 316, 317 — chi tiết ở activityActions); trình tự if-else → elif hợp lý, giữ khung nhưng phải sửa đề trước khi dịch.","steps":[],"activities":[{"id":314,"title":"Câu lệnh if-else trong Python","type":12,"typeName":"Bài code","metrics":{"words":650,"chars":2823,"images":0,"duration":30},"issues":[],"action":"edit","note":"Lỗi chính tả trong lý thuyết: \"bạn cần biết cách sử dụng đề if-else\" (thiếu chữ \"mệnh\"), \"màn hính\"; phần toán tử 3 ngôi viết \"toán tử 3 ngồi\" 2 lần.","steps":["Sửa \"đề\"→\"mệnh đề\", \"màn hính\"→\"màn hình\", \"3 ngồi\"→\"3 ngôi\"."],"preview":"","truncated":false,"redacted":true,"severity":"low"},{"id":315,"title":"Rút gọn mệnh đề if-else thành elif trong Python","type":12,"typeName":"Bài code","metrics":{"words":320,"chars":1567,"images":0,"duration":20},"issues":[],"action":"edit","note":"Đề tự mâu thuẫn với đáp án: đề ghi \"Nếu temperature < 0, in ra It's cool outside\" nhưng code mẫu (và nhiều khả năng test case) dùng `elif temperature <= 0` — tại temperature = 0 đề bảo in \"Let's go to school\" còn đáp án in \"It's cool outside\". Ngoài ra điều kiện \"temperature = 75\" là so sánh bằng đúng 1 giá trị nằm giữa các dải >= — dễ gây hiểu nhầm là dải nhiệt độ.","steps":["Chốt một phía: đổi đề thành `temperature <= 0` HOẶC đổi code mẫu + test case thành `< 0`; kiểm tra test case thực tế trước khi chọn.","Cân nhắc đổi \"= 75\" thành dải (ví dụ >= 75) cho tự nhiên, cập nhật ví dụ."],"preview":"","truncated":false,"redacted":true,"severity":"high"},{"id":316,"title":"Bài tập Python cơ bản: so sánh 3 số với nhau","type":12,"typeName":"Bài code","metrics":{"words":246,"chars":934,"images":0,"duration":20},"issues":[],"action":"edit","note":"Ví dụ mâu thuẫn với yêu cầu: đề bắt in \"y is greater than or equal to 20\" nhưng phần ví dụ viết \"thì in ra màn hình y is greater than 20\" — học sinh làm theo ví dụ sẽ trượt test. Tiêu đề \"so sánh 3 số với nhau\" cũng không mô tả đúng nội dung (kiểm tra chẵn/lẻ của x rồi so y, z với ngưỡng).","steps":["Sửa ví dụ thành đúng chuỗi \"y is greater than or equal to 20\".","Đổi tiêu đề thành \"if lồng nhau: kiểm tra chẵn lẻ và ngưỡng\" (hoặc tương đương)."],"preview":"","truncated":false,"redacted":true,"severity":"med"},{"id":317,"title":"Bài tập Python cơ bản: Tính trung bình của 3 số tự nhiên","type":12,"typeName":"Bài code","metrics":{"words":402,"chars":1714,"images":0,"duration":20},"issues":[],"action":"edit","note":"Giải thích ví dụ tính sai số học: \"avg = (10+20+20)/3 = 20\" — đúng ra là 16.67 (kết luận cuối vẫn đúng nhưng con số sai); chuỗi if-elif trong đáp án không in gì khi a = b = c (thiếu nhánh else); typo \"Lý tuyết\".","steps":["Sửa giải thích thành avg = 50/3 ≈ 16.67.","Bổ sung vào đề quy định trường hợp avg không lớn hơn số nào (hoặc thêm else in thông báo) và thêm test case a=b=c.","Sửa \"Lý tuyết\"→\"Lý thuyết\"."],"preview":"","truncated":false,"redacted":true,"severity":"med"},{"id":318,"title":"Bài tập Python cơ bản: In ra màn hình so sánh năm tuổi của vật nuôi","type":12,"typeName":"Bài code","metrics":{"words":152,"chars":652,"images":0,"duration":20},"issues":[],"action":"edit","note":"Đề thiếu dấu nháy đóng ở dòng cuối yêu cầu (\" Over 5 human years .) và logic hiển thị \"Over 5 human years\" cho age = 3 là quy ước lạ, cần 1 câu giải thích quy đổi tuổi vật nuôi để đề không như đánh đố.","steps":["Đóng dấu nháy, thêm 1 câu: \"quy ước mỗi năm của vật nuôi sau năm thứ 2 tính bằng nhiều năm người, nên từ 3 tuổi hiển thị Over 5 human years\"."],"preview":"","truncated":false,"redacted":true,"severity":"low"},{"id":null,"title":"Quiz: Biến, toán tử và rẽ nhánh","type":null,"typeName":"Kiểm tra","metrics":{"words":0,"chars":0,"images":0,"duration":0},"preview":"","issues":[],"action":"add","severity":"","note":"Khóa hiện có 0 quiz trên 59 bài — không có điểm kiểm tra kiến thức nào giữa chừng; vị trí sau mục Câu lệnh lựa chọn là mốc nửa khóa tự nhiên.","steps":["Soạn 8–10 câu trắc nghiệm về kiểu dữ liệu, ép kiểu, toán tử ( //, %, ** ), if-elif-else.","Trộn 2–3 câu dạng \"đọc code đoán output\"."],"kind":"quiz"}]},{"title":"Vòng lặp","action":"keep","note":"6 bài dạy while + for + break/continue với code mẫu cho cả 2 cách giải — mục chắc tay nhất khóa.","steps":[],"activities":[{"id":319,"title":"Vòng lặp for trong Python","type":12,"typeName":"Bài code","metrics":{"words":435,"chars":1809,"images":0,"duration":30},"issues":[],"action":"keep","note":"","steps":[],"preview":"","truncated":false,"redacted":true,"severity":""},{"id":320,"title":"Bài tập python cơ bản: tính tổng các số lẻ từ a tới b","type":12,"typeName":"Bài code","metrics":{"words":141,"chars":540,"images":0,"duration":15},"issues":[],"action":"keep","note":"","steps":[],"preview":"","truncated":false,"redacted":true,"severity":""},{"id":321,"title":"Câu lệnh break trong Python","type":12,"typeName":"Bài code"," ,"type":12,"typeName":"Bài code","metrics":{"words":127,"chars":494,"images":0,"duration":20},"issues":[],"action":"edit","note":"Gợi ý \"sử dụng phương pháp đệ quy để tìm ước chung lớn nhất\" — đệ quy chưa dạy trong khóa; bài giải được hoàn toàn bằng vòng lặp đã học.","steps":["Đổi gợi ý sang cách vòng lặp (duyệt từ min(a,b) xuống 1) hoặc thuật toán Euclid dạng while."],"preview":"","truncated":false,"redacted":true,"severity":"low"},{"id":342,"title":"Bài tập Python cơ bản: Xác định hình tam giác với 3 cạnh cho trước","type":12,"typeName":"Bài code","metrics":{"words":211,"chars":886,"images":0,"duration":25},"issues":[],"action":"keep","note":"","steps":[],"preview":"","truncated":false,"redacted":true,"severity":""}]},{"title":"Bài luyện tập II","action":"keep","note":"5 bài chốt khóa (ing/ly, ước số, số abundant) có độ khó tăng dần hợp lý; giữ nguyên, chỉ cần dịch.","steps":[],"activities":[{"id":343,"title":"Bài tập python cơ bản: tìm ra từ có độ dài lớn hơn 3","type":12,"typeName":"Bài code","metrics":{"words":145,"chars":660,"images":0,"duration":20},"issues":[],"action":"keep","note":"","steps":[],"preview":"","truncated":false,"redacted":true,"severity":""},{"id":344,"title":"Bài tập Python cơ bản: chuyển đổi mỗi phần tử trong list thành số tự nhiên","type":12,"typeName":"Bài code","metrics":{"words":120,"chars":539,"images":0,"duration":25},"issues":[],"action":"edit","note":"Tiêu đề \"chuyển đổi mỗi phần tử trong list thành số tự nhiên\" mô tả sai nhiệm vụ thật (nối các phần tử thành MỘT số: [9,10,11] → 91011).","steps":["Đổi tiêu đề thành \"nối các phần tử trong list thành một số\" cho khớp ví dụ."],"preview":"","truncated":false,"redacted":true,"severity":"low"},{"id":345,"title":"Bài tập Python cơ bản: Kiểm tra str có nhiều hay ít hơn 3 ký tự","type":12,"typeName":"Bài code","metrics":{"words":193,"chars":828,"images":0,"duration":25},"issues":[],"action":"keep","note":"","steps":[],"preview":"","truncated":false,"redacted":true,"severity":""},{"id":346,"title":"Bài tập Python cơ bản: tính tổng tất cả các ước số nguyên dương khác n của n","type":12,"typeName":"Bài code","metrics":{"words":143,"chars":534,"images":0,"duration":25},"issues":[],"action":"keep","note":"","steps":[],"preview":"","truncated":false,"redacted":true,"severity":""},{"id":347,"title":"Bài tập Python cơ bản: kiểm tra một số có phải là abundant hay không","type":12,"typeName":"Bài code","metrics":{"words":169,"chars":660,"images":0,"duration":30},"issues":[],"action":"keep","note":"","steps":[],"preview":"","truncated":false,"redacted":true,"severity":""},{"id":null,"title":"Dự án nhỏ: Máy tính điểm trung bình lớp học","type":null,"typeName":"Bài code","metrics":{"words":0,"chars":0,"images":0,"duration":0},"preview":"","issues":[],"action":"add","severity":"","note":"Cả khóa không có bài nào mang tính sản phẩm (engagement 4/10); một mini-project nhập danh sách điểm, dùng list + hàm + vòng lặp + if để in bảng xếp loại sẽ chốt được toàn bộ kiến thức bằng ngữ cảnh học đường gần gũi học sinh.","steps":["Soạn đề: nhập n học sinh (tên + điểm), in điểm trung bình, điểm cao nhất/thấp nhất và xếp loại từng em.","Viết 5–6 test case.","Dùng tên học sinh trung tính/Philippines ngay từ bản gốc."],"kind":"activity"},{"id":null,"title":"Quiz tổng kết khóa Python cơ bản","type":null,"typeName":"Kiểm tra","metrics":{"words":0,"chars":0,"images":0,"duration":0},"preview":"","issues":[],"action":"add","severity":"","note":"Khóa kết thúc ở bài số abundant (347) không có mốc tổng kết; cần một bài kiểm tra cuối để chốt hoàn thành.","steps":["Soạn 10–12 câu phủ vòng lặp, list, chuỗi, hàm.","Cấu hình đạt 70–80%."],"kind":"quiz"}]}],"count":59},{"title":"Làm quen với Python","action":"add","note":"Bước 1 tách chương: nhận 3 mục \"Chương trình đầu tiên và chú thích\" (289–294) + \"Kiểu dữ liệu, biến và ép kiểu\" (295–300) + \"Đầu vào\" (301–306) = 18 bài.","steps":["Tạo chương, chuyển 3 mục vào, giữ thứ tự bài."],"sections":[],"count":0},{"title":"Toán tử và rẽ nhánh","action":"add","note":"Nhận 2 mục \"Toán tử cơ bản\" (307–313) + \"Câu lệnh lựa chọn\" (314–318) = 12 bài.","steps":["Chuyển 2 mục vào chương, giữ thứ tự."],"sections":[],"count":0},{"title":"Vòng lặp, list và chuỗi","action":"add","note":"Nhận 3 mục \"Vòng lặp\" (319–324) + \"Mảng và liệt kê\" (325–329) + \"Chuỗi\" (330–333) = 15 bài.","steps":["Chuyển 3 mục vào chương, giữ thứ tự."],"sections":[],"count":0},{"title":"Hàm và luyện tập tổng hợp","action":"add","note":"Nhận 3 mục \"Hàm Python\" (334–338) + \"Bài luyện tập I\" (339–342) + \"Bài luyện tập II\" (343–347) = 14 bài.","steps":["Chuyển 3 mục vào chương, giữ thứ tự."],"sections":[],"count":0}]},{"key":"alt-algo","label":"Thuật toán căn bản","group":"Ứng viên mở rộng","source":"thuat-toan-can-ban","isNew":false,"reviewed":true,"title":"Thuật toán căn bản","summary":{"structure":"**1 chương duy nhất chứa toàn bộ 56 bài** — vi phạm trực tiếp nguyên tắc trong BRIEF (khóa 1–2 chương cho 45–82 bài là không dùng được). Bên trong chia 9 mục theo dạng bài: Số học (9), Xử lý xâu (9), Đếm (8), Ma trận (7), Hình học (4), Dãy số (6), Đồ thị (3), Sắp xếp (5), Tìm kiếm (5) — đã kiểm đếm khớp 56. Mục lệch nhau tới 3 lần (9 bài vs 3 bài): Hình học và Đồ thị quá mỏng. **100% là Bài code, không có một bài Lý thuyết, Video hay quiz nào** — học sinh bị ném thẳng vào đề thi; lý thuyết duy nhất là các đoạn 'Theory' nhúng trong 4 bài (114, 119, 120, 122). Thứ tự trong mục không theo độ khó tăng dần: mục Số học mở đầu khóa nhưng chứa `numberZeroDigits` (n ≤ 10^12, cần công thức Legendre — mức thi HSG) và `lastDigitDiffZero` (n ≤ 10^6), trong khi mục Sắp xếp/Tìm kiếm dễ tiếp cận hơn lại nằm cuối. Bài đầu tiên (`isPrime`, id 68) còn kiêm luôn phần giới thiệu nền tảng genCode bằng C++ — nội dung hạ tầng trộn vào đề bài. **Đề xuất tách 4 chương** theo dạng dữ liệu, độ khó tăng dần: C1 'Số và xâu' (Số học + Xử lý xâu, 18 bài), C2 'Đếm và dãy số' (Đếm + Dãy số, 14 bài), C3 'Ma trận và hình học' (Ma trận + Hình học, 11 bài), C4 'Sắp xếp, tìm kiếm và đồ thị' (Sắp xếp + Tìm kiếm + Đồ thị, 13 bài) — chi tiết trong `additions`.","content":"Bản chất là **bộ đề luyện tập kiểu CodeSignal**, không phải khóa học dạy thuật toán. Điểm mạnh: 56/56 bài code có ví dụ + ràng buộc + giới hạn thời gian, mỗi bài 3–13 test case, **51/56 bài đã viết sẵn bằng tiếng Anh** — lợi thế bản địa hóa độc nhất trong các ứng viên. Điểm yếu chí mạng: (1) **Không dạy trước khi hỏi** — 48/56 bài không có lý thuyết lẫn lời giải mẫu; DFS/BFS bị đem ra hỏi (id 112, 113) mà chưa từng được dạy ở bài nào. (2) **Lỗi mất định dạng lũy thừa cùng loại với `python-for-beginners`**: ít nhất 7 bài ghi '10 5', '5 · 10 4', '4 · 10 8', 'O(n 2)' thay vì 10^5, 10^4, 10^8, O(n²) (id 79, 88, 91, 107, 108, 114, 117). (3) **3 bài gọi sai tên hàm trong ví dụ**: `sudoku2` vs `sudokuChecking` (99), `dfsComponentSize` vs `componentSize` (112), `searchElement02` vs `searchElement2` (120). (4) **Code mẫu bài 119 có bug thật**: vòng lặp `for (int i = a.size()-1; ...) if (a[i] != a[i+1])` truy cập ngoài mảng ngay lần lặp đầu. (5) `primeSum` (75) cho ràng buộc -10^7 < n nhưng đề chỉ có nghĩa với n ≥ 2 — đề tự mâu thuẫn. (6) **5 bài cuối (mục Tìm kiếm, id 119–123) hoàn toàn bằng tiếng Việt**, 2 bài dùng nhân vật 'anh Việt Ducky' — số liệu đo sẵn 'cần bản địa hóa 1/56' là SAI, thực tế 5/56 + 1 bài lẫn câu tiếng Việt (118). (7) Ảnh dồn hết vào 3 mục: Ma trận 12, Hình học 6, Đồ thị 3; **Sắp xếp 0 ảnh** (bubble/merge sort dạy chay bằng chữ dán phẳng một đoạn), Số học/Xử lý xâu/Đếm/Dãy số/Tìm kiếm 0 ảnh; ngay trong Ma trận thì 12 ảnh đều ở 4 bài cờ vua, còn spiralNumbers/sudokuChecking/findPath 0 ảnh. (8) Không có 2 bài trùng đề, nhưng lý thuyết trùng lặp: 'mảng độc nhất' dạy 2 lần (119 bản O(n²), 120 bản O(nlogn) — có chủ ý, chấp nhận được), mảng cộng dồn dạy 2 lần (đề 107 + lý thuyết trong 122). (9) **Ngôn ngữ**: chấm 7 ngôn ngữ nhưng toàn bộ lý thuyết/code mẫu là C++ (1 bài Java), bài mở đầu giới thiệu genCode bằng C++ — KHÔNG khớp lộ trình Scratch → Python của bộ khóa; muốn dùng làm khóa nối phải viết thêm code mẫu Python.","verdict":"KHÔNG chen được vào top 3 khóa phụ: điểm trung bình ~5.1, dưới cả `phan-cung-may-tinh` (5.6) và kém xa hạng 3 hiện tại `ai-for-primary-students` (5.9); quan trọng hơn, khóa 100% bài code đòi biết sẵn một ngôn ngữ lập trình nên **phá vỡ yêu cầu gốc 'khóa phụ không phân biệt cấp lớp'** — không sửa nội dung nào bù được điều đó, nên không thay khóa nào cả. Về công sức thì bản địa hóa rẻ (51/56 bài sẵn tiếng Anh) nhưng tổng công không rẻ: dịch 5 bài, sửa ~20 bài lỗi biên tập, tách 4 chương, soạn thêm 3 bài lý thuyết + 4 quiz + code mẫu Python. Đề xuất dùng đúng chỗ: khóa tự chọn nối sau `python-for-beginners` (lớp 6–9 khá) hoặc bổ trợ lớp 10–12 — vai trò đó thì đây là ứng viên tốt vì kho 56 bài luyện tập chất lượng, tiếng Anh sẵn.","fit":"**Dùng cho học sinh Philippines được ở vai trò hẹp, không dùng làm khóa phụ đại trà.** Thuận lợi: (1) 51/56 bài đã bằng tiếng Anh — khớp luôn ngôn ngữ giảng dạy chính của PH, chi phí dịch gần bằng 0 trừ 5 bài mục Tìm kiếm; (2) bối cảnh đề trung tính hoặc quốc tế (cờ vua, Sudoku, mật khẩu, pangram) — chỉ 2 bài dính tên riêng Việt Nam ('anh Việt Ducky', id 119, 121) cần đổi tên trung tính; (3) dạng bài competitive khớp văn hóa các cuộc thi ICT/programming phổ biến ở trường PH. Rào cản: (1) **đòi biết trước lập trình** (hàm, mảng, xâu, vòng lặp) — học sinh chưa qua khóa Python không làm nổi bài nào, trái yêu cầu 'mọi cấp lớp học được'; (2) độ khó thực tế khớp Grade 8–12 đã học lập trình; mục Đồ thị (DFS/BFS) và các bài numberZeroDigits, lastDigitDiffZero, longestSequence, differentSubstringsTrie vượt chuẩn K-12 đại trà, chỉ hợp học sinh giỏi/câu lạc bộ; (3) 100% bài phải gõ code — bất lợi lớn với học sinh PH dùng điện thoại thay máy tính, không có phương án học chay nào (không video, không lý thuyết đọc được); (4) code mẫu C++ lệch khỏi lộ trình Scratch → Python của bộ khóa. Việc phải làm nếu dùng: dịch 5 bài cuối, đổi 2 tên nhân vật, sửa lỗi định dạng lũy thừa, bổ sung code mẫu Python, và định vị lại là khóa nối sau Python thay vì khóa phụ tự do."},"scores":{"engagement":{"score":5,"note":"Đề có chất chơi (4 bài cờ vua, Sudoku, xoắn ốc, xếp wifi) hấp dẫn học sinh mê giải đố, nhưng 56/56 bài là drill chấm test case khô, không dự án, không sản phẩm, không video — học sinh đại trà rơi rụng ngay mục Số học vì numberZeroDigits."},"coverage":{"score":6,"note":"9 mục phủ khá đủ các dạng thuật toán nhập môn (số học, xâu, đếm, ma trận, hình học, dãy, sắp xếp, tìm kiếm, chớm đồ thị), nhưng là bộ đề chứ không dạy: 48/56 bài không lý thuyết, mục 'Tìm kiếm' không hề dạy binary search, Đồ thị chỉ 3 bài chiếu lệ, thiếu hẳn đệ quy và Big-O nhập môn."},"clarity":{"score":4,"note":"Đề gốc CodeSignal vốn rõ (ví dụ + ràng buộc + time limit), nhưng ≥7 bài mất định dạng lũy thừa ('10 5', 'O(n 2)'), code và ma trận trong đề dán phẳng thành một dòng (bài 114 dài 519 chữ không xuống dòng), 6/9 mục không có lấy một tấm ảnh, 48/56 bài không có lời giải mẫu."},"practice":{"score":8,"note":"Điểm mạnh nhất: 56/56 bài code, mỗi bài 3–13 test case, chấm tự động 7 ngôn ngữ, phân bổ đủ 9 dạng bài — đúng chất kho luyện tập; trừ điểm vì độ dốc khó không kiểm soát (bài mức thi HSG nằm ngay mục mở đầu) và không có gợi ý theo bậc."},"structure":{"score":3,"note":"1 chương cho 56 bài — lỗi cấu trúc nặng nhất theo BRIEF; mục lệch 9 bài vs 3 bài, thứ tự không theo độ khó (Đồ thị kẹp giữa Dãy số và Sắp xếp), bài giới thiệu nền tảng genCode trộn vào đề isPrime đầu khóa."},"fit":{"score":5,"note":"51/56 bài sẵn tiếng Anh và bối cảnh trung tính là lợi thế lớn nhất trong mọi ứng viên đã review, nhưng khóa đòi biết lập trình trước nên phá yêu cầu 'không phân biệt cấp lớp', độ khó chỉ khớp Grade 8–12 đã học code, và 100% gõ code gây khó cho học sinh PH dùng điện thoại."},"accuracy":{"score":5,"note":"Kiến thức thuật toán trong đề đúng, nhưng lỗi biên tập dày: code mẫu bài 119 truy cập ngoài mảng (a[i+1] tại i = size-1), 3 bài gọi sai tên hàm trong ví dụ (sudoku2, dfsComponentSize, searchElement02), primeSum cho phép n âm mâu thuẫn đề, ≥7 bài mất định dạng lũy thừa — cùng họ lỗi định dạng với python-for-beginners."}},"isDesign":false,"candidateFor":"Cân nhắc thay một khóa phụ","stats":{"chapters":4,"sections":12,"activities":64,"keep":30,"edit":26,"delete":0,"add":8,"high":5,"med":9},"chapters":[{"title":"Thuật toán căn bản","action":"edit","note":"1 chương ôm 56 bài — học sinh không thấy lộ trình, không có mốc nghỉ. Tách thành 4 chương theo dạng dữ liệu và độ khó tăng dần: chương này thu lại thành 'Số và xâu' giữ 2 mục Số học (id 68–76) + Xử lý xâu (id 77–85) = 18 bài; 3 chương mới nhận 7 mục còn lại (xem `additions`). Logic tách: C1 số/xâu là nền, C2 đếm/dãy luyện mảng, C3 ma trận/hình học cần tư duy 2D, C4 sắp xếp/tìm kiếm/đồ thị là thuật toán có tên tuổi — Đồ thị xếp cuối cùng vì khó nhất.","steps":[],"sections":[{"title":"Số học","action":"edit","note":"Mục mở đầu khóa nhưng độ dốc gãy: numberZeroDigits (id 76, n ≤ 10^12 — cần công thức Legendre) và lastDigitDiffZero (id 72, n ≤ 10^6) là mức thi HSG nằm cạnh isPrime nhập môn; 9 bài 0 ảnh. Sắp lại thứ tự bài theo độ khó, đẩy 72 và 76 xuống cuối mục.","steps":[],"activities":[{"id":68,"title":"isPrime","type":12,"typeName":"Bài code","metrics":{"words":299,"chars":1577,"images":0,"duration":35},"issues":[],"action":"edit","note":"Đề isPrime bị trộn ~200 chữ giới thiệu nền tảng genCode (viết bằng C++) vào trước nhiệm vụ chính; ràng buộc '0 ≤ n ≤ 1000' mâu thuẫn đề 'a given positive integer' (n = 0 không phải số nguyên dương).","steps":["Tách toàn bộ phần giới thiệu genCode thành bài Lý thuyết riêng đứng đầu khóa (đã khai ở additions)","Sửa ràng buộc thành '2 ≤ n ≤ 1000' hoặc ghi rõ trả về false với n = 0, 1","Đổi ví dụ minh họa genCode từ C++ sang Python cho khớp lộ trình Scratch → Python"],"preview":"","truncated":false,"redacted":true,"severity":"high"},{"id":69,"title":"factorSum","type":12,"typeName":"Bài code","metrics":{"words":154,"chars":742,"images":0,"duration":35},"issues": 5 mục đầu đều theo khuôn **Video → Lý thuyết → Quiz**, mục 6 thêm Tài liệu thực hành, mục 7 là kiểm tra cuối khóa (20 câu) + bài tập nộp — học sinh nhỏ dễ theo. 7 quiz phân bố đều (mỗi mục 1 quiz). Thứ tự nội dung hợp lý: AI là gì → AI quanh ta → AI nhìn → AI nghe → giao tiếp với AI → AI học → dự án. Cần **tách thành 3 chương** theo ranh giới tự nhiên (xem `additions`): (1) Làm quen với AI = 2 mục đầu; (2) AI cảm nhận thế giới = 3 mục nhìn/nghe/giao tiếp; (3) AI học và dự án cuối khóa = 2 mục cuối.","content":"Đã kiểm chứng nghi vấn **0 ảnh**: đúng là cả 6 bài lý thuyết đều **không có một hình minh họa nào** — bài chỉ dùng emoji (🐱🚗🤖) làm 'hình giả'. Hình thật có thể nằm trong 6 video (dump không crawl được nội dung video nên không kiểm chứng được). Bài lý thuyết viết theo lối kể chuyện (bé Nam, Minh, Vy, Linh, An) 267–352 chữ/bài, giọng văn đúng lứa tuổi tiểu học, ví dụ đời thường tốt (robot hút bụi, loa thông minh, YouTube). Với trẻ tiểu học, bài chữ không hình vẫn **tạm dùng được** nhờ kể chuyện + emoji, nhưng dưới chuẩn — mỗi bài cần thêm 2–3 hình. Ngoại lệ lệch hẳn: bài 8829 dài 846 chữ (gấp 2,5 lần các bài khác), viết kiểu nghị luận cho học sinh lớn ('các bạn học sinh', khái niệm cá nhân hóa, bảo vệ dữ liệu), và khuyến khích trò chuyện với ChatGPT trong khi ChatGPT yêu cầu 13+ — phải viết lại. Nội dung AI **không lỗi thời**: chỉ nhắc ChatGPT, Siri, Google Assistant, Quick Draw!, Teachable Machine — đều còn hoạt động (2026). Thực hành mỏng: cả khóa chỉ 1 bài tập nộp (cuối khóa, đề rất rõ ràng, có 2 lựa chọn và hướng dẫn nộp cụ thể) + 1 tài liệu thực hành 12 chữ; 2 trải nghiệm Quick Draw / Teachable Machine chỉ là link trong bài video, không thu bài. Trùng lặp với `ai-level-1`: cùng dùng Quick Draw!, Teachable Machine, và **dự án cuối khóa 8501 trùng nguyên văn 100%** (225 chữ) với bài 9573 của `ai-level-1` — hai khóa là hai phiên bản lứa tuổi của cùng một nội dung, chỉ nên chọn một.","verdict":"NÊN DÙNG khóa này **thay `phan-mem-may-tinh` (4.3)**: điểm 5.9 so với 4.3, nội dung hiện đại không lỗi thời, gọn (21 bài), có quiz đều và dự án cuối khóa rõ ràng — sửa ở mức trung bình (tách 3 chương, thêm hình cho 6 bài lý thuyết, viết lại 1 bài lệch giọng). Điều kiện bắt buộc: bỏ chữ 'tiểu học' khỏi tên khóa vì vi phạm yêu cầu 'không phân biệt cấp lớp' — giọng kể chuyện hợp 6–11 tuổi, học sinh THPT sẽ thấy trẻ con, nên định vị lại thành 'AI cơ bản cho mọi lứa tuổi' và trung hòa bớt xưng hô 'bé/em'. Vì trùng nội dung ~70% với `ai-level-1`, chỉ chọn khóa này (bản đầy đủ hơn), không chọn cả hai.","fit":"**Dùng được cho học sinh Philippines sau khi sửa nhẹ.** (1) Công cụ đều miễn phí, chạy trên trình duyệt: Quick, Draw! chạy tốt trên điện thoại — hợp bối cảnh học sinh Philippines dùng điện thoại nhiều hơn máy tính; Teachable Machine cần webcam hoặc upload ảnh, làm được trên điện thoại nhưng cần bổ sung hướng dẫn riêng cho người chỉ có điện thoại. (2) Bản địa hóa: số đo 2/21 là **thiếu** — ví dụ 'Dịch tiếng Anh sang tiếng Việt' (bài 8488) phải đổi, và tên riêng Việt Nam (Nam, Minh, Vy, Linh, An) xuất hiện ở cả 5 bài kể chuyện, cần đổi sang tên Philippines/trung tính (sửa rất nhanh, chỉ thay tên). (3) Không có giả định hạ tầng nào chỉ đúng ở Việt Nam. (4) Độ khó khớp cấp tiểu học K-12 Philippines; nhưng yêu cầu gốc là 'không phân biệt cấp lớp' nên tên khóa và giọng văn phải trung hòa. (5) Lưu ý an toàn: bài 8829 khuyến khích dùng ChatGPT — với học sinh nhỏ phải thêm lưu ý dùng cùng phụ huynh/giáo viên (ChatGPT yêu cầu 13+)."},"scores":{"engagement":{"score":7,"note":"Lối kể chuyện có nhân vật ở cả 5 bài lý thuyết chính + 2 trò chơi trải nghiệm thật (Quick, Draw!, Teachable Machine) + dự án cuối khóa cho tự tay dạy AI — hấp dẫn đúng lứa tuổi nhỏ."},"coverage":{"score":6,"note":"Phủ đủ vòng cơ bản (AI là gì, nhận diện ảnh, giọng nói, chatbot, máy học từ ví dụ) nhưng thiếu hẳn một bài riêng về dùng AI an toàn/có trách nhiệm — chỉ được nhắc 2 câu trong bài 8829."},"clarity":{"score":5,"note":"Văn phong dễ hiểu, bài 267–352 chữ vừa sức, nhưng cả 6 bài lý thuyết đều 0 hình minh họa (chỉ emoji) — với tiểu học là thiếu nặng; bài 8829 dài 846 chữ lệch hẳn giọng."},"practice":{"score":5,"note":"Chỉ 1 bài tập nộp cho cả khóa (dồn cuối), 2 hoạt động Quick Draw/Teachable Machine không thu bài; bù lại 7 quiz phân bố đều mỗi mục."},"structure":{"score":5,"note":"1 chương cho 21 bài là lỗi phải sửa, nhưng 7 mục có nhịp Video→Lý thuyết→Quiz nhất quán và thứ tự hợp lý nên chỉ cần tách 3 chương, không phải xếp lại."},"fit":{"score":6,"note":"Công cụ miễn phí chạy được trên điện thoại, chỉ ~6 bài cần thay tên riêng/ví dụ Việt Nam; trừ điểm vì tên khóa 'cho học sinh tiểu học' vi phạm yêu cầu không phân biệt cấp lớp."},"accuracy":{"score":7,"note":"Kiến thức AI đơn giản hóa nhưng đúng (học từ nhiều ví dụ, nghe qua micro), không nhắc công cụ đã chết; lỗi duy nhất đáng kể là 8829 khuyến khích trẻ tiểu học dùng ChatGPT mà không nói giới hạn tuổi 13+."}},"isDesign":false,"candidateFor":"Cân nhắc thay một khóa phụ","stats":{"chapters":3,"sections":8,"activities":22,"keep":12,"edit":9,"delete":0,"add":1,"high":1,"med":6},"chapters":[{"title":"AI cho học sinh tiểu học","action":"edit","note":"21 bài / 7 mục dồn trong 1 chương — không có mốc nghỉ, không thấy lộ trình. Đổi tên thành 'Làm quen với AI' và chỉ giữ 2 mục đầu ('AI là gì vậy?', 'AI có ở khắp nơi'); 5 mục còn lại chuyển sang 2 chương mới (xem additions).","steps":[],"sections":[{"title":"AI là gì vậy?","action":"keep","note":"Nhịp Video→Lý thuyết→Quiz chuẩn, ở lại chương 1.","steps":[],"activities":[{"id":8486,"title":"AI là gì?","type":3,"typeName":"Video","metrics":{"words":0,"chars":0,"images":0,"duration":5},"issues":[],"action":"keep","note":"","steps":[],"preview":"","truncated":false,"redacted":false,"severity":""},{"id":8484,"title":"AI - Bộ não của máy","type":1,"typeName":"Lý thuyết","metrics":{"words":267,"chars":1124,"images":0,"duration":10},"issues":[{"level":"med","text":"Bài lý thuyết dài nhưng **không có hình minh họa nào**."}],"action":"edit","note"
