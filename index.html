bài lý thuyết (bài đọc) nào** — 12 video + 6 bài tập nộp + 7 quiz — học sinh không có gì để đọc lại/ôn tập ngoài video.","content":"**Đã kiểm chứng nghi vấn 812 chữ: con số chính xác tuyệt đối** (cộng tay: 24+253+8+267+225 chữ đề bài + 7 quiz stub ×5 chữ = 812). Kết luận thẳng: khóa **không hẳn là khung rỗng toàn phần**, vì trục nội dung là 12 video — nhưng dump không crawl được nội dung video nên **không kiểm chứng được video có thật và chất lượng ra sao**; còn **lớp văn bản thì gần rỗng thật**: 0 bài lý thuyết, và 3/6 bài tập nộp không có đề bài đúng nghĩa — 9574 **0 chữ** (bài tập nộp không có đề), 9567 chỉ 8 chữ lặp lại tiêu đề, 9566 chỉ 24 chữ. Chỉ 2 đề bài đạt chuẩn (9549 Quick Draw 253 chữ, 9557 Teachable Machine 267 chữ — cả hai viết rất tốt, có mục tiêu/các bước/yêu cầu nộp). 3 quiz cấu hình chỉ **1 câu, đạt 100%** (9564, 9565, 9570) — không đo được gì. Nội dung không lỗi thời ở phần chữ (Quick Draw, Teachable Machine còn sống; Animated Drawings của Meta cần kiểm tra lại vì là bản demo). **Trùng lặp nặng với `ai-for-primary-students`**: cùng Quick, Draw!, cùng Teachable Machine, và bài thực hành cuối khóa 9573 **trùng nguyên văn 100%** (225 chữ) với bài 8501 của khóa kia — đây đúng là bản 'cho lứa lớn hơn' của cùng một nội dung, ~70% hoạt động trùng nhau.","verdict":"**KHÔNG thay được khóa nào ở trạng thái hiện tại.** Lý do quyết định: phần kiểm chứng được của khóa là một khung xương — 0 bài lý thuyết, 812 chữ cho 25 bài, 3/6 đề bài thực hành rỗng hoặc 1 dòng, 3 quiz chỉ 1 câu; toàn bộ giá trị phụ thuộc vào 12 video chưa kiểm chứng được. Chủ đề hay đến đâu cũng không cứu được việc không có nội dung đọc được. Thêm nữa, khóa trùng ~70% hoạt động và trùng nguyên văn dự án cuối khóa với `ai-for-primary-students` — nếu đã lấy khóa kia (khuyến nghị của tôi) thì khóa này thừa. Chỉ xem xét lại nếu (a) kiểm tra 12 video thấy chất lượng tốt VÀ (b) soạn bổ sung lớp bài đọc + đề bài — khi đó cũng chỉ dùng làm nguồn mượn bài (đề 9549, 9557 rất tốt, đáng lấy sang khóa AI kia).","fit":"**Chưa dùng được cho học sinh Philippines, không phải vì rào cản văn hóa mà vì thiếu nội dung.** Điểm cộng: phần chữ hiện có hoàn toàn trung tính — số đo 0/25 bài cần bản địa hóa là **đúng** (đã kiểm chứng: không có tên riêng, địa danh, dịch vụ Việt Nam nào trong văn bản); công cụ (Quick Draw, Teachable Machine, Animated Drawings) miễn phí, chạy trình duyệt. Điểm trừ quyết định: (1) 12 video chiếm toàn bộ phần giảng chắc chắn nói **tiếng Việt** — với khóa này không thể 'giữ video, dịch phụ đề' kiểu vá víu vì video là 100% nội dung giảng, nghĩa là phải làm lại/lồng tiếng toàn bộ 12 video sang tiếng Anh — chi phí lớn hơn hẳn hai khóa kia; (2) học sinh dùng điện thoại làm được Quick Draw nhưng Teachable Machine và nộp file cần hướng dẫn thêm; (3) không có bài đọc nên học sinh mạng yếu (phổ biến ở Philippines) không xem nổi video là mất trắng bài học."},"scores":{"engagement":{"score":5,"note":"6 bài thực hành trải nghiệm (vẽ robot, Quick Draw, làm bánh, Teachable Machine, Animated Drawings) là bộ hoạt động hấp dẫn trên giấy, nhưng phần dẫn dắt nằm trọn trong 12 video chưa kiểm chứng được."},"coverage":{"score":5,"note":"Danh mục chủ đề hợp lý (cảm biến, thuật toán, huấn luyện AI, dữ liệu sai → đoán sai, AI sáng tạo) nhưng chỉ tồn tại ở mức tiêu đề video — không có bài đọc nào xác nhận độ sâu."},"clarity":{"score":2,"note":"0 bài lý thuyết cho cả khóa; 3/6 đề bài thực hành rỗng hoặc 1 dòng (9574: 0 chữ; 9567: 8 chữ; 9566: 24 chữ) — học sinh tự học không biết phải làm gì."},"practice":{"score":5,"note":"Mật độ thực hành cao nhất nhóm (6 bài tập nộp/25 bài, rải đều 2 chương đầu) và 2 đề mẫu mực (9549, 9557), nhưng nửa còn lại chưa có đề nên chưa chấm được cao hơn."},"structure":{"score":6,"note":"3 chương 10–13–2 là khung tốt duy nhất trong nhóm; trừ điểm vì chủ đề 'sáng tạo' tách đôi giữa chương 1 và 2, và mục 'AI và nghệ thuật sáng tạo' không có quiz chốt."},"fit":{"score":4,"note":"Văn bản trung tính 0 bài cần bản địa hóa, nhưng 100% phần giảng là video  động, phân biệt tác phẩm người vs AI"],"kind":"quiz"}]}],"count":13},{"title":"Dự án cuối khóa","action":"edit","note":"Chỉ 2 bài, chấp nhận được cho chương kết; nhưng đề dự án 9573 trùng nguyên văn 100% với bài 8501 của ai-for-primary-students — phải làm đề khác nếu hai khóa cùng tồn tại.","steps":[],"sections":[{"title":"Dự án cuối khóa","action":"edit","note":"Đề 9573 trùng nguyên văn với khóa ai-for-primary-students, và lựa chọn 2 (Scratch + Video Sensing) giả định học sinh đã biết Scratch — khóa không dạy.","steps":[],"activities":[{"id":9572,"title":"Bài kiểm tra cuối khóa","type":8,"typeName":"Kiểm tra","metrics":{"words":5,"chars":22,"images":0,"duration":30},"issues":[{"level":"med","text":"Bài quá sơ sài: chỉ 5 chữ (các bài cùng loại 300–600 chữ)."}],"action":"keep","note":"","steps":[],"preview":"","truncated":false,"redacted":true,"severity":""},{"id":9573,"title":"Bài thực hành cuối khóa","type":7,"typeName":"Bài tập nộp","metrics":{"words":225,"chars":1016,"images":0,"duration":120},"issues":[],"action":"edit","note":"Đề trùng nguyên văn 100% (225 chữ) với bài 8501 của khóa ai-for-primary-students; lựa chọn 2 yêu cầu Scratch + Extension Video Sensing mà khóa không dạy Scratch buổi nào.","steps":["Nếu cả hai khóa AI cùng phát hành: viết đề khác cho một trong hai (vd: huấn luyện Teachable Machine phân loại 3 lớp thay vì 2)","Bỏ hoặc chú thích lựa chọn Scratch: 'dành cho bạn đã học Scratch', kèm link bài hướng dẫn Video Sensing"],"preview":"","truncated":false,"redacted":true,"severity":"med"}]}],"count":2}]},{"key":"alt-cyber1","label":"CyberSecurity Level 1","group":"Ứng viên mở rộng","source":"cybersecurity-level-1","isNew":false,"reviewed":true,"title":"CyberSecurity Level 1","summary":{"structure":"23 bài / **1 chương duy nhất** / 6 mục — lỗi số chương phải sửa. Bù lại, 6 mục có nhịp rất đều: mỗi mục chủ đề mở bằng Video, tiếp 2–3 bài Lý thuyết, chốt bằng quiz 10 câu; mục Tổng kết có tài liệu + quiz ôn tập 15 câu. Thứ tự hợp lý: làm quen Internet → duyệt web an toàn → liên kết nguy hiểm → app/game an toàn → thông tin cá nhân → tổng kết. Cần **tách thành 3 chương** theo ranh giới tự nhiên (xem additions): (1) Làm quen với Internet = mục 1; (2) An toàn khi duyệt web và giải trí = mục 2+3+4; (3) Bảo vệ bản thân trên mạng = mục 5 + 2 mục mới (mật khẩu, mạng xã hội) + Tổng kết. Điểm hỏng cấu hình: **cả 6 quiz đều ghi '0 lượt thi'** (các khóa AI cùng hệ ghi 10 lượt) — nếu 0 nghĩa là không được thi thì toàn bộ kiểm tra của khóa tê liệt, phải xác minh với đội kỹ thuật.","content":"Kiểm chứng số liệu: đúng 23 ảnh, nhưng phân bố lệch — dồn vào 6 bài đầu (9320: 7 ảnh, 9321: 5, 9326: 4, 9325: 3, 9322: 2), còn 4 bài lý thuyết cuối (9330, 9334, 9337, 9338) **0 ảnh**. Số đo '2/23 bài cần bản địa hóa' là **thiếu**: đọc thật thấy **5 bài** chứa tham chiếu Việt Nam (9321 'Truyện cổ tích Việt Nam'; 9322 VioEdu, Zing MP3; 9326 vnexpress.net, moet.gov.vn; 9329 mona.media, codelearn.io; 9330 vnedu.vn, kidsonline.edu.vn) — đều sửa nhanh vì chỉ là ví dụ. Chất lượng bài: ngắn (75–281 chữ) nhưng đúng trọng tâm, dùng tình huống kể chuyện (Nam, Lan, Na, An) sát đời thật — quảng cáo 'trúng thưởng', pop-up giả cảnh báo virus, nút download giả, người lạ nhắn tin hỏi trường lớp — đây là những mối nguy có thật và không lỗi thời. **Hai lỗi kiến thức phải sửa ở 9326**: dạy 'chỉ tin trang có tên miền quen thuộc như .com, .org' (trang lừa đảo cũng dùng .com — dấu hiệu này phản tác dụng) và 'có ổ khóa thì an toàn hơn' không kèm chú thích (HTTPS chỉ mã hóa đường truyền, trang lừa đảo vẫn có ổ khóa). Lỗ hổng nội dung so với cái tên 'CyberSecurity': **không có bài nào về mật khẩu mạnh** (mật khẩu chỉ được nhắc 1 dòng trong 9337), **không có bài nào về an toàn mạng xã hội / bắt nạt mạng** — thiếu chí mạng với thị trường Philippines. Thực hành: **0 bài tập nộp cho cả khóa**, học sinh chỉ đọc và làm quiz. Bài 9341 [Tài liệu] chỉ có 2 chữ 'Tài liệu' — placeholder rỗng.","verdict":"NÊN DÙNG khóa này **thay `computer-communication-network` (4.7)**: điểm 5.4 so với 4.7, và quan trọng hơn điểm số — chủ đề an toàn Internet có giá trị thực dụng vượt trội cho học sinh Philippines so với lý thuyết mạng máy tính (khóa cũ còn hỏng metadata 999999999 phút ở cả 55 bài). Mức sửa trung bình: tách 3 chương, sửa 2 lỗi kiến thức ở 9326, thay ví dụ Việt Nam ở 5 bài, soạn tài liệu tổng kết đang rỗng, xác minh cấu hình '0 lượt thi' của 6 quiz. Để xứng với cái tên CyberSecurity thì phải bổ sung 2 mục (mật khẩu, an toàn mạng xã hội) và ít nhất 1 bài thực hành — nếu không bổ sung, khóa vẫn dùng được nhưng nên đổi tên thành 'Internet Safety Basics' cho trung thực.","fit":"**Rất đáng dùng cho học sinh Philippines — chủ đề trúng nhu cầu nhất trong cả nhóm ứng viên.** (1) Philippines nhiều năm đứng đầu thế giới về thời gian dùng mạng xã hội, trẻ em lên mạng chủ yếu bằng điện thoại — nội dung nhận diện quảng cáo lừa, link giả, không chia sẻ thông tin cá nhân, người lạ trên mạng là kỹ năng sống sát sườn, giá trị hơn hẳn khóa mạng máy tính lý thuyết đang dùng. (2) Toàn bộ bài học không cần thiết bị gì ngoài chính chiếc điện thoại — không rào cản hạ tầng. (3) Nghịch lý cần vá: nước dùng mạng xã hội số 1 thế giới mà khóa lại **không có bài nào về mạng xã hội và bắt nạt mạng** — phải thêm mục này mới trọn giá trị (xem additions). (4) Bản địa hóa nhẹ: 5 bài thay ví dụ app/trang web Việt Nam bằng app phổ biến ở Philippines (thay VioEdu → Khan Academy, Zing MP3 → Spotify, vnexpress → gmanetwork/deped.gov.ph...). (5) Giọng văn nhắm trẻ nhỏ ('bé Na', Nam 7 tuổi) — với yêu cầu 'không phân biệt cấp lớp' thì học sinh THPT sẽ thấy hơi trẻ con, nhưng chủ đề an toàn mạng vốn phổ quát nên chấp nhận được nếu trung hòa bớt xưng hô khi dịch sang tiếng Anh."},"scores":{"engagement":{"score":6,"note":"Tình huống kể chuyện đời thật (Lan gặp quảng cáo trúng thưởng, An bị người lạ nhắn tin) dễ cuốn trẻ nhỏ, mỗi mục có video mở đầu; nhưng không có trò chơi/hoạt động tương tác nào — học sinh chỉ đọc và làm quiz."},"coverage":{"score":4,"note":"Mang tên CyberSecurity nhưng thiếu hẳn mật khẩu mạnh (chỉ 1 dòng nhắc trong 9337), an toàn mạng xã hội và bắt nạt mạng — với nước dùng mạng xã hội số 1 thế giới đây là lỗ hổng chí mạng; phần duyệt web + riêng tư hiện có thì phủ tốt."},"clarity":{"score":7,"note":"Bài ngắn 75–281 chữ đúng sức trẻ nhỏ, có 23 ảnh minh họa thật (khác hẳn 2 khóa AI 0 ảnh), cấu trúc bài Giới thiệu → Nội dung → Ghi nhớ đều tăm tắp; trừ điểm vì 4 bài cuối (9330, 9334, 9337, 9338) không có ảnh."},"practice":{"score":3,"note":"0 bài tập nộp trên 23 bài — cả khóa không có hoạt động thực hành nào, chỉ 6 quiz; kỹ năng như 'nhận diện link giả' hoàn toàn có thể thực hành được mà không được thực hành."},"structure":{"score":5,"note":"1 chương cho 23 bài là lỗi phải sửa, nhưng 6 mục nhịp Video→Lý thuyết→Quiz rất đều và thứ tự hợp lý nên chỉ cần tách 3 chương, không phải xếp lại bài."},"fit":{"score":8,"note":"Chủ đề trúng nhu cầu Philippines nhất nhóm (nước top thế giới về dùng mạng xã hội), học được ngay trên điện thoại, chỉ 5 bài cần thay ví dụ Việt Nam — mức sửa bản địa hóa nhẹ nhất so với giá trị mang lại."},"accuracy":{"score":5,"note":"Đa số kiến thức đúng và không lỗi thời, nhưng 9326 dạy 2 mẹo sai lệch ('.com là tin được', 'có ổ khóa là an toàn hơn' không chú thích), bài tài liệu 9341 rỗng (2 chữ), và 6/6 quiz cấu hình '0 lượt thi' bất thường."}},"isDesign":false,"candidateFor":"Cân nhắc thay một khóa phụ","stats":{"chapters":3,"sections":8,"activities":24,"keep":8,"edit":15,"delete":0,"add":1,"high":2,"med":9},"chapters":[{"title":"Làm quen với thế giới Internet","action":"edit","note":"23 bài / 6 mục dồn trong 1 chương — không có mốc nghỉ. Giữ tên chương này nhưng chỉ giữ mục đầu ('Làm quen với thế giới Internet'); 5 mục còn lại chia về 2 chương mới (xem additions).","steps":[],"sections":[{"title":"Làm quen với thế giới Internet","action":"keep","note":"Mục nhập môn tốt (thiết bị → trình duyệt → phân biệt app học/chơi → quiz), ở lại chương 1; mục trùng tên với chương là chấp nhận được sau khi tách chương.","steps d":9338,"title":"Nói không với người lạ (Hiểu tại sao không nên chia sẻ thông tin với người lạ online)","type":1,"typeName":"Lý thuyết","metrics":{"words":143,"chars":629,"images":0,"duration":10},"issues":[{"level":"med","text":"Bài quá sơ sài: chỉ 143 chữ (các bài cùng loại 300–600 chữ)."}],"action":"edit","note":"Bài 0 ảnh — tình huống người lạ nhắn tin là bài quan trọng nhất mục nhưng không có minh họa.","steps":["Thêm 1 ảnh minh họa khung chat với tin nhắn người lạ và mũi tên chỉ 2 việc: không trả lời, báo người lớn"],"preview":"","truncated":false,"redacted":true,"severity":"low"},{"id":9339,"title":"Bài kiểm tra trắc nghiệm","type":8,"typeName":"Kiểm tra","metrics":{"words":5,"chars":24,"images":0,"duration":20},"issues":[{"level":"med","text":"Bài quá sơ sài: chỉ 5 chữ (các bài cùng loại 300–600 chữ)."}],"action":"edit","note":"Cùng lỗi cấu hình '0 lượt thi' như 9323.","steps":["Đặt về 10 lượt thi nếu xác minh 0 là lỗi"],"preview":"","truncated":false,"redacted":true,"severity":"med"}]},{"title":"An toàn trên mạng xã hội","action":"add","note":"Lỗ hổng chí mạng với thị trường đích: Philippines đứng đầu thế giới về thời gian dùng mạng xã hội mà khóa không có bài nào về chủ đề này. Mục thuộc chương mới 'Bảo vệ bản thân trên mạng', đặt sau mục 'Mật khẩu an toàn' (theo thứ tự mảng additions), trước Tổng kết.","steps":["Soạn 1 video 2–3' + 2 bài lý thuyết kể chuyện ~200 chữ/bài: (a) giới hạn tuổi 13+ của Facebook/TikTok và vì sao; đăng gì thì cả thế giới thấy, không đăng ảnh lộ trường lớp/địa chỉ; (b) bắt nạt trên mạng: nhận ra, không trả đũa, chặn và báo người lớn","Dùng tình huống bản địa Philippines (nhắn tin qua Messenger — ứng dụng phổ biến nhất tại đây)","Thêm quiz 10 câu, 20', đạt 80% theo đúng khuôn các mục khác"],"activities":[]},{"title":"Mật khẩu an toàn","action":"add","note":"Lỗ hổng coverage: khóa mang tên CyberSecurity mà không có bài nào về mật khẩu — mật khẩu chỉ được nhắc 1 dòng trong 9337. Mục thuộc chương mới 'Bảo vệ bản thân trên mạng', trước Tổng kết.","steps":["Soạn 1 video 2' + 1 bài lý thuyết ~200 chữ: mật khẩu mạnh là gì (dài, khó đoán, không dùng tên/ngày sinh), không dùng chung 1 mật khẩu, không cho bạn bè biết","Soạn 1 bài lý thuyết ~150 chữ dạng kể chuyện: chuyện bạn bị bạn cùng lớp đoán ra mật khẩu '123456'","Thêm quiz 10 câu, 20', đạt 80% theo đúng khuôn các mục khác"],"activities":[]},{"title":"Tổng kết","action":"edit","note":"Chuyển sang cuối chương mới 'Bảo vệ bản thân trên mạng'; bài tài liệu 9341 đang rỗng phải soạn lại (xem activityActions).","steps":[],"activities":[{"id":9341,"title":"Tài liệu","type":5,"typeName":"Tài liệu","metrics":{"words":2,"chars":8,"images":0,"duration":30},"issues":[],"action":"edit","note":"Bài [Tài liệu] của mục Tổng kết chỉ có đúng 2 chữ 'Tài liệu' — placeholder rỗng, mục tổng kết hiện không tổng kết gì.","steps":["Soạn tài liệu tổng kết 1 trang: checklist an toàn Internet (10 điều nhớ) gom từ 5 mục","Kèm bảng 'gặp tình huống X thì làm gì' (pop-up, người lạ nhắn tin, quảng cáo trúng thưởng)","Xuất PDF tải được về điện thoại"],"preview":"","truncated":false,"redacted":true,"severity":"high"},{"id":9342,"title":"Ôn tập lại kiến thức","type":8,"typeName":"Kiểm tra","metrics":{"words":5,"chars":20,"images":0,"duration":40},"issues":[{"level":"med","text":"Bài quá sơ sài: chỉ 5 chữ (các bài cùng loại 300–600 chữ)."}],"action":"edit","note":"Quiz ôn tập cuối khóa cũng cấu hình '0 lượt thi' — nếu 0 = không được thi thì học sinh không thể hoàn thành khóa.","steps":["Đặt về 10 lượt thi nếu xác minh 0 là lỗi"],"preview":"","truncated":false,"redacted":true,"severity":"med"}]}],"count":23},{"title":"An toàn khi duyệt web và giải trí","action":"add","note":"Tách chương: 1 chương/23 bài không có mốc nghỉ. Chương mới nhận 3 mục về mối nguy khi duyệt web và chơi game, tổng 12 bài.","steps":["Chuyển nguyên mục 'Duyệt web an toàn' (9328, 9325, 9326, 9327) sang chương này","Chuyển nguyên mục 'Liên kết nguy hiểm và cách phòng tránh' (9332, 9329, 9330, 9331) sang chương này","Chuyển nguyên mục 'Trò chơi và ứng dụng an toàn' (9336, 9333, 9334, 9335) sang chương này"],"sections":[],"count":0},{"title":"Bảo vệ bản thân trên mạng","action":"add","note":"Chương kết: thông tin cá nhân + 2 mục bổ sung (mật khẩu, mạng xã hội) + tổng kết.","steps":["Chuyển nguyên mục 'Thông tin cá nhân và sự riêng tư' (9340, 9337, 9338, 9339) sang chương này","Chuyển nguyên mục 'Tổng kết' (9341, 9342) sang chương này, đặt cuối cùng sau 2 mục mới"],"sections":[],"count":0}]},{"key":"alt-compess","label":"Computer Essential","group":"Ứng viên mở rộng","source":"computer-essential","isNew":false,"reviewed":true,"title":"Computer Essential","summary":{"structure":"Cấu trúc là điểm mạnh vượt trội so với ba khóa phụ đang chọn: **7 chương / 23 mục / 98 bài**, mỗi mục kết thúc bằng một quiz \"Knowledge Test\" (13 quiz mục + 1 Final Quiz 50 câu + 2 bài tự luận nộp + 1 tài liệu tổng kết) — trong khi `phan-cung-may-tinh`, `phan-mem-may-tinh`, `computer-communication-network` mỗi khóa nhét toàn bộ 45–82 bài vào **1 chương duy nhất**. Thứ tự chương hợp lý theo chuẩn ICDL: thiết bị → tệp/ứng dụng → mạng → thông tin trực tuyến → liên lạc trực tuyến → an toàn → tổng kết.\n\nHai điểm lệch: (1) chương \" Online Communication\" **30 bài (31% khóa)**, gấp gần 4 lần chương Networks — tuy đã chia 6 mục rõ ràng nhưng vẫn nên cân nhắc tách đôi thành \"Online Communication\" (Communication Tools + Sending/Receiving Email) và \"Email Management and Calendars\" (3 mục còn lại); (2) chương **Networks chỉ 8 bài**, 3 bài lý thuyết mục Network Concepts đều dưới 220 chữ — quá mỏng so với 55 bài của khóa Mạng cũ, thiếu hẳn IP/router/băng thông (đề xuất thêm 2 bài, xem `additions`).\n\nLưu ý kỹ thuật: tiêu đề chương 5 trong dữ liệu gốc có **dấu cách thừa ở đầu** (\" Online Communication\") — cần sửa khi nhập liệu.","content":"Nội dung **hoàn toàn bằng tiếng Anh**, biên soạn lại từ giáo trình ICDL \"Computer & Online Essentials\" (bằng chứng: ví dụ email `jdoe@icdl.org` còn sót trong bài 7317; tài liệu tổng kết 7355 mang tên \"COMPUTER & ONLINE ESSENTIALS\" trong khi khóa tên \"Computer Essential\"). Bài viết theo khuôn Concepts → Steps rất nhất quán, trung vị 279 chữ, không bài rỗng, 328 ảnh/98 bài (3,3 ảnh/bài — cao nhất các khóa đã xét). Chỉ **1/98 bài cần bản địa hóa** (7314 dùng ví dụ tìm kiếm \"Codelearn Edu\" và logo codelearn.io).\n\nĐiểm trừ có bằng chứng cụ thể:\n- **Lỗi biên tập nặng**: bài 7376 tiêu đề \"TAKING A SCREEN CAPTURE\" nhưng toàn bộ nội dung là *gỡ cài đặt ứng dụng*; bài 7348 chứa nguyên văn khối \"To create a new email…\" trùng 100% với bài 7349 đứng ngay sau; bài 7385 chứa nguyên văn **toàn bộ** bài 7386 \"USING THE JUNK FOLDER\"; bài 7310 lặp đoạn mở đầu 2 lần liên tiếp; typo \"Seclect the Prifile icon\" (7298), quiz \"Quizz-Network Access\" (7340) lệch quy ước đặt tên; bài 7334 ghi thời lượng 1 phút cho bài 309 chữ.\n- **Lỗi thời ở mức vừa phải** (nhẹ hơn hẳn ba khóa cũ): toàn bộ hướng dẫn thao tác trên **Windows 10** (7298 ghi rõ \"examples in the remainder of this book use the Microsoft Windows 10 operating system\" — Windows 10 hết hỗ trợ 10/2025); chương 5 dạy email trên **Outlook 2016**; **Internet Explorer** (ngừng 6/2022) vẫn được liệt kê là trình duyệt trong 7312 và 7330; **Skype** (ngừng 5/2025) trong 7318 và 7330; \"G Suite\" (đã đổi tên Google Workspace từ 2020) và Twitter trong 7330; \"Windows Defender Security Center\" (tên cũ, nay là Windows Security) trong 7325; UI Chrome cũ (nút Settings dưới ô tìm kiếm, mục Advanced cuối trang Settings, usage rights \"free to use or share\") trong 7315/7361/7362/7363; cài phần mềm từ CD/DVD được dạy trước tiên trong 7374. **Không có** đĩa mềm, PS/2, nhà mạng Việt Nam hay bộ gõ tiếng Việt như ba khóa cũ.\n- **Tiêu đề HOA toàn bộ** ở cả 74 bài lý thuyết (quiz lại đặt Title Case) — cần chuẩn hóa về Title Case toàn khóa khi nhập liệu, xử lý một lần ở mức khóa.\n- Không video, không bài code; thực hành chỉ nằm trong các khối Steps và 21 quiz.\n\nVề nghi vấn khóa chưa hoàn thiện (chỉ 6 học viên): không có bài rỗng, không tiêu đề tạm, đủ quiz mọi mục, có Final — khóa **hoàn chỉnh về cấu trúc**, ít học viên nhiều khả năng vì mới đưa lên; nhưng các lỗi 7376/7348/7385 cho thấy chưa qua vòng rà soát biên tập cuối.","verdict":"**Thay được, và nên thay.** (1) `computer-essential` thay trọn được `phan-mem-may-tinh` (4.3) và `computer-communication-network` (4.7): phần mềm và mạng ở mức người dùng được phủ tốt hơn, tiếng Anh sẵn, cấu trúc 7 chương chuẩn, không dính lỗi 999999999 phút hay bài bộ gõ tiếng Việt; riêng `phan-cung-may-tinh` (5.6) chỉ bị thay ở mức 'kiến thức phần cứng cho người dùng' — chiều sâu linh kiện (CPU/RAM-ROM/mainboard/nguồn/lắp ráp, 82 bài) thì 11 bài chương Computers and Devices không gánh nổi. (2) Mất gì: ~84 bài chiều sâu phần cứng + hạ tầng mạng (topology, IP/TCP-IP, DNS, thiết bị mạng — 55 bài Mạng cũ co còn 8 bài) và chi tiết phân loại/cài đặt phần mềm (45 bài co còn ~5 bài, bù lại có 20 bài quản lý tệp thực dụng hơn). (3) Được gì: 30 bài Online Communication (email, lịch, liên lạc trực tuyến) + 11 bài Safety (malware, bảo vệ dữ liệu, sức khỏe số, trợ năng, môi trường) + 15 bài Online Information — cả ba mảng này ba khóa cũ **hoàn toàn không có**; khối lượng bản địa hóa giảm từ 31 bài xuống 1 bài. (4) Khuyến nghị: **dùng `computer-essential` thay cả ba làm khóa phụ chủ lực, sửa nhẹ (~20 bài edit, 5 bài thêm)**; nếu bộ khóa bắt buộc đủ 3 suất phụ miễn phí thì giữ thêm `phan-cung-may-tinh` (sau khi tách chương + khử lỗi thời) làm khóa phụ thứ hai để bù chiều sâu phần cứng, và loại hẳn hai khóa còn lại. Mức sửa: **nhẹ** — chủ yếu cập nhật phiên bản phần mềm trong ảnh chụp màn hình và khử 4 lỗi biên tập.","fit":"**Dùng được gần như ngay — mức phù hợp cao nhất trong mọi khóa phụ đã xét.**\n- **Ngôn ngữ**: nội dung đã là tiếng Anh 100%, đúng ngôn ngữ giảng dạy chính của trường học Philippines — bỏ được toàn bộ chi phí dịch, trong khi ba khóa cũ phải dịch 182 bài từ tiếng Việt. Đây là lợi thế quyết định.\n- **Giáo trình gốc ICDL** là chuẩn quốc tế trung tính văn hóa: không có bất kỳ giả định nào chỉ đúng ở Việt Nam (không nhà mạng VN, không bộ gõ tiếng Việt, không tiền đồng/địa danh). Chỉ 1/98 bài (7314) cần thay ví dụ thương hiệu codelearn.io khi rebrand.\n- **Điều kiện thiết bị**: khóa không có video nên nhẹ băng thông — hợp với hạ tầng mạng trường học Philippines; hướng dẫn trên Windows 10 thực tế lại khớp với máy đời cũ phổ biến ở trường công PH (dù vẫn nên cập nhật dần lên Windows 11 vì Win10 hết hỗ trợ 10/2025). Điểm vênh duy nhất: học sinh PH dùng điện thoại nhiều hơn máy tính, mà khóa gần như chỉ dạy thao tác desktop.\n- **Độ khó và bối cảnh**: kiến thức vừa tầm senior high (lớp 9–12, khớp mạch ICT của chương trình K-12 DepEd); tuy nhiên văn phong nhắm **người đi làm văn phòng** (\"workplace\", \"colleagues\", họp Outlook, Out of Office, đặt phòng họp) — với học sinh nhỏ hơn sẽ khô và xa lạ. Nếu đối tượng là học sinh, nên thay các ví dụ Expo team/Quarterly Review bằng bối cảnh trường học (nộp bài cho giáo viên, lịch ôn thi) và bổ sung bài an toàn mạng xã hội/cyberbullying (đã đề xuất trong `additions`).\n- **Việc phải làm trước khi dùng**: khử tham chiếu Internet Explorer/Skype/G Suite, cập nhật ảnh chụp Outlook 2016 → Outlook mới hoặc Gmail (PH dùng Gmail áp đảo trong trường học), chuẩn hóa tiêu đề HOA, sửa 4 lỗi biên tập. Tổng cộng nhẹ hơn nhiều so với phương án ba khóa cũ (31 bài bản địa hóa + dịch toàn bộ + tách chương cho cả ba khóa)."},"scores":{"engagement":{"score":6,"note":"Bài ngắn (trung vị 279 chữ), 3,3 ảnh/bài, quiz kết mỗi mục giữ nhịp học tốt, nhưng không video, không dự án/trò chơi, văn phong văn phòng ICDL khô với học sinh — hấp dẫn hơn ba khóa cũ nhờ nhịp chương-mục-quiz chứ không nhờ nội dung."},"coverage":{"score":8,"note":"Phủ trọn phổ tin học nền tảng theo chuẩn ICDL (thiết bị, tệp, ứng dụng, mạng, web, email, an toàn, sức khỏe số, môi trường) — rộng hơn tổng ba khóa cũ về bề ngang; chỉ thiếu chiều sâu linh kiện phần cứng và hạ tầng mạng (IP/DNS/topology) mà 82+55 bài của hai khóa cũ có."},"clarity":{"score":7,"note":"Khuôn Concepts → Steps nhất quán ở cả 74 bài lý thuyết, không bài rỗng, ảnh minh họa dày; trừ điểm vì tiêu đề HOA toàn bộ khó đọc, một số câu bước bị đứt (\"Click the Power 3. Click Restart\" ở 7298) và typo lặt vặt."},"practice":{"score":5,"note":"21 quiz phân bổ đều (quiz kết 13/13 mục học + Final 50 câu) và 2 bài tự luận nộp là khung ổn, nhưng toàn khóa không có bài thực hành được chấm, không video, không bài code — thao tác chỉ nằm trong khối Steps để tự làm theo."},"structure":{"score":8,"note":"7 chương / 23 mục mạch lạc theo chuẩn ICDL, mỗi mục có quiz đóng mốc — đối lập hẳn với mô hình 1 chương của ba khóa cũ; trừ điểm vì chương \" Online Communication\" phình 30 bài (31% khóa) còn Networks chỉ 8 bài."},"fit":{"score":8,"note":"Tiếng Anh sẵn 100%, giáo trình ICDL trung tính văn hóa, chỉ 1/98 bài cần bản địa hóa (so với 31/182 của ba khóa cũ), không video nên nhẹ băng thông; trừ điểm vì bối cảnh người đi làm và chỉ dạy thao tác desktop trong khi học sinh PH dùng điện thoại nhiều hơn."},"accuracy":{"score":6,"note":"Kiến thức nền đúng và cập nhật khá (có USB-C/USB4, HDMI 2.1), nhưng có 1 bài sai tiêu đề-nội dung (7376), 2 cặp trùng nguyên văn (7348/7349, 7385/7386), đoạn lặp trong 7310, và các tham chiếu đã ngừng hỗ trợ: Internet Explorer, Skype, Outlook 2016, Windows Defender Security Center."}},"isDesign":false,"candidateFor":"Có thể thay CẢ BA khóa phụ","stats":{"chapters":7,"sections":23,"activities":104,"keep":77,"edit":21,"delete":0,"add":6,"high":4,"med":9},"chapters":[{"title":"Computers and Devices","action":"keep","note":"11 bài, 2 mục cân đối, mỗi mục có quiz; bài viết chất lượng đều (390–924 chữ, 1–17 ảnh); bài COMMON INPUT/OUTPUT PORTS thậm chí đã cập nhật USB-C/USB4, HDMI 2.1. Chỉ sửa cấp bài (7298, 7330).","steps":[],"sections":[{"title":"Hardware","action":"keep","note":"","steps":[],"activities":[{"id":7295,"title":"TYPES OF COMPUTERS AND DEVICES","type":1,"typeName":"Lý thuyết","metrics":{" truncated":false,"redacted":true,"severity":""}]}],"count":3}]},{"key":"alt-py-free","label":"Python for Beginners (free)","group":"Ứng viên mở rộng","source":"python-for-beginners-explore-the-world-of-programming","isNew":false,"reviewed":true,"title":"Python for Beginners: Explore the world of programming","summary":{"structure":"Khóa 190 bài / 5 chương nhưng phân bố **rất lệch: 19 / 54 / 64 / 50 / 3**. Chương 3 một mình chứa 5 chủ đề lớn (tên chương dài 104 ký tự liệt kê Boolean, Conditional, Loops, Lists, Logical & Bitwise) và chiếm 34% cả khóa; chương 4 gộp tiếp 5 chủ đề nữa (Functions, Tuples, Dictionaries, Exceptions, Data Processing). Với học sinh lớp 6–9, một \"chương\" 64 bài không có mốc nghỉ là quá dài — **phải tách chương** (đề xuất cụ thể ở `chapterActions`). Bên trong, 22 mục (section) lại rất chuẩn: mỗi mục là 1 chủ đề PCEP, kết bằng quiz 10 câu — bộ khung mục này chính là điểm mạnh cấu trúc, chỉ cần nâng mục lên thành chương. Nhịp thực hành lệch: chương 1 (19 bài) **không có bài code nào**, mục 'List in advanced applications' và 'Scopes in function' cũng 0 bài code, trong khi mục Exceptions có 10 bài lý thuyết liền / 1 bài code. Quiz đánh số nhảy (4.4 → 4.7, thiếu 4.5–4.6) và 2 quiz cấu hình sai '0 lượt thi'. Có bài Final Project thật (Student Management) — hơn khóa trả phí (kết bằng khảo sát).","content":"Toàn bộ nội dung **đã là tiếng Anh** — đây là phát hiện quan trọng nhất. Chất lượng chữ nghĩa khá: 130 bài lý thuyết không bài nào rỗng (min 160 chữ), ví dụ code chạy đúng, có bảng so sánh, key takeaways. Hai vấn đề lớn: (1) **Văn phong hàn lâm viết cho người lớn** — hàng loạt bài mở đầu bằng 'This paper explores…', 'This document examines…' (8194, 8195, 8196, 8229, 8230…), dài 400–900 chữ không nghỉ, rất nặng với học sinh 11–15 tuổi học tiếng Anh như ngôn ngữ thứ hai; (2) **Gần như không có phương tiện trực quan**: 14 ảnh + 1 video cho 190 bài (khóa trả phí: 98 ảnh + 37 video) — bài Bubble Sort, 2D array, slicing đều mô tả bằng chữ thay vì hình. **Nguồn gốc**: cấu trúc mục, tiêu đề bài và ví dụ khớp giáo trình **OpenEDG Python Institute \"Python Essentials 1\" (chuẩn PCEP)** — tiêu đề nguyên văn ('Python – a tool, not a reptile', 'Variables – data-shaped boxes', 'Literals - the data in itself'), ví dụ đặc trưng (itsy bitsy spider, đếm cừu black_sheep, Monty Python), và dấu vết sót lại: bài 8227 còn nguyên câu về đơn vị tiền 'thalers' của đề bài PE1 gốc, bài 8378 quảng bá khóa 'Testing Essentials with Python' của OpenEDG. Chữ đã được viết lại (paraphrase) chứ không sao nguyên văn, nhưng đây vẫn là **tác phẩm phái sinh từ giáo trình có bản quyền của bên thứ ba — rủi ro pháp lý khi bán ra nước ngoài, cần thẩm định bản quyền trước khi dùng cho Philippines**. Độ chính xác tốt hơn hẳn khóa trả phí: không tìm thấy lỗi sai kiến thức Python nào, nhưng có 1 đề bài mâu thuẫn số liệu (8282: biểu thức cho 86 nhưng expected 98), 1 đề mâu thuẫn giữa mô tả và lời giải (8225), 2 bài lý thuyết trùng ~60% nội dung (8369/8370), và vài bài code bắt trả về chuỗi \"True\"/\"None\" thay vì kiểu đúng.","verdict":"**Nên thay `python-for-beginners` (722.000đ) bằng khóa này.** Lý do quyết định: (1) nội dung đã là tiếng Anh sẵn — khóa trả phí phải dịch toàn bộ 132 bài, tức là công sức dịch lớn hơn nhiều công sửa khóa này; (2) miễn phí, tiết kiệm 722.000đ bản quyền; (3) phủ kiến thức vượt trội — có đủ list, tuple, dictionary, exception, sorting mà khóa trả phí thiếu hẳn phần list; (4) không có lỗi sai kiến thức (khóa trả phí có 4). Đổi lại phải chấp nhận sửa trung bình: tách 2 chương phình to thành 4–5 chương, bổ sung ảnh/video cho các bài thuật toán, thêm ~10 bài code vào các mục trống, và làm mềm văn phong hàn lâm ở các bài mở đầu. Điều kiện tiên quyết: **thẩm định rủi ro bản quyền OpenEDG/PCEP trước khi thương mại hóa**.","fit":"**Dùng được cho học sinh Philippines với mức sửa nội dung gần bằng 0 về ngôn ngữ — lợi thế quyết định.** Cụ thể:\n\n- **Tiếng Anh là ngôn ngữ giảng dạy chính ở Philippines**, và khóa này đã viết 100% bằng tiếng Anh; chỉ **1/190 bài** dính tiếng Việt/bối cảnh Việt Nam (so với 13/132 của khóa trả phí — và khóa đó còn phải dịch toàn bộ). Ví dụ trong bài đều trung tính hoặc thân thiện với Philippines: Grab (hoạt động mạnh ở Philippines), Google Translate, giá vé xem phim bằng USD, Infinity Stones, sách của Alice/Bob.\n- **Rào cản thật sự là trình độ đọc**: văn phong 'This paper explores…' dài 400–900 chữ/bài là giọng giáo trình đại học, trong khi người học mục tiêu là lớp 6–9 (11–15 tuổi) học tiếng Anh như ngôn ngữ thứ hai (ESL). Với bối cảnh nhiều trường Philippines thiếu thiết bị và học sinh học qua điện thoại, bài đọc dài + không ảnh + không video là điểm nghẽn lớn nhất — cần rút gọn câu, thêm hình, và nếu được thì thêm video ngắn cho ~10 chủ đề khó (loops, functions, scope, exceptions).\n- **Độ khó lệch lên trên so với cấp lớp**: giáo trình gốc PCEP viết cho người lớn thi chứng chỉ; các phần bitwise operators, two's complement, De Morgan, unit testing/CI (GitHub Actions, Jenkins) vượt nhu cầu lớp 6–9 — nên hạ xuống 'đọc thêm' hoặc chuyển sang khóa nâng cao.\n- Không có giả định nào chỉ đúng ở Việt Nam. Một bài nhắc 'Codelearn 2025' trong expected output (8255) — giữ được vì là thương hiệu nền tảng.\n- Kết luận: phù hợp để làm khóa lớp 6–9 Philippines **sau khi** làm mềm văn phong và bổ sung trực quan; về ngôn ngữ và văn hóa thì dùng được ngay."},"scores":{"engagement":{"score":4,"note":"Bài đọc giọng hàn lâm ('This paper explores…') dài 400–900 chữ, chỉ 14 ảnh + 1 video cho 190 bài nên rất khô với tuổi 11–15; gỡ lại được phần nào nhờ đề bài code có bối cảnh vui (Infinity Stones 8317, Collatz 8271, Movie Ticket 8227) và có Final Project thật (8238)."},"coverage":{"score":8,"note":"Phủ trọn chuẩn PCEP: in/out, kiểu dữ liệu, toán tử, điều kiện, vòng lặp, **list (thứ khóa trả phí thiếu hẳn)**, tuple, dictionary, exception, sorting, debugging, unit testing — chỉ thiếu xử lý chuỗi chuyên sâu và file (đúng phạm vi khóa cơ bản)."},"clarity":{"score":5,"note":"Cấu trúc bài tốt ( n tại và tải được không","Nếu là tài liệu ôn tập: đặt tên rõ ('Final Review Materials') và thêm đoạn mô tả nội dung file","Nếu không có file: xóa bài này khỏi chương Final"],"preview":"","truncated":false,"redacted":true,"severity":"high"},{"id":8238,"title":"Final Project","type":7,"typeName":"Bài tập nộp","metrics":{"words":257,"chars":1596,"images":0,"duration":120},"issues":[],"action":"keep","note":"","steps":[],"preview":"","truncated":false,"redacted":true,"severity":""}]}],"count":3}]},{"key":"alt-pyadv-free","label":"Python Advanced Course (free)","group":"Ứng viên mở rộng","source":"python-advanced-course","isNew":false,"reviewed":true,"title":"Python Advanced Course","summary":{"structure":"Khóa 210 bài / 5 chương, phân bố **30 / 56 / 49 / 72 / 3**. Vấn đề lớn nhất là chương 4 **\"Miscellaneous\"**: 72 bài = 34% cả khóa, tên chương không nói lên nội dung gì. Đọc thực tế, nó chứa 6 mục hoàn toàn có thể đứng thành chương riêng: (1) generators – lambda – map/filter – closures (9 bài), (2) file streams (10 bài), (3) xử lý file thực tế (7 bài), (4) module os (7 bài), (5) module datetime (20 bài), (6) module calendar (12 bài) — đề xuất tách và đặt tên ở `chapterActions`. Vấn đề thứ hai là **thực hành cực mỏng và lệch**: 18 bài code / 210 bài (8,6%) — chương 1 (30 bài về modules/PIP) **không có bài code nào**, hai mục về File (17 bài) **không có bài thực hành nào** — lặp lại đúng lỗi đã khiến khóa `python-advanced` trả phí bị trừ điểm (chương Xử lý File 12 bài không thực hành); riêng chương 3 (OOP) làm tốt với 10 bài code. Vấn đề thứ ba là **cấu hình quiz hỏng hàng loạt**: 10/23 quiz đặt '0 lượt thi' (toàn bộ 4 quiz chương 1 và 6 quiz chương 4 — học sinh không thể làm bài), ngưỡng đạt không thống nhất (70%/75%/80%), 2 quiz chỉ cho 3 lượt. Điểm sáng: mỗi mục đều kết bằng quiz, chương 5 có Final Quiz 40 câu + Final Assignment 'Personal Task Manager' tổng hợp đúng toàn bộ kiến thức khóa (OOP + file + datetime + os + calendar) — hơn hẳn khóa trả phí.","content":"Toàn bộ nội dung **đã là tiếng Anh**, 0/210 bài cần bản địa hóa. 167 bài lý thuyết không bài nào rỗng (min 128 chữ) — không có lỗi kiểu bài 'Kế thừa' 2 chữ của khóa trả phí; phần OOP dạy chuẩn và có bộ bài lab tốt (Timer, Weeker, Points/Triangle, CountingStack, Queue). **Nguồn gốc**: cấu trúc 4 chương khớp **nguyên văn 4 module của OpenEDG Python Institute \"Python Essentials 2\" (chuẩn PCAP)** — kể cả cái tên chương 'Miscellaneous' cũng là tên module 4 của PE2; các ví dụ đặc trưng PE2 xuất hiện nguyên vẹn (PyPI 'Cheese Shop', stack → AddingStack, bộ lab Timer/Weeker/Points/Triangle, Caesar Cipher, IBAN Validator), bài 8539 còn giữ nguyên nút 'DOWNLOAD Modules and Packages ZIP file' của giáo trình gốc. Chữ đã được viết lại nhưng đây là **tác phẩm phái sinh từ giáo trình có bản quyền — rủi ro pháp lý khi bán ra nước ngoài, phải thẩm định trước khi thương mại hóa**. **Có lỗi kiến thức thật** (khác khóa free 1): bài 8539 viết sai tên file package thành `__init.py__` (đúng là `__init__.py`) — sai 2 lần ở đúng khái niệm then chốt; bài 8819 bịa tên phương thức `itermonthdates3()`/`itermonthdates4()` (đúng là `itermonthdays3/4`); bài 8779 có code mẫu `day=05` — SyntaxError trong Python 3; bài 8785 giải thích mktime() sai (bảng tra ngược tháng/ngày và mô tả sai mốc epoch); bài 8547 dạy lệnh `pip search` đã bị PyPI vô hiệu hóa từ 2021. Ngoài ra: nhiều bài viết theo kiểu 'mỗi method một bài 10 phút' (22 bài string method liên tiếp) đọc như tài liệu tra cứu; bài 'Your first package' mất hẳn step 4 và tham chiếu hình cây thư mục không tồn tại; bài 'Course Summary' chương Final chỉ có 8 chữ placeholder; bài Safe divide (8808) trùng gần nguyên vẹn với bài Safe divide (8383) của khóa free cơ bản.","verdict":"**Nên thay `python-advanced` (900.000đ) bằng khóa này**, vì ba lý do quyết định: (1) nội dung đã 100% tiếng Anh — khóa trả phí tiếng Việt phải dịch toàn bộ 104 bài; (2) miễn phí, tiết kiệm 900.000đ; (3) không có bài rỗng (khóa trả phí có bài 'Kế thừa' trống hoàn toàn) và phủ trọn /* Markdown rất gọn: đủ cho đậm, mã, tiêu đề, danh sách, bảng. */
function md(t){
  if(!t) return "";
  const rows = [];
  let html = esc(t)
    .replace(/`([^`]+)`/g,"<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  const out = [];
  let inList = null;
  for(const raw of html.split("\n")){
    const line = raw.trimEnd();
    let m;
    if(/^\|(.+)\|$/.test(line)){ rows.push(line); continue; }
    if(rows.length){ out.push(table(rows.splice(0))); }
    if(!line){ if(inList){out.push(`</${inList}>`);inList=null;} continue; }
    if((m = line.match(/^#{2,4}\s+(.*)$/))){ if(inList){out.push(`</${inList}>`);inList=null;} out.push(`<h4>${m[1]}</h4>`); continue; }
    if((m = line.match(/^[-*]\s+(.*)$/))){ if(inList!=="ul"){if(inList)out.push(`</${inList}>`);out.push("<ul>");inList="ul";} out.push(`<li>${m[1]}</li>`); continue; }
    if((m = line.match(/^\d+[.)]\s+(.*)$/))){ if(inList!=="ol"){if(inList)out.push(`</${inList}>`);out.push("<ol>");inList="ol";} out.push(`<li>${m[1]}</li>`); continue; }
    if(inList){out.push(`</${inList}>`);inList=null;}
    out.push(`<p>${line}</p>`);
  }
  if(rows.length) out.push(table(rows));
  if(inList) out.push(`</${inList}>`);
  return out.join("");
}
function table(rows){
  const cells = r => r.replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
  const body = rows.filter(r=>!/^\|[\s:|-]+\|$/.test(r));
  if(!body.length) return "";
  const head = cells(body[0]);
  return `<table><thead><tr>${head.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>`
    + body.slice(1).map(r=>`<tr>${cells(r).map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")
    + `</tbody></table>`;
}

const CRIT = [
  ["engagement","Độ hấp dẫn","Hấp dẫn"],
  ["coverage","Độ phủ kiến thức","Độ phủ"],
  ["clarity","Dễ hiểu","Dễ hiểu"],
  ["practice","Thực hành","Thực hành"],
  ["structure","Cấu trúc","Cấu trúc"],
  ["fit","Phù hợp Philippines","Phù hợp"],
  ["accuracy","Độ chính xác","Chính xác"],
];
const band = v => v>=7.5 ? "s-hi" : v>=5 ? "s-mid" : "s-lo";
function avg(sc){
  const v = CRIT.map(([k])=>sc[k]&&sc[k].score).filter(x=>typeof x==="number");
  return v.length ? Math.round(v.reduce((a,b)=>a+b,0)/v.length*10)/10 : null;
}
function sparkline(sc){
  const a = avg(sc); if(a===null) return "";
  return `<div class="sparks">${CRIT.map(([k])=>{
    const v = sc[k]&&sc[k].score;
    const h = typeof v==="number" ? Math.max(8, v/10*100) : 4;
    return `<div><i class="${typeof v==="number"?band(v):""}" style="height:${h}%"></i></div>`;
  }).join("")}</div><div class="sparklab">${CRIT.map(([,,s])=>`<span>${s}</span>`).join("")}</div>`;
}
function compareTable(){

    <div class="sub">Khóa đang chọn và khóa ứng viên, chấm cùng thang. Bấm tên khóa để xem chi tiết.</div>

      ${CRIT.map(([,,s])=>`<th>${s}</th>`).join("")}<th>TB</th></tr></thead>
    <tbody>${groups.map(g=>`
      <tr class="grp"><td colspan="${CRIT.length+2}">${esc(g)}</td></tr>
      ${rows.filter(c=>c.group===g).map(c=>{
        const a = avg(c.scores||{});
        return `<tr>
          <td><a href="#/c/${c.key}">${esc(c.label)}</a></td>
          ${CRIT.map(([k])=>{
            const v = c.scores[k] && c.scores[k].score;
            return `<td>${typeof v==="number"
              ? `<span class="n ${band(v)}">${v}</span>`
              : `<span class="n s-na">–</span>`}</td>`;
          }).join("")}
          <td><span class="n avg ${band(a)}">${a}</span></td>
        </tr>`;
      }).join("")}`).join("")}
    </tbody></table>
    <div class="note">Khóa <strong>Lớp 1–2</strong> là mục tiêu thiết kế của một khóa soạn mới, không phải đánh giá nội dung đã có — không so trực tiếp với các khóa còn lại.</div>
  </div>`;
}

function scorecard(sc, isDesign){
  const a = avg(sc); if(a===null) return "";
  const n = CRIT.filter(([k])=>sc[k]&&typeof sc[k].score==="number").length;
  return `<div class="scorecard">
    <div class="sc-top">
      <div><h3>${isDesign?"Mục tiêu thiết kế":"Điểm đánh giá khóa học"}</h3>
        <div style="font-size:.83rem;color:var(--ink-3)">${
          isDesign?"Khóa soạn mới — đây là mức khóa hướng tới, không phải đánh giá nội dung đã có"
                 :"7 tiêu chí, thang 10"}${n<CRIT.length?` · ${CRIT.length-n} tiêu chí chưa chấm`:""}</div></div>
      <div class="sc-big ${band(a)}" style="color:var(--${a>=7.5?"keep":a>=5?"edit":"del"})">${a}<span>/10</span></div>
    </div>
    ${CRIT.map(([k,name])=>{
      const it = sc[k]; if(!it) return "";
      if(typeof it.score!=="number") return `<div class="sc-row">
        <div class="sc-name">${name}</div>
        <div class="sc-bar"><div class="sc-track"></div><div class="sc-num" style="color:var(--ink-3)">—</div></div>
        ${it.note?`<div class="sc-note">${esc(it.note)}</div>`:""}
      </div>`;
      return `<div class="sc-row">
        <div class="sc-name">${name}</div>
        <div class="sc-bar"><div class="sc-track"><i class="${band(it.score)}" style="width:${it.score*10}%"></i></div>
          <div class="sc-num">${it.score}</div></div>
        ${it.note?`<div class="sc-note">${esc(it.note)}</div>`:""}
      </div>`;
    }).join("")}
  </div>`;
}

const legend = () => `<div class="legend">`
  + Object.entries(ACT).map(([k,v])=>`<span class="lg"><i class="dot ${k}"></i>${v}</span>`).join("")
  + `</div>`;

function bar(s){
  const tot = s.keep+s.edit+s.delete+s.add || 1;
  const seg = k => s[k] ? `<i class="${k}" style="width:${s[k]/tot*100}%"></i>` : "";
  return `<div class="bar">${seg("keep")}${seg("edit")}${seg("delete")}${seg("add")}</div>`;
}

function chapterRow(c,ch,i){

function findAct(c,id){
  for(const ch of c.chapters) for(const s of ch.sections) for(const a of s.activities)
    if(String(a.id??("new-"+a.title))===String(id)) return {a,ch,s};
  return null;
}
function flat(c){
  const out=[]; for(const ch of c.chapters) for(const s of ch.sections) for(const a of s.activities) out.push(a);
  return out;
}
function page3(key,id){
  const c = D.courses.find(x=>x.key===key); if(!c) return page1();
  const hit = findAct(c,id); if(!hit) return page2(key);
  const {a,ch,s} = hit;
  document.getElementById("crumb").innerHTML =
    `<a href="#/">Menu</a><i>›</i><a href="#/c/${c.key}">${esc(c.label)}</a><i>›</i><i>Trang 3</i> ${esc(a.title)}`;
  const m = a.metrics||{};
  const badDur = m.duration>=100000;
  const list = flat(c), ix = list.indexOf(a);
  const link = (o,lbl)=> o?`<a href="#/c/${c.key}/a/${encodeURIComponent(o.id??("new-"+o.title))}">${lbl} ${esc(o.title)}</a>`:`<span></span>`;
  app.innerHTML = `
  <div class="pagehead">
    <h1>${esc(a.title)}</h1>
    <p><span class="tag ${a.action}">${ACT[a.action]}</span>
      &nbsp;${esc(a.typeName)} · ${esc(ch.title)} › ${esc(s.title)}
      ${a.id?` · <span class="mono">#${a.id}</span>`:""}</p>
  </div>
  <div class="detail">
    <div>
      <div class="panel">
        <h3>Số liệu bài học</h3>
        <div class="facts">
          <div><b>${m.words??0}</b><span>CHỮ</span></div>
          <div><b>${m.images??0}</b><span>ẢNH</span></div>
          <div><b>${badDur?"lỗi":(m.duration??0)}</b><span>PHÚT</span></div>
        </div>
        ${(a.issues&&a.issues.length)||a.note?`<h3>Vấn đề phát hiện</h3>`:""}
        ${a.note?`<div class="issue ${a.severity||"med"}">
            <span class="sev">${(a.severity||"med").toUpperCase()}</span>
            <div class="md">${md(a.note)}</div></div>`:""}
        ${(a.issues||[]).map(i=>`<div class="issue ${i.level}">
            <span class="sev">${i.level.toUpperCase()}</span>
            <div class="md">${md(i.text)}</div></div>`).join("")}
      </div>
      <div class="panel" style="margin-top:1.1rem">
        <h3>Nội dung hiện tại${a.truncated?" (cắt bớt)":a.redacted?" (không công khai)":""}</h3>
        <div class="content${a.preview?"":" empty"}">${a.preview?esc(a.preview)
        : a.redacted?"Nội dung bài học gốc không đưa vào bản công khai này. Bản review chỉ hiển thị nhận xét, số liệu và các bước chỉnh sửa."
        :"Bài này chưa có nội dung văn bản — là bài video, file đính kèm, hoặc bài soạn mới chưa viết."}</div>
      </div>
      <div class="navrow">${link(list[ix-1],"←")}${link(list[ix+1],"→")}</div>
    </div>
    <div class="panel track">
      <h3>Track train — vết chỉnh sửa</h3>
      <div id="track"></div>
    </div>
  </div>`;
  renderTrack(c,a);
}

/* ---- track train: lưu trạng thái từng bước vào localStorage ---- */
const TKEY = "duyet-khoa-hoc-v1";
function loadT(){ try{ return JSON.parse(localStorage.getItem(TKEY)||"{}"); }catch(e){ return {}; } }
function saveT(o){ try{ localStorage.setItem(TKEY,JSON.stringify(o)); }catch(e){} }
function renderTrack(c,a){
  const box = document.getElementById("track");
  const steps = a.steps||[];
  const id = c.key+":"+(a.id??("new-"+a.title));
  const st = loadT(); const mine = st[id]||{};
  if(!steps.length){
    box.innerHTML = a.action==="keep"
      ? `<p class="nostep">Bài này giữ nguyên — không có việc phải làm.</p>`
      : `<p class="nostep">Chưa có bước chỉnh sửa cụ thể cho bài này.</p>`;
    return;
  }
  const done = steps.filter((_,i)=>mine[i]).length;
  box.innerHTML = `
    <div class="prog"><b>${done}/${steps.length}</b><span>bước đã xong</span></div>
    <div class="progbar"><i style="width:${done/steps.length*100}%"></i></div>
    <ul class="steps">${steps.map((s,i)=>`<li><label>
      <input type="checkbox" data-i="${i}"${mine[i]?" checked":""}>
      <span class="stxt"><span class="stepnum">B${i+1}</span>${esc(s)}</span>
    </label></li>`).join("")}</ul>
    <div class="trail">
      <div><span>Trạng thái</span><span>${done===0?"Chưa bắt đầu":done===steps.length?"Hoàn tất":"Đang làm"}</span></div>
      ${mine._at?`<div><span>Cập nhật</span><span class="mono">${esc(mine._at)}</span></div>`:""}
    </div>
    ${done?`<button class="reset">Bỏ đánh dấu tất cả</button>`:""}`;
  box.querySelectorAll("input").forEach(inp=>inp.onchange=()=>{
    const s2 = loadT(); const o = s2[id]||{};
    o[inp.dataset.i] = inp.checked;
    o._at = new Date().toLocaleString("vi-VN");
    s2[id]=o; saveT(s2); renderTrack(c,a);
  });
  const rb = box.querySelector(".reset");
  if(rb) rb.onclick = ()=>{ const s2=loadT(); delete s2[id]; saveT(s2); renderTrack(c,a); };
}

/* ---------------- router ---------------- */
function route(){
  document.getElementById("stamp").textContent = "Dựng " + D.generatedAt;
  const h = location.hash.replace(/^#\/?/,"").split("/").filter(Boolean);
  window.scrollTo(0,0);
  if(h[0]==="c" && h[1] && h[2]==="a" && h[3]) return page3(h[1],decodeURIComponent(h[3]));
  if(h[0]==="c" && h[1]) return page2(h[1]);
  page1();
}
addEventListener("hashchange",route);
route();
</script>
